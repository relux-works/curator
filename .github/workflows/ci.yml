name: CI

on:
  push:
    # gate/** carries the throwaway snapshots scripts/remote-gate.sh pushes
    # for the task-board landing gate; the branch is deleted after the run.
    branches: [main, 'gate/**']
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: >-
          Full 40-character relux-works/curator-spec revision holding the candidate
          suite. The lane is schema-agnostic: it qualifies whatever suite the revision
          publishes. Branches, tags, short hashes and placeholders are rejected.
          Leave empty to use candidate_root instead.
        required: false
        default: ""
      candidate_root:
        description: >-
          Absolute path to a conformance/v1 root already materialised on the runner.
          Use instead of candidate_ref when the candidate has no published revision.
        required: false
        default: ""
      candidate_manifest_sha256:
        description: >-
          Expected sha256 of <root>/manifest.json. When set, a mismatch aborts the run
          rather than silently re-baselining onto a different candidate.
        required: false
        default: ""

# Serialize repeated runs of the same workflow/ref without cancelling pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The one immutable committed conformance-root pin, referenced by every
  # default and comparison job. This is curator-spec commit
  # curator-spec v1.0.0-rc.14 peeled tag commit 43bf0a2506d5c354a73bbc3ea4623d4653db10c7; its conformance/v1
  # manifest digest is sha256:6f832d813efc768ea154a7d5076b512ab4be6aa9409d92e11469d21ea9bc69f5.
  # The pin is not a release qualification or a conformance claim. Candidate
  # suites enter through the non-default `candidate-conformance` job only.
  # The root serves the whole module; suite-plan.sh defers nothing against it.
  SPEC_PIN: 43bf0a2506d5c354a73bbc3ea4623d4653db10c7
  # actions/setup-go only began forcing GOTOOLCHAIN=local in v6.0.0; this
  # workflow pins @v5, so without these two lines a job may download a
  # toolchain or read a per-user go env file. The identity step below reads
  # both back rather than trusting this block.
  GOTOOLCHAIN: "local"
  # Quoted deliberately: bare `off` is a YAML 1.1 boolean and would reach the
  # runner as "false", which is a real per-user go env file path, not "off".
  GOENV: "off"
  # The one pnpm release the real-pnpm integration tests admit. This is a
  # COPY of internal/pnpmsource.SupportedPNPMVersion, kept next to the lanes
  # that install it so the installed release is visible in the workflow; the
  # copy cannot drift silently because `.github/ci/pnpm-pin-guard.sh` fails
  # any lane where the two disagree. Every lane that runs the Go test suite
  # installs exactly this release with npm into a lane-local prefix (see the
  # per-lane steps), so the TestRealPinnedPNPM* cases execute everywhere
  # instead of skipping for "pinned pnpm executable unavailable" -- and so a
  # broken pnpm shim that happens to be first on a self-hosted runner's PATH
  # can no longer fail the lane, as the macbook-iv fallback shim did on run
  # 35072267145 (`node <shim> --version` died with a SyntaxError on the
  # shim's `set -euo pipefail` line, failing `read pnpm version` in
  # newConcretePNPMRunner). The lane-local bin directory is prepended via
  # GITHUB_PATH precisely to outrank any such ambient shim.
  #
  # npm, not corepack, is the installer: the tests resolve the pnpm
  # executable and stage its package root, which a corepack dispatcher shim
  # does not provide (rehearsal: 3x FAIL MODULE_NOT_FOUND with corepack, 3x
  # PASS with npm-installed pnpm).
  PNPM_PIN: "10.33.0"

jobs:
  openssh89-fetch:
    name: OpenSSH 8.9 real fetch (hosted Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Install trusted Git and image OpenSSH
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git openssh-client openssh-server
          /usr/bin/ssh -V 2>&1 | tee openssh-version.txt
          grep -E '^OpenSSH_8[.]9p' openssh-version.txt
      - name: Real product fetch with key and policy refusals
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d "$HOME/curator-ssh-control.XXXXXX")"
          server_pid=""
          test_home=""
          cleanup() {
            if [ -f "$fixture/server.log" ]; then sudo cat "$fixture/server.log"; fi
            if [ -n "$server_pid" ]; then sudo kill "$server_pid" || true; fi
            sudo rm -rf "$fixture"
            if [ -n "$test_home" ]; then
              chmod -R u+w "$test_home"
              rm -rf "$test_home"
            fi
          }
          trap cleanup EXIT
          chmod 755 "$fixture"
          /usr/bin/ssh-keygen -q -t ed25519 -N '' -f "$fixture/host-key"
          /usr/bin/ssh-keygen -q -t ed25519 -N '' -f "$fixture/identity"
          /usr/bin/ssh-keygen -q -t ed25519 -N '' -f "$fixture/wrong-identity"
          cp "$fixture/identity.pub" "$fixture/authorized-keys"
          printf '127.0.0.1 %s\n' "$(cut -d ' ' -f 1,2 "$fixture/host-key.pub")" > "$fixture/known-hosts"
          touch "$fixture/empty-config" "$fixture/empty-hosts"
          cat > "$fixture/sshd-config" <<EOF
          LogLevel VERBOSE
          Port 22
          ListenAddress 127.0.0.1
          HostKey $fixture/host-key
          PidFile $fixture/sshd.pid
          AuthorizedKeysFile $fixture/authorized-keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          PermitRootLogin no
          StrictModes yes
          # Hosted runner accounts are password-locked; retain the image's PAM
          # account/session handling while admitting public-key auth only.
          UsePAM yes
          AllowUsers $(id -un)
          EOF
          sudo systemctl stop ssh
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$fixture/sshd-config" -E "$fixture/server.log"
          server_pid="$(sudo cat "$fixture/sshd.pid")"
          git init --bare "$fixture/repository.git"
          git init "$fixture/source"
          printf 'witness\n' > "$fixture/source/control.txt"
          git -C "$fixture/source" add control.txt
          git -C "$fixture/source" -c user.name=Fixture -c user.email=fixture@example.invalid commit -m fixture
          git -C "$fixture/source" push "$fixture/repository.git" HEAD:refs/heads/main
          commit="$(git -C "$fixture/source" rev-parse HEAD)"
          test_home="$(mktemp -d)"
          env -i PATH="$PATH" HOME="$test_home" GOTOOLCHAIN=local GOENV=off \
            go build -o "$fixture/control" ./.github/ci/openssh89
          env -i PATH="$PATH" HOME="$test_home" \
            "$fixture/control" "$fixture" "$commit" "$(id -un)"
  default-build-transport:
    name: Default build transport (hosted Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Default-lane credential isolation and refusal controls
        shell: bash
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          trap 'chmod -R u+w "$test_home"; rm -rf "$test_home"' EXIT
          env -i PATH="$PATH" HOME="$test_home" TMPDIR="$test_home" \
            GOTOOLCHAIN=local GOENV=off \
            go test -count=1 -timeout=10m -v ./internal/install \
              -run '^Test(DefaultTransportInstallScopes|R1ProjectBinSSHSelected|DefaultTransportMissingCredentialsPortable)$'
          env -i PATH="$PATH" HOME="$test_home" TMPDIR="$test_home" \
            GOTOOLCHAIN=local GOENV=off \
            go test -count=1 -timeout=10m -v ./internal/buildrepo \
              -run '^Test(PipelinePreserves(SanitizedAcquisitionReasons|DeterministicAcquisitionRefusals)|TrustedExecutableSelection|TrustedGitFingerprintChange|NoSSHExecutableDiagnostic)$'
          env -i PATH="$PATH" HOME="$test_home" TMPDIR="$test_home" \
            GOTOOLCHAIN=local GOENV=off \
            go test -count=1 -timeout=10m -v ./cmd/curator \
              -run '^Test(ProductionGitToolRejectsProjectPATH|ProductionGitToolIgnoresInheritedSSHWrapper|DefaultLaneSelectsOwnWrapperWithoutInheritedGitSSH|DraftTransportLegacyGolden|ProductionExternalDepsFalseDrivesMirrorFetchToSink)$'
      - name: Detect a dropped default-lane SSH policy
        shell: bash
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          trap 'chmod -R u+w "$test_home"; rm -rf "$test_home"' EXIT
          env -i PATH="$PATH" HOME="$test_home" TMPDIR="$test_home" \
            GOTOOLCHAIN=local GOENV=off \
            python3 .github/ci/default-build-transport-control.py
  # Every admitted family gets its own real toolchain identity and driver
  # qualification. Linux applies the portable native controls; native
  # offline vendored builds replay twice with cold caches on macOS/Windows.
  linux-build-controls:
    name: Linux build controls (hosted)
    # Required native controls and real compiler witnesses always run hosted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private Go state
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/ci/isolate-go-state.sh

      - name: Checkout authoritative protocol suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: 8b34c870ab7deba99b243ba26646d68b07bb630b
          path: protocol-spec
      - uses: actions/setup-go@v5
        with:
          cache: ${{ runner.environment != 'self-hosted' || runner.os != 'Linux' }}
          go-version: 1.25.5
      - name: Verify family toolchain identity
        shell: bash
        env:
          QUALIFIED_GO_VERSION: 1.25.5
        run: |
          set -euo pipefail
          actual="$(go version)"
          echo "$actual"
          [[ "$actual" == "go version go$QUALIFIED_GO_VERSION "* ]]
          [[ "$(go env GOTOOLCHAIN)" == local ]]
          [[ -z "$(go env GOENV)" || "$(go env GOENV)" == off ]]
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Driver qualification and reproducibility
        shell: bash
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
          CURATOR_GO_CONTROL_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/go-native-controls-v2
          CURATOR_REAL_GO_TEST: '1'
          CURATOR_REAL_GO_BUILD_TEST: '1'
          GOFLAGS: '-work'
        run: |
          set -euo pipefail
          bash .github/ci/isolated-test.sh go test -count=1 -timeout=10m -json ./internal/godriver | tee driver-tests.json
          python3 - <<'PYCODE'
          import json
          required = {"TestLinuxControlLaunchRefusals", "TestLinuxNativeControls", "TestLinuxNativeControls/file-bound", "TestLinuxNativeControls/descriptor", "TestLinuxNativeControls/descendant", "TestRealGoV1VendoredBuildIsBoundedAndNotLaunched", "TestRealGoV1VendoredBuildIsBoundedAndNotLaunched/compile-failure", "TestRealGoV1VendoredBuildIsBoundedAndNotLaunched/artifact-tamper", "TestRealGoV1ModuleRootsBuildIsBoundedAndNotLaunched"}
          import sys
          if sys.platform != "win32":
              required |= {"TestBuildManagerLifecycle", "TestBuildDeadlineTearsDownDescendants", "TestBuildDescendantNarrowingControls/omit-acceptance-deadline"}
          if sys.platform == "linux":
              required |= {"TestBuildDescendantNarrowingControls/omit-deadline-domain-termination", "TestLinuxDescriptorProbeAndSyscallFailures"}
          if sys.platform != "win32":
              required |= {'TestWorkerExitNarrowingControls/no-failure-teardown', 'TestWorkerClosedManagerPipes', 'TestWorkerClosedManagerPipes/header', 'TestWorkerClosedManagerPipes/held-stdout', 'TestWorkerClosedManagerPipes/plain-EOF', 'TestWorkerClosedManagerPipes/session-failure', 'TestWorkerClosedManagerPipes/read-error', 'TestWorkerExitNarrowingControls', 'TestWorkerExitNarrowingControls/EOF-only-reader', 'TestWorkerSuccessfulShutdownKillsDescendants', 'TestWorkerExitNarrowingControls/no-success-teardown', 'TestWorkerExitNarrowingControls/ignored-kill-error', 'TestWorkerExitNarrowingControls/collapsed-status', 'TestWorkerTeardownStatusDiagnostic', 'TestWorkerExitNarrowingControls/no-signal-wait', 'TestWorkerFailureKillsDescendants', 'TestWorkerExitNarrowingControls/no-worker-deadline', 'TestWorkerIndependentDeadline', 'TestWorkerExitNarrowingControls/fatal-SIGPIPE', 'TestWorkerPipeHandlerDoesNotLeakToExec', 'TestWorkerCodedCauseKeepsTeardownStatus', 'TestWorkerExitNarrowingControls/ignored-SIGPIPE', 'TestWorkerExitNarrowingControls/coded-cause-first', 'TestWorkerExitNarrowingControls/main-failure-closed-output', 'TestWorkerCheckedKill', 'TestWorkerEOFWhileShutdownQueued'}
          passed = {row.get("Test") for line in open("driver-tests.json") if (row := json.loads(line)).get("Action") == "pass"}
          assert required <= passed, required - passed
          PYCODE
      - name: Unsupported-host CLI refusal through the production install path
        shell: bash
        run: bash .github/ci/isolated-test.sh go test -tags=curator_test_platform -count=1 -timeout=10m -v ./cmd/curator -run '^TestCompiledInstallRefusesUncoveredHost$'
      - name: Driver vet
        run: go vet ./internal/godriver
      - name: Build manager
        run: go build ./cmd/curator
      - name: Restore runner temporary tree permissions
        if: always() && runner.environment == 'self-hosted' && runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: bash scripts/restore-runner-tmp.sh


  go-family-qualification:
    name: Go ${{ matrix.go }} driver (${{ matrix.os }})
    # Linux entries run on the repository's self-hosted Linux runners when the
    # LINUX_SELF_HOSTED repository variable is true, for pushes, dispatches and
    # same-repository pull requests. A pull request from a fork always stays on
    # the hosted image, whatever the variable says. See
    # docs/self-hosted-runner-setup.md.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.LINUX_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","relux-linux","curator"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25.5', '1.26.0', '1.27.1']
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private Go state
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/ci/isolate-go-state.sh

      - name: Checkout authoritative protocol suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: 8b34c870ab7deba99b243ba26646d68b07bb630b
          path: protocol-spec
      - uses: actions/setup-go@v5
        with:
          cache: ${{ runner.environment != 'self-hosted' || runner.os != 'Linux' }}
          go-version: ${{ matrix.go }}
      - name: Verify family toolchain identity
        shell: bash
        env:
          QUALIFIED_GO_VERSION: ${{ matrix.go }}
        run: |
          set -euo pipefail
          actual="$(go version)"
          echo "$actual"
          [[ "$actual" == "go version go$QUALIFIED_GO_VERSION "* ]]
          [[ "$(go env GOTOOLCHAIN)" == local ]]
          [[ -z "$(go env GOENV)" || "$(go env GOENV)" == off ]]
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Driver qualification and reproducibility
        shell: bash
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
          CURATOR_GO_CONTROL_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/go-native-controls-v2
          CURATOR_REAL_GO_TEST: '1'
          CURATOR_REAL_GO_BUILD_TEST: '1'
          GOFLAGS: '-work'
        run: |
          set -euo pipefail
          bash .github/ci/isolated-test.sh go test -count=1 -timeout=10m -json ./internal/godriver | tee driver-tests.json
          python3 - <<'PYCODE'
          import json
          required = {"TestNativeControlInventoryMatchesTheAcceptedVector", "TestCapabilityEvidenceRecordMatchesTheAcceptedVector", "TestExplicitNativeControlVectorCannotDisappear", "TestBuildRejectsArtifactDuringAcceptance", "TestBuildCallerContextDiagnostics", "TestRealGoV1VendoredBuildIsBoundedAndNotLaunched", "TestRealGoV1VendoredBuildIsBoundedAndNotLaunched/compile-failure", "TestRealGoV1VendoredBuildIsBoundedAndNotLaunched/artifact-tamper", "TestRealGoV1ModuleRootsBuildIsBoundedAndNotLaunched"}
          import sys
          if sys.platform != "win32":
              required |= {'TestWorkerExitNarrowingControls/no-failure-teardown', 'TestWorkerClosedManagerPipes', 'TestWorkerClosedManagerPipes/header', 'TestWorkerClosedManagerPipes/held-stdout', 'TestWorkerClosedManagerPipes/plain-EOF', 'TestWorkerClosedManagerPipes/session-failure', 'TestWorkerClosedManagerPipes/read-error', 'TestWorkerExitNarrowingControls', 'TestWorkerExitNarrowingControls/EOF-only-reader', 'TestWorkerSuccessfulShutdownKillsDescendants', 'TestWorkerExitNarrowingControls/no-success-teardown', 'TestWorkerExitNarrowingControls/ignored-kill-error', 'TestWorkerExitNarrowingControls/collapsed-status', 'TestWorkerTeardownStatusDiagnostic', 'TestWorkerExitNarrowingControls/no-signal-wait', 'TestWorkerFailureKillsDescendants', 'TestWorkerExitNarrowingControls/no-worker-deadline', 'TestWorkerIndependentDeadline', 'TestWorkerExitNarrowingControls/fatal-SIGPIPE', 'TestWorkerPipeHandlerDoesNotLeakToExec', 'TestWorkerCodedCauseKeepsTeardownStatus', 'TestWorkerExitNarrowingControls/ignored-SIGPIPE', 'TestWorkerExitNarrowingControls/coded-cause-first', 'TestWorkerExitNarrowingControls/main-failure-closed-output', 'TestWorkerCheckedKill', 'TestWorkerEOFWhileShutdownQueued'}
          passed = {row.get("Test") for line in open("driver-tests.json") if (row := json.loads(line)).get("Action") == "pass"}
          assert required <= passed, required - passed
          PYCODE
      - name: Driver vet
        run: go vet ./internal/godriver
      - name: Build manager
        run: go build ./cmd/curator
      - name: Restore runner temporary tree permissions
        if: always() && runner.environment == 'self-hosted' && runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: bash scripts/restore-runner-tmp.sh


  # ---------------------------------------------------------------------------
  # The default lane, against the committed conformance pin, on all three runners.
  #
  # `test-gate.sh` plans the run from that root alone. The committed pin
  # publishes every artefact `.github/ci/root-artifacts.tsv` declares, so the
  # deferred set is empty here and every package runs with
  # CURATOR_CONFORMANCE_ROOT exported; a pin that stopped publishing one would
  # defer its package and name the missing artefact in the report rather than
  # dropping it. `internal/godriver` implements the successor native inventory
  # on macOS, Linux and Windows; unsupported-host refusal is exercised separately
  # through a test-tagged production CLI entry point. Nothing is
  # dropped without appearing in the uploaded evidence.
  # ---------------------------------------------------------------------------
  # Four jobs share all three measured slow Windows packages; no OS cross product.
  windows-test-shards:
    name: Windows tests (shard ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Checkout authoritative protocol suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: ${{ env.SPEC_PIN }}
          path: protocol-spec
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify pnpm pin matches Go constant
        shell: bash
        run: bash .github/ci/pnpm-pin-guard.sh

      - name: Install pinned pnpm via npm
        shell: bash
        run: |
          set -euo pipefail
          # Lane-local prefix: npm stages a REAL pnpm package root here, which
          # the TestRealPinnedPNPM* cases need (they resolve the executable
          # and stage dir(dir(entrypoint))). A corepack dispatcher shim
          # provides no such root (rehearsal: MODULE_NOT_FOUND).
          npm install -g --prefix "$RUNNER_TEMP/pnpm-prefix" "pnpm@${{ env.PNPM_PIN }}"
          # npm lays out the global bin dir per platform ($prefix/bin on unix,
          # the prefix root itself on Windows); prepend both so the pinned
          # pnpm is first on PATH on every runner and outranks any ambient
          # shim (macbook-iv run 35072267145).
          echo "$RUNNER_TEMP/pnpm-prefix/bin" >>"$GITHUB_PATH"
          echo "$RUNNER_TEMP/pnpm-prefix" >>"$GITHUB_PATH"

      - name: Verify rust pin matches Go constant
        shell: bash
        run: bash .github/ci/rust-pin-guard.sh

      # rustup is the installer on every runner: the hosted images ship it,
      # and the self-hosted runner gets it once per
      # docs/self-hosted-runner-setup.md. The install step reads the channel
      # from rust-toolchain.toml (verified above against
      # internal/rustsource.SupportedRustToolchainVersion), installs exactly
      # that toolchain, and prepends the rustup shim directory to PATH, so
      # `rustc -vV` in the rustsource production cases resolves the pinned
      # release instead of failing the lane (rose-air run 35121791685).
      - name: Install pinned Rust toolchain via rustup
        shell: bash
        run: bash .github/ci/install-rust-toolchain.sh

      - name: Verify Go toolchain identity
        shell: bash
        run: bash .github/ci/toolchain-identity.sh

      - name: Run Windows shard (120m timeout, <60m per package)
        shell: bash
        env:
          CURATOR_CONFORMANCE_ROOT: ${{ github.workspace }}/protocol-spec/conformance/v1
        run: env -u GIT_DIR -u GIT_WORK_TREE -u SSH_AUTH_SOCK -u GOFLAGS -u GIT_CONFIG_COUNT -u GIT_CONFIG_PARAMETERS -u CODEX_HOME -u CLAUDE_CONFIG_DIR -u PI_CODING_AGENT_DIR -u XDG_DATA_HOME -u XDG_STATE_HOME -u XDG_CACHE_HOME HOME="$(mktemp -d)" go run ./tools/envprofilerace -lane windows-test -shard ${{ matrix.shard }} -dir .temp/ci-evidence/windows-shard
      - name: Upload Windows shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-shard-${{ matrix.shard }}
          path: .temp/ci-evidence/windows-shard/
          if-no-files-found: error

  # Three Linux and two macOS jobs share all three packages; no package matrix.
  unix-test-shards:
    name: Unix tests (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.LINUX_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","relux-linux","curator"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, shard: 0}
          - {os: ubuntu-latest, shard: 1}
          - {os: ubuntu-latest, shard: 2}
          - {os: macos-latest, shard: 0}
          - {os: macos-latest, shard: 1}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Initialize private Go state
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/ci/isolate-go-state.sh
      - name: Checkout authoritative protocol suite
        uses: actions/checkout@v4
        with:
          repository: relux-works/curator-spec
          ref: ${{ env.SPEC_PIN }}
          path: protocol-spec
      - uses: actions/setup-go@v5
        with:
          cache: ${{ runner.environment != 'self-hosted' || runner.os != 'Linux' }}
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify pnpm pin matches Go constant
        shell: bash
        run: bash .github/ci/pnpm-pin-guard.sh

      - name: Install pinned pnpm via npm
        shell: bash
        run: |
          set -euo pipefail
          # Lane-local prefix: npm stages a REAL pnpm package root here, which
          # the TestRealPinnedPNPM* cases need (they resolve the executable
          # and stage dir(dir(entrypoint))). A corepack dispatcher shim
          # provides no such root (rehearsal: MODULE_NOT_FOUND).
          npm install -g --prefix "$RUNNER_TEMP/pnpm-prefix" "pnpm@${{ env.PNPM_PIN }}"
          # npm lays out the global bin dir per platform ($prefix/bin on unix,
          # the prefix root itself on Windows); prepend both so the pinned
          # pnpm is first on PATH on every runner and outranks any ambient
          # shim (macbook-iv run 35072267145).
          echo "$RUNNER_TEMP/pnpm-prefix/bin" >>"$GITHUB_PATH"
          echo "$RUNNER_TEMP/pnpm-prefix" >>"$GITHUB_PATH"

      - name: Verify rust pin matches Go constant
        shell: bash
        run: bash .github/ci/rust-pin-guard.sh

      # rustup is the installer on every runner: the hosted images ship it,
      # and the self-hosted runner gets it once per
      # docs/self-hosted-runner-setup.md. The install step reads the channel
      # from rust-toolchain.toml (verified above against
      # internal/rustsource.SupportedRustToolchainVersion), installs exactly
      # that toolchain, and prepends the rustup shim directory to PATH, so
