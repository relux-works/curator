          -run '^(TestGlobalNativeOwnerCleanBootstrapInstall|TestMuseCLIAuthParentBoundary|TestSecurityPostureProfileInstallRefusesMCPDeclarations|TestDraftSourcesSemanticCasesBatch[23]|Test(Project|Global)DryRunKeepsEveryEphemeralPathInOneOperationPrivateRoot|Test(Global)?DryRunRemovesItsOperationPrivateRootOnFailure|TestAuthoritativeDryRunCasesMutateNothingPersistent|TestDryRunEffectBindingsSeeWhatARealOperationWrites)$'

