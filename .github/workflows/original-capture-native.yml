          func writeFailureNames(path string, failures []failureName) error {
            var names strings.Builder
            for _, failure := range failures {
              fmt.Fprintf(&names, "CAPTURE_FAIL Package=%s Test=%s\n", failure.Package, failure.Test)
            }
            if err := os.WriteFile(path, []byte(names.String()), 0600); err != nil {
              return auditFailure("CAPTURE_REASON=capture/audit-failure-name-write")
            }
            return nil
          }

          func appendBounded(current, value string, limit int) (string, bool) {
            remaining := limit - len(current)
            if remaining <= 0 {
              return current, true
            }
            if len(value) <= remaining {
              return current + value, false
            }
            prefix := value[:remaining]
            for len(prefix) > 0 && !utf8.ValidString(prefix) {
              prefix = prefix[:len(prefix)-1]
            }
            return current + prefix, true
          }

          func readNativeParentStream(caseName, stream string) ([]byte, bool, error) {
            childPath := filepath.Join(nativeParentDetailDir, caseName+"."+stream+".raw.txt")
            info, statErr := os.Lstat(childPath)
            if os.IsNotExist(statErr) {
              return []byte(fmt.Sprintf("[Child %s was not captured.]\n", stream)), false, nil
            }
            if statErr != nil || !info.Mode().IsRegular() {
              return nil, false, auditFailure("CAPTURE_REASON=capture/audit-child-output-read")
            }
            childFile, openErr := os.Open(childPath)
            if openErr != nil {
              return nil, false, auditFailure("CAPTURE_REASON=capture/audit-child-output-read")
            }
            output, readErr := io.ReadAll(io.LimitReader(childFile, int64(maxNativeParentStreamBytes+1)))
            closeErr := childFile.Close()
            if readErr != nil || closeErr != nil {
              return nil, false, auditFailure("CAPTURE_REASON=capture/audit-child-output-read")
            }
            truncated := len(output) > maxNativeParentStreamBytes
            if truncated {
              output = output[:maxNativeParentStreamBytes]
            }
            return output, truncated, nil
          }

          func collectFailureDetails(input io.Reader, failures []failureName) ([]failureDetail, error) {
            selected := make([]failureName, 0, maxFailureDetails)
            selectedKeys := make(map[detailKey]bool)
            for _, failure := range failures {
              key := detailKey{Package: failure.Package, Test: failure.Test}
              if failure.Test == "" || len(failure.Package) > 256 || len(failure.Test) > 256 ||
                  failure.Package != publicCapturePackage || publicFailureTestName(failure.Test) != failure.Test || selectedKeys[key] {
                continue
              }
              if len(selected) == maxFailureDetails {
                break
              }
              selected = append(selected, failure)
              selectedKeys[key] = true
            }

            scanner := bufio.NewScanner(input)
            scanner.Buffer(make([]byte, 64*1024), 16*1024*1024)
            output := make(map[detailKey]string, len(selected))
            seen := make(map[detailKey]bool, len(selected))
            truncated := make(map[detailKey]bool, len(selected))
            for scanner.Scan() {
              var event testEvent
              if err := json.Unmarshal(scanner.Bytes(), &event); err != nil {
                return nil, auditFailure("CAPTURE_REASON=capture/audit-invalid-failure-detail-event")
              }
              if event.Action != "output" {
                continue
              }
              key := detailKey{Package: event.Package, Test: event.Test}
              if !selectedKeys[key] {
                continue
              }
              seen[key] = true
              next, cut := appendBounded(output[key], event.Output, maxFailureDetailBytes)
              output[key] = next
              if cut {
                truncated[key] = true
              }
            }
            if scanner.Err() != nil {
              return nil, auditFailure("CAPTURE_REASON=capture/audit-failure-detail-read")
            }

            details := make([]failureDetail, 0, len(selected))
            for _, failure := range selected {
              key := detailKey{Package: failure.Package, Test: failure.Test}
              detail := output[key]
              if !seen[key] || detail == "" {
                detail = "[No output event was recorded.]\n"
              }
              wasTruncated := truncated[key]
              const parentTestPrefix = "TestFreezeOriginalBaseline/"
              caseName := strings.TrimPrefix(failure.Test, parentTestPrefix)
              if nativeParentDetailDir != "" && caseName != failure.Test &&
                  !strings.Contains(caseName, "/") && regexp.MustCompile(`^[A-Za-z0-9_-]+$`).MatchString(caseName) {
                childStdout, rawStdoutTruncated, stdoutErr := readNativeParentStream(caseName, "stdout")
                if stdoutErr != nil {
                  return nil, stdoutErr
                }
                childStderr, rawStderrTruncated, stderrErr := readNativeParentStream(caseName, "stderr")
                if stderrErr != nil {
                  return nil, stderrErr
                }
                boundedAssertion, assertionCut := appendBounded("", detail, maxFailureAssertionBytes)
                boundedStdout, stdoutCut := appendBounded("", string(childStdout), maxNativeParentDetailStreamBytes)
                boundedStderr, stderrCut := appendBounded("", string(childStderr), maxNativeParentDetailStreamBytes)
                childDetail := "Assertion text (limit 432 bytes):\n" + boundedAssertion +
                  "\nChild stdout (limit 240 bytes):\n" + boundedStdout +
                  "\nChild stderr (limit 240 bytes):\n" + boundedStderr
                boundedDetail, detailCut := appendBounded("", childDetail, maxFailureDetailBytes)
                detail = boundedDetail
                wasTruncated = wasTruncated || assertionCut || stdoutCut || stderrCut || detailCut ||
                  rawStdoutTruncated || rawStderrTruncated
              }
              details = append(details, failureDetail{
                Package: failure.Package, Test: failure.Test,
                Output: detail, Truncated: wasTruncated,
              })
            }
            return details, nil
          }

          func checkFailureDetailChildOutput() error {
            base, err := os.MkdirTemp("", "capture-audit-child-output-control-")
            if err != nil {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-child-output-setup")
            }
            defer os.RemoveAll(base)
            previous := nativeParentDetailDir
            nativeParentDetailDir = base
            defer func() { nativeParentDetailDir = previous }()

            const testName = "TestFreezeOriginalBaseline/codex_cli-native-parent"
            stdoutPath := filepath.Join(base, "codex_cli-native-parent.stdout.raw.txt")
            stderrPath := filepath.Join(base, "codex_cli-native-parent.stderr.raw.txt")
            if err := os.WriteFile(stdoutPath, []byte("SAFE_CHILD_STDOUT_CONTROL\\n"), 0600); err != nil {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-child-output-setup")
            }
            if err := os.WriteFile(stderrPath, []byte("SAFE_CHILD_STDERR_CONTROL\\n"), 0600); err != nil {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-child-output-setup")
            }
            event := fmt.Sprintf(`{"Action":"output","Package":%q,"Test":%q,"Output":"SAFE_ASSERTION_CONTROL\\n"}`, publicCapturePackage, testName)
            detail, err := collectFailureDetails(strings.NewReader(event+"\n"), []failureName{{Package: publicCapturePackage, Test: testName}})
            if err != nil || len(detail) != 1 || !strings.Contains(detail[0].Output, "SAFE_ASSERTION_CONTROL") ||
                !strings.Contains(detail[0].Output, "SAFE_CHILD_STDOUT_CONTROL") ||
                !strings.Contains(detail[0].Output, "SAFE_CHILD_STDERR_CONTROL") || len(detail[0].Output) > maxFailureDetailBytes {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-child-output")
            }
            longOutput := strings.Repeat("S", maxNativeParentDetailStreamBytes+64)
            if err := os.WriteFile(stdoutPath, []byte(longOutput), 0600); err != nil {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-child-output-setup")
            }
            if err := os.WriteFile(stderrPath, []byte(longOutput), 0600); err != nil {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-child-output-setup")
            }
            detail, err = collectFailureDetails(strings.NewReader(event+"\n"), []failureName{{Package: publicCapturePackage, Test: testName}})
            if err != nil || len(detail) != 1 || !detail[0].Truncated || len(detail[0].Output) > maxFailureDetailBytes {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-child-output-bound")
            }
            return nil
          }

          func writeFailureDetails(path string, details []failureDetail) error {
            var report strings.Builder
            for _, detail := range details {
              if len(detail.Package) > 256 || len(detail.Test) > 256 ||
                  detail.Package != publicCapturePackage || publicFailureTestName(detail.Test) != detail.Test {
                continue
              }
              header := fmt.Sprintf("CAPTURE_DETAIL Package=%s Test=%s\n", detail.Package, detail.Test)
              if report.Len()+len(header) > maxFailureDetailsBytes {
                break
              }
              report.WriteString(header)
              body, cut := appendBounded("", detail.Output, maxFailureDetailsBytes-report.Len())
              report.WriteString(body)
              if detail.Truncated || cut {
                marker := "\n[Failure detail truncated by the capture limit.]\n"
                if report.Len()+len(marker) <= maxFailureDetailsBytes {
                  report.WriteString(marker)
                }
              }
            }
            if report.Len() == 0 {
              report.WriteString("No failing subtest detail was captured.\n")
            }
            if report.Len() > maxFailureDetailsBytes {
              return auditFailure("CAPTURE_REASON=capture/audit-failure-detail-bound")
            }
            if err := os.WriteFile(path, []byte(report.String()), 0600); err != nil {
              return auditFailure("CAPTURE_REASON=capture/audit-failure-detail-write")
            }
            return nil
          }

          func printCounts(result counts) {
            executed := result.baseline + result.launchers
            passed := result.baselinePass + result.launcherPass
            failed := result.baselineFail + result.launcherFail
            skipped := result.baselineSkip + result.launcherSkip
            fmt.Printf("executed=%d\npassed=%d\nfailed=%d\nskipped=%d\n", executed, passed, failed, skipped)
            fmt.Printf("baseline_rows=%d\nlauncher_rows=%d\n", result.baseline, result.launchers)
            fmt.Printf("repeat_seen=%d\nrepeat_passed=%d\n", result.repeatSeen, result.repeatPass)
            fmt.Printf("comparator_rows=%d\ncomparator_passed=%d\n", result.comparator, result.comparatorPass)
            fmt.Printf("comparator_failed=%d\ncomparator_skipped=%d\n", result.comparatorFail, result.comparatorSkip)
            fmt.Printf("comparator_mcp_control_passed=%d\ncomparator_launcher_control_passed=%d\n", result.mcpControlPass, result.launcherControlPass)
            fmt.Printf("root_tests_passed=%d\nwindows_root_parameter_passed=%d\n", result.rootPass, result.windowsRootPass)
            fmt.Printf("all_test_failures=%d\nall_test_skips=%d\noutput_json_files=%d\n", result.allFails, result.allSkips, result.outputFiles)
          }

          func run() error {
            if err := selfCheck(); err != nil { return err }
            if len(os.Args) != 7 { return auditFailure("CAPTURE_REASON=capture/audit-invalid-arguments") }
            nativeParentDetailDir = os.Args[6]
            if err := checkFailureDetailChildOutput(); err != nil { return err }
            testExit, err := strconv.Atoi(os.Args[3])
            if err != nil { return auditFailure("CAPTURE_REASON=capture/audit-invalid-test-exit") }
            input, err := os.Open(os.Args[1])
            if err != nil { return auditFailure("CAPTURE_REASON=capture/audit-test-log-open") }
            result, failures, parseErr := parseLog(input)
            closeErr := input.Close()
            if parseErr != nil { return parseErr }
            if closeErr != nil { return auditFailure("CAPTURE_REASON=capture/audit-test-log-close") }
            if testExit != 0 {
              if err := writeFailureNames(os.Args[4], failures); err != nil { return err }
              detailInput, err := os.Open(os.Args[1])
              if err != nil { return auditFailure("CAPTURE_REASON=capture/audit-failure-detail-open") }
              details, detailErr := collectFailureDetails(detailInput, failures)
              detailCloseErr := detailInput.Close()
              if detailErr != nil { return detailErr }
              if detailCloseErr != nil { return auditFailure("CAPTURE_REASON=capture/audit-failure-detail-close") }
              if err := writeFailureDetails(os.Args[5], details); err != nil { return err }
            }
            entries, err := os.ReadDir(os.Args[2])
            if err != nil {
              printCounts(result)
              return auditFailure("CAPTURE_REASON=capture/audit-output-list")
            }
            result.outputFiles = len(entries)
            for _, entry := range entries {
              if entry.IsDir() || filepath.Ext(entry.Name()) != ".json" {
                printCounts(result)
                return auditFailure("CAPTURE_REASON=capture/audit-output-entry-unexpected")
              }
            }
            printCounts(result)
            if testExit != 0 { return auditFailure("CAPTURE_REASON=capture/go-test-failed") }
            if result.outputFiles != 47 { return auditFailure("CAPTURE_REASON=capture/audit-output-count-incomplete") }
            if !result.rowCountsValid() { return auditFailure("CAPTURE_REASON=capture/audit-row-counts-incomplete") }
            return nil
          }

          func main() {
            if err := run(); err != nil {
              if failure, ok := err.(auditFailure); ok {
                fmt.Fprintln(os.Stderr, failure.Error())
              } else {
                fmt.Fprintln(os.Stderr, "CAPTURE_REASON=capture/audit-internal-failure")
              }
              os.Exit(1)
            }
          }
          GO
          cat > "$CAPTURE_ROOT/native-parent-env.go" <<'GO'
          package main

          import (
            "fmt"
            "io"
            "os"
            "os/exec"
            "path/filepath"
            "strings"
          )

          const maxChildStderrBytes = 512
          const maxChildStdoutBytes = 512
          const childStderrTruncation = "\n[child stderr truncated at 512 bytes]\n"
          const childStdoutTruncation = "\n[child stdout truncated at 512 bytes]\n"

          type cappedWriter struct {
            writer    io.Writer
            remaining int
            truncated bool
          }

          func (writer *cappedWriter) Write(data []byte) (int, error) {
            originalLength := len(data)
            if writer.remaining <= 0 {
              if originalLength > 0 {
                writer.truncated = true
              }
              return originalLength, nil
            }
            if len(data) > writer.remaining {
              data = data[:writer.remaining]
              writer.truncated = true
            }
            written, err := writer.writer.Write(data)
            writer.remaining -= written
            if err != nil {
              return written, err
            }
            if written != len(data) {
              return written, io.ErrShortWrite
            }
            return originalLength, nil
          }

          func childEnvironment(arguments []string) ([]string, string, []string, bool) {
            if len(arguments) < 3 || arguments[0] != "-i" {
              return nil, "", nil, false
            }
            index := 1
            environment := make([]string, 0, 2)
            for index < len(arguments) {
              assignment := arguments[index]
              separator := strings.IndexByte(assignment, '=')
              if separator <= 0 {
                break
              }
              environment = append(environment, assignment)
              index++
            }
            if index >= len(arguments) || len(environment) == 0 {
              return nil, "", nil, false
            }
            return environment, arguments[index], arguments[index+1:], true
          }

          func nativeParentCase(arguments []string) string {
            caseName := ""
            hasResult := false
            for _, argument := range arguments {
              if strings.HasPrefix(argument, "-native-parent-worker-case=") {
                caseName = strings.TrimPrefix(argument, "-native-parent-worker-case=")
              }
              if strings.HasPrefix(argument, "-native-parent-worker-result=") {
                hasResult = true
              }
            }
            if !hasResult || caseName == "" || strings.ContainsAny(caseName, `/\\`) {
              return ""
            }
            for _, char := range caseName {
              if !(char >= 'A' && char <= 'Z' || char >= 'a' && char <= 'z' ||
                char >= '0' && char <= '9' || char == '_' || char == '-') {
                return ""
              }
            }
            return caseName
          }

          func openChildStream(detailDir, caseName, stream string, limit int, marker string) (*os.File, *cappedWriter, error) {
            path := filepath.Join(detailDir, caseName+"."+stream+".raw.txt")
            file, err := os.OpenFile(path, os.O_CREATE|os.O_TRUNC|os.O_WRONLY, 0600)
            if err != nil {
              return nil, nil, err
            }
            return file, &cappedWriter{writer: file, remaining: limit - len(marker)}, nil
          }

          func runRealEnv(arguments []string) int {
            realEnv := os.Getenv("CAPTURE_NATIVE_PARENT_REAL_ENV")
            if realEnv == "" {
              fmt.Fprintln(os.Stderr, "native-parent env wrapper has no real env utility")
              return 127
            }
            command := exec.Command(realEnv, arguments...)
            command.Stdin, command.Stdout, command.Stderr = os.Stdin, os.Stdout, os.Stderr
            if err := command.Run(); err != nil {
              if exit, ok := err.(*exec.ExitError); ok {
                return exit.ExitCode()
              }
              fmt.Fprintln(os.Stderr, "native-parent env utility could not start")
              return 127
            }
            return 0
          }

          func runChild(arguments []string) int {
            environment, program, programArgs, ok := childEnvironment(arguments)
            if !ok {
              return runRealEnv(arguments)
            }
            caseName := nativeParentCase(programArgs)
            detailDir := os.Getenv("CAPTURE_NATIVE_PARENT_DETAIL_DIR")
            if caseName == "" || detailDir == "" {
              return runRealEnv(arguments)
            }
            if err := os.MkdirAll(detailDir, 0700); err != nil {
              fmt.Fprintln(os.Stderr, "native-parent output capture setup failed")
              return 125
            }
            stdoutFile, childStdout, err := openChildStream(
              detailDir, caseName, "stdout", maxChildStdoutBytes, childStdoutTruncation,
            )
            if err != nil {
              fmt.Fprintln(os.Stderr, "native-parent output capture setup failed")
              return 125
            }
            stderrFile, childStderr, err := openChildStream(
              detailDir, caseName, "stderr", maxChildStderrBytes, childStderrTruncation,
            )
            if err != nil {
              _ = stdoutFile.Close()
              fmt.Fprintln(os.Stderr, "native-parent output capture setup failed")
              return 125
            }
            command := exec.Command(program, programArgs...)
            command.Env = environment
            command.Stdin = os.Stdin
            command.Stdout = childStdout
            command.Stderr = childStderr
            runErr := command.Run()
            if childStdout.truncated {
              if _, err := io.WriteString(stdoutFile, childStdoutTruncation); err != nil && runErr == nil {
                runErr = err
              }
            }
            if childStderr.truncated {
              if _, err := io.WriteString(stderrFile, childStderrTruncation); err != nil && runErr == nil {
                runErr = err
              }
            }
            stdoutCloseErr := stdoutFile.Close()
            stderrCloseErr := stderrFile.Close()
            if stdoutCloseErr != nil && runErr == nil {
              runErr = stdoutCloseErr
            }
            if stderrCloseErr != nil && runErr == nil {
              runErr = stderrCloseErr
            }
            if runErr == nil {
              return 0
            }
            if exit, ok := runErr.(*exec.ExitError); ok {
              return exit.ExitCode()
            }
            fmt.Fprintln(os.Stderr, "native-parent child command could not start")
            return 127
          }

          func main() { os.Exit(runChild(os.Args[1:])) }
          GO
          native_path() {
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              cygpath -w "$1"
            else
              printf '%s' "$1"
            fi
          }
          go_dir="$(dirname "$(command -v go)")"
          git_dir="$(dirname "$(command -v git)")"
          env_dir="$(dirname "$(command -v env)")"
          trusted_path="$go_dir:$git_dir:$env_dir"
          home_path="$(native_path "$CAPTURE_ROOT/home")"
          temp_path="$(native_path "$CAPTURE_ROOT/tmp")"
          cache_path="$(native_path "$CAPTURE_ROOT/gocache")"
          modcache_path="$(native_path "$CAPTURE_ROOT/gomodcache")"
          gopath_path="$(native_path "$CAPTURE_ROOT/gopath")"
          output_path="$(native_path "$CAPTURE_ROOT/raw-output")"
          repeat_path="$(native_path "$CAPTURE_ROOT/repeat-raw")"
          gitconfig_path="$(native_path "$CAPTURE_ROOT/home/.gitconfig")"
          clean_env=(
            "HOME=$home_path"
            "TMPDIR=$temp_path"
            "TMP=$temp_path"
            "TEMP=$temp_path"
            "GOCACHE=$cache_path"
            "GOMODCACHE=$modcache_path"
            "GOPATH=$gopath_path"
            "GIT_CONFIG_NOSYSTEM=1"
            "GIT_CONFIG_GLOBAL=$gitconfig_path"
            "GIT_TERMINAL_PROMPT=0"
            "GCM_INTERACTIVE=Never"
            "GOENV=off"
            "GOTOOLCHAIN=local"
            "PATH=$trusted_path"
          )
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            systemroot="${SYSTEMROOT:-${WINDIR:-}}"
            if [[ -z "$systemroot" ]]; then
              printf 'CAPTURE_REASON=capture/systemroot-missing\n' >&2
              exit 2
            fi
            trusted_path="$trusted_path:$(cygpath -u "$systemroot")/System32"
            clean_env[13]="PATH=$trusted_path"
            clean_env+=("SYSTEMROOT=$systemroot" "WINDIR=${WINDIR:-$systemroot}" \
              "USERPROFILE=$home_path" "APPDATA=$home_path/AppData/Roaming" \
              "LOCALAPPDATA=$home_path/AppData/Local")
          else
            trusted_path="$trusted_path:/usr/bin:/bin"
            clean_env[13]="PATH=$trusted_path"
          fi
          native_parent_wrapper_dir="$CAPTURE_ROOT/native-parent-wrapper"
          native_parent_detail_dir="$CAPTURE_ROOT/native-parent-details"
          mkdir -p "$native_parent_wrapper_dir" "$native_parent_detail_dir"
          trusted_path="$native_parent_wrapper_dir:$trusted_path"
          clean_env[13]="PATH=$trusted_path"
          native_parent_detail_path="$(native_path "$native_parent_detail_dir")"
          real_env_path="$(native_path "$(command -v env)")"
          native_parent_env_binary="$native_parent_wrapper_dir/env"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            native_parent_env_binary="$native_parent_env_binary.exe"
          fi
          wrapper_build_stdout="$CAPTURE_ROOT/native-parent-env-build.stdout"
          wrapper_build_stderr="$CAPTURE_ROOT/native-parent-env-build.stderr"
          if ! env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off \
            go build -o "$native_parent_env_binary" "$CAPTURE_ROOT/native-parent-env.go" \
            > "$wrapper_build_stdout" 2> "$wrapper_build_stderr"; then
            printf 'CAPTURE_REASON=capture/native-parent-env-wrapper-build-failed\n' >&2
            exit 1
          fi
          if ! find "$CAPTURE_ROOT/raw-output" -mindepth 1 -print -quit > "$CAPTURE_ROOT/output-entry-check.raw.txt"; then
            printf 'CAPTURE_REASON=capture/output-directory-scan-failed\n' >&2
            exit 1
          fi
          if [[ -s "$CAPTURE_ROOT/output-entry-check.raw.txt" ]]; then
            printf 'CAPTURE_REASON=capture/output-directory-not-empty\n' >&2
            exit 2
          fi
          failed_names_file="$CAPTURE_ROOT/test-failures.names.txt"
          failure_details_file="$CAPTURE_ROOT/failure-details.txt"
          private_test_log="$CAPTURE_ROOT/test-output.private.raw.txt"
          if env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off \
            HARNESS_CAPTURE_OUT="$output_path" \
            HARNESS_REPEAT_CAPTURE_OUT="$repeat_path" \
            CAPTURE_NATIVE_PARENT_DETAIL_DIR="$native_parent_detail_path" \
            CAPTURE_NATIVE_PARENT_REAL_ENV="$real_env_path" \
            "CAPTURE_WORKFLOW_PATH=$CAPTURE_WORKFLOW_PATH" \
            go test -p 1 -count=1 -v -json ./.temp/original-capture/harnessparity \
            > "$private_test_log" 2>&1; then
            test_exit=0
          else
            test_exit=$?
          fi
          if env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off \
            go run "$CAPTURE_ROOT/audit.go" "$private_test_log" \
            "$CAPTURE_ROOT/raw-output" "$test_exit" "$failed_names_file" "$failure_details_file" \
            "$native_parent_detail_path" \
            > "$CAPTURE_ROOT/audit-metrics.raw.txt" 2> "$CAPTURE_ROOT/audit-error.raw.txt"; then
            audit_exit=0
          else
            audit_exit=$?
          fi
          cat "$CAPTURE_ROOT/audit-metrics.raw.txt" > "$CAPTURE_ROOT/audit-output.raw.txt"
          audit_metrics=()
          audit_metric_count=0
          metrics_valid=true
          while IFS= read -r line; do
            if [[ "$line" =~ ^[a-z0-9_]+=[0-9]+$ ]]; then
              audit_metrics+=("$line")
              audit_metric_count=$((audit_metric_count + 1))
            else
              metrics_valid=false
              break
            fi
          done < "$CAPTURE_ROOT/audit-metrics.raw.txt"
          if [[ "$audit_metric_count" -ne 19 ]]; then metrics_valid=false; fi
          if [[ "$metrics_valid" != "true" ]]; then audit_exit=2; fi
          {
            printf 'test_command_exit=%s\naudit_exit=%s\n' "$test_exit" "$audit_exit"
            if [[ "$metrics_valid" == "true" ]]; then
              printf '%s\n' "${audit_metrics[@]}"
            fi
          } >> "$GITHUB_OUTPUT"
          {
            printf '### Native capture: %s (%s)\n\n' "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'Test command exit: %s. Go audit command exit: %s.\n' "$test_exit" "$audit_exit"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$audit_exit" -ne 0 ]]; then
            if [[ "$metrics_valid" != "true" ]]; then
              audit_reason_line='CAPTURE_REASON=capture/audit-metrics-invalid'
            else
              reason_found=false
              audit_reason_line=''
              while IFS= read -r line; do
                if [[ "$line" =~ ^CAPTURE_REASON=capture/[a-z0-9-]+$ ]]; then
                  audit_reason_line="$line"
                  reason_found=true
                  break
                fi
              done < "$CAPTURE_ROOT/audit-error.raw.txt"
              if [[ "$reason_found" != "true" ]]; then
                audit_reason_line='CAPTURE_REASON=capture/audit-command-failed'
              fi
            fi
            printf '%s\n' "$audit_reason_line" >> "$CAPTURE_ROOT/audit-output.raw.txt"
            printf '%s\n' "$audit_reason_line" >&2
            if [[ "$audit_metric_count" -gt 0 ]]; then
              for line in "${audit_metrics[@]}"; do
                printf 'CAPTURE_COUNT %s\n' "$line" >&2
              done
            fi
          fi
          exit "$audit_exit"

      - name: Sanitize and verify artifact contents
        id: sanitize
        if: always() && steps.directories.outcome == 'success' && steps.setup_go.outcome == 'success'
        shell: bash
        env:
          CAPTURE_ROOT: ${{ steps.directories.outputs.root_posix }}
          REQUIRE_47: ${{ steps.capture.outcome == 'success' }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          WORKFLOW_HEAD: ${{ github.sha }}
          MATRIX_RUNNER: ${{ matrix.runner }}
          CAPTURE_UMASK: ${{ steps.capture.outputs.posix_umask || 'not-recorded' }}
          CAPTURE_PROBE_MODE: ${{ steps.capture.outputs.probe_dir_mode || 'not-recorded' }}
        run: |
          set -euo pipefail
          sanitize_shell_error() {
            local status=$?
            trap - ERR
            printf 'CAPTURE_REASON=sanitize/shell-command-failed\n' >&2
            exit "$status"
          }
          trap sanitize_shell_error ERR
          cd "$GITHUB_WORKSPACE"
          sanitizer_source_dir="$GITHUB_WORKSPACE/.temp/capture-exporter"
          seal_source_dir="$GITHUB_WORKSPACE/.temp/capture-seal"
          mkdir -p "$sanitizer_source_dir"
          mkdir -p "$seal_source_dir"
          cat > "$seal_source_dir/seal.go" <<'GO'
          package main

          import (
            "bytes"
            "crypto/sha256"
            "encoding/hex"
            "encoding/json"
            "fmt"
            "os"
            "path/filepath"
            "regexp"
            "sort"
            "strings"
          )

          const legacyBaseRevision = "267bbf477354f4f3d35c9530ec8da0503cd86b8a"

          type sourcePin struct {
            Path   string `json:"path"`
            SHA256 string `json:"sha256"`
          }

          var driverPins = []sourcePin{
            {"ancestor_projection_test.go", "f1269bafd126b7d3c57cb4a2007ff407d912288b4c049ec83908244cca749341"},
            {"capture_homes_test.go", "35457d6728df2436292d85702621318d33b420b7d8aafd891cc96421be8d293b"},
            {"capture_launchers_test.go", "e202ab658c45b6ebaba731c2a72eda82de4cb94583b251d0f73054361e124518"},
            {"controls_test.go", "2928b6a0001dccfd39f430caa93ced8528b23653f4b3542103639eef09b908e4"},
            {"launcher_fixture_test.go", "deaefe19fadacd5d449176bfab0aa60d029c842f14c5070fbea7e9f0e539e983"},
            {"legacy_fixture_test.go", "b96b012122f3ecb70537e2f64ca5fefbbdf6225123ce11f3ff7d6fc038c3a6eb"},
          }

          type byteFile struct {
            name string
            data []byte
          }

          type fileSeal struct {
            Path              string `json:"path"`
            Bytes             int    `json:"bytes"`
            ObservedSHA256    string `json:"observed_sha256"`
            ExportedSHA256    string `json:"exported_sha256"`
          }

          type groupSeal struct {
            Count                    int        `json:"count"`
            ObservedManifestSHA256   string     `json:"observed_manifest_sha256"`
            ExportedManifestSHA256   string     `json:"exported_manifest_sha256"`
            Files                    []fileSeal `json:"files"`
          }

          type toolVersionSeal struct {
            Go  string `json:"go"`
            Git string `json:"git"`
          }

          type workflowSeal struct {
            Head     string `json:"head"`
            Tree     string `json:"tree"`
            Platform string `json:"platform"`
            Runner   string `json:"runner"`
            Tools    toolVersionSeal `json:"tool_versions"`
          }

          type driverSeal struct {
            Revision string      `json:"revision"`
            Scope    string      `json:"scope"`
            Files    []sourcePin `json:"files"`
          }

          type captureSeal struct {
            Umask             string    `json:"umask"`
            ProbeDirectoryMode string   `json:"probe_directory_mode"`
            Cases             groupSeal `json:"cases"`
            RepeatObservations groupSeal `json:"repeat_observations"`
          }

          type sealDocument struct {
            Schema       string       `json:"schema"`
            LegacyBase   string       `json:"legacy_base"`
            Workflow     workflowSeal `json:"workflow"`
            DriverSource driverSeal   `json:"driver_source"`
            Capture      captureSeal  `json:"capture"`
            NotBound     []string     `json:"not_bound"`
          }

          var shaPattern = regexp.MustCompile(`^[0-9a-f]{40}$`)
          var versionPattern = regexp.MustCompile(`^[0-9]+\.[0-9]+\.[0-9]+$`)

          func sha256Hex(data []byte) string {
            digest := sha256.Sum256(data)
            return hex.EncodeToString(digest[:])
          }

          func readRegular(path string) ([]byte, error) {
            info, err := os.Lstat(path)
            if err != nil || !info.Mode().IsRegular() {
              return nil, fmt.Errorf("seal/input-invalid")
            }
            data, err := os.ReadFile(path)
            if err != nil {
              return nil, fmt.Errorf("seal/input-invalid")
            }
            return data, nil
          }

          func writeRegular(path string, data []byte) error {
            if err := os.WriteFile(path, data, 0600); err != nil {
              return fmt.Errorf("seal/control-setup-failed")
            }
            if err := os.Chmod(path, 0600); err != nil {
              return fmt.Errorf("seal/control-setup-failed")
            }
            return nil
          }

          func readGroup(directory string, expected int, exported bool) ([]byteFile, []byte, error) {
            info, err := os.Lstat(directory)
            if err != nil || !info.IsDir() {
              return nil, nil, fmt.Errorf("seal/group-invalid")
            }
            entries, err := os.ReadDir(directory)
            if err != nil || len(entries) != expected+btoi(exported) {
              return nil, nil, fmt.Errorf("seal/group-count-invalid")
            }
            files := make([]byteFile, 0, expected)
            var manifest []byte
            for _, entry := range entries {
              if entry.Name() == "MANIFEST.json" && exported {
                manifest, err = readRegular(filepath.Join(directory, entry.Name()))
                if err != nil {
                  return nil, nil, err
                }
                continue
              }
              if entry.Name() == "MANIFEST.json" || filepath.Base(entry.Name()) != entry.Name() || filepath.Ext(entry.Name()) != ".json" {
                return nil, nil, fmt.Errorf("seal/group-entry-invalid")
              }
              data, err := readRegular(filepath.Join(directory, entry.Name()))
              if err != nil {
                return nil, nil, err
              }
              files = append(files, byteFile{name: entry.Name(), data: data})
            }
            if len(files) != expected || (exported && manifest == nil) {
              return nil, nil, fmt.Errorf("seal/group-count-invalid")
            }
            sort.Slice(files, func(i, j int) bool { return files[i].name < files[j].name })
            return files, manifest, nil
          }

          func btoi(value bool) int {
            if value { return 1 }
            return 0
          }

          func canonicalManifest(files []byteFile) []byte {
            ordered := append([]byteFile(nil), files...)
            sort.Slice(ordered, func(i, j int) bool { return ordered[i].name < ordered[j].name })
            var encoded bytes.Buffer
            fmt.Fprintf(&encoded, "{\"schema\":\"capture-manifest/v2\",\"legacy_base\":%q,\"files\":[", legacyBaseRevision)
            for index, file := range ordered {
              if index > 0 { encoded.WriteByte(',') }
              name, _ := json.Marshal(file.name)
              fmt.Fprintf(&encoded, "{\"path\":%s,\"bytes\":%d,\"sha256\":%q}", name, len(file.data), sha256Hex(file.data))
            }
            encoded.WriteString("]}\n")
            return encoded.Bytes()
          }

          func sealGroup(rawDir, exportedDir string, count int) (groupSeal, error) {
            observed, _, err := readGroup(rawDir, count, false)
            if err != nil { return groupSeal{}, err }
            exported, exportedManifest, err := readGroup(exportedDir, count, true)
            if err != nil { return groupSeal{}, err }
            if len(observed) != len(exported) { return groupSeal{}, fmt.Errorf("seal/group-shape-mismatch") }
            files := make([]fileSeal, 0, count)
            for index := range observed {
              if observed[index].name != exported[index].name || !bytes.Equal(observed[index].data, exported[index].data) {
                return groupSeal{}, fmt.Errorf("seal/payload-mismatch")
              }
              observedHash := sha256Hex(observed[index].data)
              exportedHash := sha256Hex(exported[index].data)
              if observedHash != exportedHash { return groupSeal{}, fmt.Errorf("seal/payload-hash-mismatch") }
              files = append(files, fileSeal{
                Path: observed[index].name, Bytes: len(observed[index].data),
                ObservedSHA256: observedHash, ExportedSHA256: exportedHash,
              })
            }
            observedManifest := canonicalManifest(observed)
            if !bytes.Equal(observedManifest, exportedManifest) {
              return groupSeal{}, fmt.Errorf("seal/manifest-mismatch")
            }
            return groupSeal{
              Count: count,
              ObservedManifestSHA256: sha256Hex(observedManifest),
              ExportedManifestSHA256: sha256Hex(exportedManifest),
              Files: files,
            }, nil
          }

          func verifyArtifactRoot(directory string) error {
            info, err := os.Lstat(directory)
            if err != nil || !info.IsDir() { return fmt.Errorf("seal/artifact-root-invalid") }
            expected := map[string]bool{
              "outputs": true, "repeat-observations": true,
              "audit-output.raw.txt": true, "module-download.raw.txt": true,
              "source-verification.log": true, "failure-details.txt": true,
            }
            entries, err := os.ReadDir(directory)
            if err != nil || len(entries) != len(expected) { return fmt.Errorf("seal/artifact-root-shape-invalid") }
            for _, entry := range entries {
              if !expected[entry.Name()] { return fmt.Errorf("seal/artifact-root-shape-invalid") }
              item, err := os.Lstat(filepath.Join(directory, entry.Name()))
              if err != nil { return fmt.Errorf("seal/artifact-root-shape-invalid") }
              if entry.Name() == "outputs" || entry.Name() == "repeat-observations" {
                if !item.IsDir() { return fmt.Errorf("seal/artifact-root-shape-invalid") }
              } else if !item.Mode().IsRegular() {
                return fmt.Errorf("seal/artifact-root-shape-invalid")
              }
            }
            return nil
          }

          func verifyDriver(sourceDir, copyDir, sourceLog string) error {
            expectedLines := make([]string, 0, len(driverPins)*2)
            for _, item := range []struct{ root, prefix string }{
              {sourceDir, "testdata/originalcapture"},
              {copyDir, ".temp/original-capture/harnessparity"},
            } {
              for _, pin := range driverPins {
                data, err := readRegular(filepath.Join(item.root, pin.Path))
                if err != nil || sha256Hex(data) != pin.SHA256 {
                  return fmt.Errorf("seal/driver-pin-mismatch")
                }
                expectedLines = append(expectedLines, fmt.Sprintf("OK %s/%s %s", item.prefix, pin.Path, pin.SHA256))
              }
            }
            logData, err := readRegular(sourceLog)
            if err != nil || string(logData) != strings.Join(expectedLines, "\n")+"\n" {
              return fmt.Errorf("seal/driver-verification-log-mismatch")
            }
            return nil
          }

          func validMetadata(head, tree, platform, runner, umask, probeMode, goVersion, gitVersion string) bool {
            if !shaPattern.MatchString(head) || !shaPattern.MatchString(tree) { return false }
            if !versionPattern.MatchString(goVersion) || !versionPattern.MatchString(gitVersion) { return false }
            expectedPlatforms := map[string]string{
              "ubuntu-latest": "Linux", "macos-latest": "macOS", "windows-latest": "Windows",
            }
            if expectedPlatforms[runner] != platform { return false }
            if platform == "Windows" { return umask == "not-applicable" && probeMode == "not-applicable" }
            return umask == "0077" && probeMode == "0700"
          }

          func buildSeal(caseDir, repeatDir, artifactDir, sourceLog, sourceDir, copyDir,
            head, tree, platform, runner, umask, probeMode, goVersion, gitVersion string) (sealDocument, error) {
            if !validMetadata(head, tree, platform, runner, umask, probeMode, goVersion, gitVersion) {
              return sealDocument{}, fmt.Errorf("seal/metadata-invalid")
            }
            if err := verifyArtifactRoot(artifactDir); err != nil { return sealDocument{}, err }
            if err := verifyDriver(sourceDir, copyDir, sourceLog); err != nil { return sealDocument{}, err }
            cases, err := sealGroup(caseDir, filepath.Join(artifactDir, "outputs"), 47)
            if err != nil { return sealDocument{}, err }
            repeats, err := sealGroup(repeatDir, filepath.Join(artifactDir, "repeat-observations"), 2)
            if err != nil { return sealDocument{}, err }
            return sealDocument{
              Schema: "capture-export-seal/v2",
              LegacyBase: legacyBaseRevision,
              Workflow: workflowSeal{Head: head, Tree: tree, Platform: platform, Runner: runner,
                Tools: toolVersionSeal{Go: goVersion, Git: gitVersion}},
              DriverSource: driverSeal{
                Revision: head,
                Scope: "The six pinned source files below are verified; the full source tree is not asserted.",
                Files: append([]sourcePin(nil), driverPins...),
              },
              Capture: captureSeal{
                Umask: umask, ProbeDirectoryMode: probeMode,
                Cases: cases, RepeatObservations: repeats,
              },
              NotBound: []string{
                "runner image and host patch-level digest",
                "tool executable bytes beyond normalized Go and Git version strings",
                "driver source files beyond the six pinned files",
              },
            }, nil
          }

          func expectedLog() []byte {
            lines := make([]string, 0, len(driverPins)*2)
            for _, pin := range driverPins {
              lines = append(lines, fmt.Sprintf("OK testdata/originalcapture/%s %s", pin.Path, pin.SHA256))
            }
            for _, pin := range driverPins {
              lines = append(lines, fmt.Sprintf("OK .temp/original-capture/harnessparity/%s %s", pin.Path, pin.SHA256))
            }
            return []byte(strings.Join(lines, "\n") + "\n")
          }

          func prepareFiles(rawDir, exportedDir, prefix string, count int) error {
            if err := os.MkdirAll(rawDir, 0700); err != nil { return fmt.Errorf("seal/control-setup-failed") }
            if err := os.MkdirAll(exportedDir, 0700); err != nil { return fmt.Errorf("seal/control-setup-failed") }
            files := make([]byteFile, 0, count)
            for index := 0; index < count; index++ {
              name := fmt.Sprintf("%s-%02d.json", prefix, index)
              data := []byte(fmt.Sprintf("{\"control\":%d}\n", index))
              if err := writeRegular(filepath.Join(rawDir, name), data); err != nil { return err }
              if err := writeRegular(filepath.Join(exportedDir, name), data); err != nil { return err }
              files = append(files, byteFile{name: name, data: data})
            }
            return writeRegular(filepath.Join(exportedDir, "MANIFEST.json"), canonicalManifest(files))
          }

          func expectReject(label string, check func() error) error {
            if err := check(); err == nil { return fmt.Errorf("seal/control-failed-%s", label) }
            return nil
          }

          func selfCheck(base, sourceDir, originalCopyDir string) error {
            root, err := os.MkdirTemp(base, ".seal-self-check-")
            if err != nil { return fmt.Errorf("seal/control-setup-failed") }
            defer os.RemoveAll(root)
            src := filepath.Join(root, "driver-source")
            copied := filepath.Join(root, "driver-copy")
            if err := os.MkdirAll(src, 0700); err != nil { return fmt.Errorf("seal/control-setup-failed") }
            if err := os.MkdirAll(copied, 0700); err != nil { return fmt.Errorf("seal/control-setup-failed") }
            for _, pin := range driverPins {
              data, err := readRegular(filepath.Join(sourceDir, pin.Path))
              if err != nil { return fmt.Errorf("seal/control-source-unavailable") }
              if err := writeRegular(filepath.Join(src, pin.Path), data); err != nil { return err }
              copiedData, err := readRegular(filepath.Join(originalCopyDir, pin.Path))
              if err != nil { return fmt.Errorf("seal/control-source-unavailable") }
              if err := writeRegular(filepath.Join(copied, pin.Path), copiedData); err != nil { return err }
            }
            artifact := filepath.Join(root, "artifact")
            rawCases := filepath.Join(root, "raw-cases")
            rawRepeat := filepath.Join(root, "raw-repeat")
