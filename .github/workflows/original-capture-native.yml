              "TestFreezeOriginalLaunchers/claude-launcher-valid-00": {},
              "TestFreezeOriginalLaunchers/claude-launcher-valid-01": {},
              "TestFreezeOriginalLaunchers/claude-launcher-valid-02": {},
              "TestFreezeOriginalLaunchers/claude-launcher-valid-03": {},
              "TestFreezeOriginalLaunchers/claude-launcher-valid-04": {},
              "TestFreezeOriginalLaunchers/claude-launcher-invalid-00": {},
              "TestFreezeOriginalLaunchers/claude-launcher-invalid-01": {},
              "TestFreezeOriginalLaunchers/claude-launcher-invalid-02": {},
              "TestFreezeOriginalLaunchers/claude-launcher-invalid-03": {},
              "TestFreezeOriginalLaunchers/claude-launcher-invalid-04": {},
              "TestFreezeOriginalLaunchers/claude-launcher-invalid-05": {},
              "TestFreezeOriginalLaunchers/claude-launcher-invalid-06": {},
              "TestFreezeOriginalLaunchers/claude-launcher-invalid-07": {},
