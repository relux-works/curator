            fi
          fi
          if [[ "$sanitize_exit" -ne 0 ]]; then
            printf 'exit_code=%s\n' "$sanitize_exit" >> "$GITHUB_OUTPUT"
            reason_line=""
            if [[ ! -s "$sanitizer_stdout" ]] && [[ "$(wc -l < "$sanitizer_stderr" | tr -d ' ')" == 1 ]] && IFS= read -r reason_line < "$sanitizer_stderr" && [[ "$reason_line" =~ ^CAPTURE_REASON=sanitize/[a-z0-9-]+$ ]]; then
              printf '%s\n' "$reason_line" >&2
            else
              printf 'CAPTURE_REASON=sanitize/tool-command-failed\n' >&2
            fi
          fi
          exit "$sanitize_exit"

      - name: Record lane metadata
        id: metadata
        if: always() && steps.directories.outcome == 'success'
        shell: bash
        env:
          CAPTURE_ROOT: ${{ steps.directories.outputs.root_posix }}
          MATRIX_RUNNER: ${{ matrix.runner }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GO_SETUP_OUTCOME: ${{ steps.setup_go.outcome }}
          SOURCE_OUTCOME: ${{ steps.verify_source.outcome }}
          SOURCE_EXIT: ${{ steps.verify_source.outputs.exit_code || 'not-run' }}
          MODULE_OUTCOME: ${{ steps.modules.outcome }}
          MODULE_EXIT: ${{ steps.modules.outputs.exit_code || 'not-run' }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          CAPTURE_UMASK: ${{ steps.capture.outputs.posix_umask || 'not-recorded' }}
          CAPTURE_EXIT: ${{ steps.capture.outputs.test_command_exit || 'not-run' }}
          AUDIT_EXIT: ${{ steps.capture.outputs.audit_exit || 'not-run' }}
          CASE_EXECUTED: ${{ steps.capture.outputs.executed || '0' }}
          CASE_PASSED: ${{ steps.capture.outputs.passed || '0' }}
          CASE_FAILED: ${{ steps.capture.outputs.failed || '0' }}
          CASE_SKIPPED: ${{ steps.capture.outputs.skipped || '0' }}
          REPEAT_SEEN: ${{ steps.capture.outputs.repeat_seen || '0' }}
          REPEAT_PASSED: ${{ steps.capture.outputs.repeat_passed || '0' }}
          COMPARATOR_SEEN: ${{ steps.capture.outputs.comparator_rows || '0' }}
          COMPARATOR_PASSED: ${{ steps.capture.outputs.comparator_passed || '0' }}
          COMPARATOR_FAILED: ${{ steps.capture.outputs.comparator_failed || '0' }}
          COMPARATOR_SKIPPED: ${{ steps.capture.outputs.comparator_skipped || '0' }}
          ROOT_TESTS_PASSED: ${{ steps.capture.outputs.root_tests_passed || '0' }}
          WINDOWS_ROOT_PASSED: ${{ steps.capture.outputs.windows_root_parameter_passed || '0' }}
          ALL_TEST_FAILURES: ${{ steps.capture.outputs.all_test_failures || '0' }}
          ALL_TEST_SKIPS: ${{ steps.capture.outputs.all_test_skips || '0' }}
          OUTPUT_JSON_FILES: ${{ steps.capture.outputs.output_json_files || '0' }}
          SANITIZER_OUTCOME: ${{ steps.sanitize.outcome }}
          SANITIZER_EXIT: ${{ steps.sanitize.outputs.exit_code || 'not-run' }}
          EXPORT_GATE: ${{ steps.sanitize.outputs.export_gate || 'not-run' }}
          EXPORTED_CASE_FILES: ${{ steps.sanitize.outputs.exported_case_files || '0' }}
          EXPORTED_REPEAT_OBSERVATIONS: ${{ steps.sanitize.outputs.exported_repeat_observations || '0' }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          normalize_go_version() {
            local status="$1"
            local output="$2"
            if [[ "$status" != "0" ]]; then
              printf 'unavailable'
              return
            fi
            if [[ "$output" =~ ^go[[:space:]]version[[:space:]]go([0-9]+\.[0-9]+\.[0-9]+)[[:space:]](darwin|windows)/(amd64|arm64)$ ]]; then
              printf '%s' "${BASH_REMATCH[1]}"
            else
              printf 'unavailable'
            fi
          }
          normalize_goos() {
            local status="$1"
            local value="$2"
            if [[ "$status" != "0" ]]; then
              printf 'unavailable'
              return
            fi
            case "$value" in
              darwin|windows) printf '%s' "$value" ;;
              *) printf 'unavailable' ;;
            esac
          }
          normalize_goarch() {
            local status="$1"
            local value="$2"
            if [[ "$status" != "0" ]]; then
              printf 'unavailable'
              return
            fi
            case "$value" in
              amd64|arm64) printf '%s' "$value" ;;
              *) printf 'unavailable' ;;
            esac
          }
          normalize_git_version() {
            local status="$1"
            local output="$2"
            if [[ "$status" != "0" ]]; then
              printf 'unavailable'
              return
            fi
            if [[ "$output" =~ ^git[[:space:]]version[[:space:]]([0-9]+\.[0-9]+\.[0-9]+)([[:space:]]\(Apple[[:space:]]Git-[0-9]+\)|\.windows\.[0-9]+)?$ ]]; then
              printf '%s' "${BASH_REMATCH[1]}"
            else
              printf 'unavailable'
            fi
          }
          capture_version_probe() {
            local kind="$1"
            shift
            local raw=""
            if raw="$(GOENV=off GOTOOLCHAIN=local "$@" 2>/dev/null)"; then
              version_probe_exit=0
            else
              version_probe_exit=$?
              raw=""
            fi
            case "$kind" in
              go) version_probe_value="$(normalize_go_version "$version_probe_exit" "$raw")" ;;
              git) version_probe_value="$(normalize_git_version "$version_probe_exit" "$raw")" ;;
              *) version_probe_value="unavailable" ;;
            esac
          }
          token_payload="$(printf '%30s' '')"
          token_payload="${token_payload// /A}"
          token_shape="ghp_${token_payload}"
          version_probe_failure_fixture() {
            printf '%s\n' 'go version go1.25.5 darwin/arm64'
            printf '%s\n' '/Users/runner/PROBE_DIAGCONTROL' >&2
            return 23
          }
          failed_probe_control="$(
            {
              capture_version_probe go version_probe_failure_fixture
              printf '%s %s\n' "$version_probe_value" "$version_probe_exit"
            } 2>&1
          )"
          good_go_probe_control="$(
            {
              capture_version_probe go printf '%s\n' 'go version go1.25.5 darwin/arm64'
              printf '%s %s %s %s\n' "$version_probe_value" "$version_probe_exit" "$(normalize_goos 0 darwin)" "$(normalize_goarch 0 arm64)"
            } 2>&1
          )"
          good_windows_go_probe_control="$(
            {
              capture_version_probe go printf '%s\n' 'go version go1.25.5 windows/amd64'
              printf '%s %s %s %s\n' "$version_probe_value" "$version_probe_exit" "$(normalize_goos 0 windows)" "$(normalize_goarch 0 amd64)"
            } 2>&1
          )"
          good_git_probe_control="$(
            {
              capture_version_probe git printf '%s\n' 'git version 2.50.1 (Apple Git-155)'
              printf '%s %s\n' "$version_probe_value" "$version_probe_exit"
            } 2>&1
          )"
          good_windows_git_probe_control="$(
            {
              capture_version_probe git printf '%s\n' 'git version 2.50.1.windows.1'
              printf '%s %s\n' "$version_probe_value" "$version_probe_exit"
            } 2>&1
          )"
          token_goos_probe_control="$(normalize_go_version 0 "go version go1.25.5 ${token_shape}/arm64")"
          token_goos_env_control="$(normalize_goos 0 "$token_shape")"
          token_git_suffix_control="$(normalize_git_version 0 "git version 2.50.1.${token_shape}")"
          malformed_probe_control="$(
            {
              capture_version_probe git printf '%s\n' 'git version /Users/runner/PROBE_DIAGCONTROL'
              printf '%s %s\n' "$version_probe_value" "$version_probe_exit"
            } 2>&1
          )"
          if [[ "$failed_probe_control" != "unavailable 23" ||
                "$good_go_probe_control" != "1.25.5 0 darwin arm64" ||
                "$good_windows_go_probe_control" != "1.25.5 0 windows amd64" ||
                "$good_git_probe_control" != "2.50.1 0" ||
                "$good_windows_git_probe_control" != "2.50.1 0" ||
                "$token_goos_probe_control" != "unavailable" ||
                "$token_goos_env_control" != "unavailable" ||
                "$token_git_suffix_control" != "unavailable" ||
                "$malformed_probe_control" != "unavailable 0" ]]; then
            printf 'CAPTURE_REASON=metadata/version-probe-control-failed\n' >&2
            exit 2
          fi
          go_version="unavailable"
          goos="unavailable"
          goarch="unavailable"
          go_exit=127
          goos_exit=127
          goarch_exit=127
          if command -v go >/dev/null 2>&1; then
            capture_version_probe go go version
            go_version="$version_probe_value"
            go_exit="$version_probe_exit"
            set +e
            raw_goos="$(GOENV=off GOTOOLCHAIN=local go env GOOS 2>/dev/null)"
            goos_exit=$?
            raw_goarch="$(GOENV=off GOTOOLCHAIN=local go env GOARCH 2>/dev/null)"
            goarch_exit=$?
            set -e
            goos="$(normalize_goos "$goos_exit" "$raw_goos")"
            goarch="$(normalize_goarch "$goarch_exit" "$raw_goarch")"
          fi
          git_version="unavailable"
          git_exit=127
          if command -v git >/dev/null 2>&1; then
            capture_version_probe git git -C "$GITHUB_WORKSPACE" --version
            git_version="$version_probe_value"
            git_exit="$version_probe_exit"
          fi
          pushed_sha="$GITHUB_SHA"
          head=""
          head_exit=1
          if head="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD 2>/dev/null)"; then head_exit=0; fi
          head_matches_pushed_sha=false
          if [[ "$head" =~ ^[0-9a-f]{40}$ && "$pushed_sha" =~ ^[0-9a-f]{40}$ && "$head" == "$pushed_sha" ]]; then
            head_matches_pushed_sha=true
          fi
          working_status=""
          working_status_exit=1
          if working_status="$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all 2>/dev/null)"; then working_status_exit=0; fi
          working_clean=false
          if [[ "$working_status_exit" -eq 0 && -z "$working_status" ]]; then working_clean=true; fi
          umask_valid=false
          if [[ "$RUNNER_OS" == "Windows" && "$CAPTURE_UMASK" == "not-applicable" ]]; then
            umask_valid=true
          elif [[ "$RUNNER_OS" == "macOS" && "$CAPTURE_UMASK" == "0077" ]]; then
            umask_valid=true
          fi
          lane_verdict=fail
          if [[ "$CHECKOUT_OUTCOME" == "success" && "$GO_SETUP_OUTCOME" == "success" &&
                "$SOURCE_OUTCOME" == "success" && "$MODULE_OUTCOME" == "success" &&
                "$CAPTURE_OUTCOME" == "success" && "$SANITIZER_OUTCOME" == "success" &&
                "$working_clean" == "true" && "$head_matches_pushed_sha" == "true" &&
                "$umask_valid" == "true" ]]; then
            lane_verdict=pass
          fi
          {
            printf 'platform=%s\nrunner=%s\nverdict=%s\n' "$RUNNER_OS" "$MATRIX_RUNNER" "$lane_verdict"
            printf 'workflow_run_id=%s\nworkflow_run_attempt=%s\nworkflow_run_url=https://github.com/%s/actions/runs/%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'checkout_outcome=%s\ngo_setup_outcome=%s\n' "$CHECKOUT_OUTCOME" "$GO_SETUP_OUTCOME"
            printf 'posix-umask=%s\n' "$CAPTURE_UMASK"
            printf 'GOOS=%s\nGOARCH=%s\ngo_version=%s\ngo_version_exit=%s\ngoos_exit=%s\ngoarch_exit=%s\n' \
              "$goos" "$goarch" "$go_version" "$go_exit" "$goos_exit" "$goarch_exit"
            printf 'git_version=%s\ngit_version_exit=%s\nhead=%s\nhead_exit=%s\nhead_matches_pushed_sha=%s\n' \
              "$git_version" "$git_exit" "$head" "$head_exit" "$head_matches_pushed_sha"
            printf 'working_status_exit=%s\n' "$working_status_exit"
            printf 'source_verification_outcome=%s\nsource_verification_exit=%s\n' "$SOURCE_OUTCOME" "$SOURCE_EXIT"
            printf 'module_command=go mod download\nmodule_outcome=%s\nmodule_exit=%s\n' "$MODULE_OUTCOME" "$MODULE_EXIT"
            printf 'test_command=go test -p 1 -count=1 -v -json ./.temp/original-capture/harnessparity\n'
            printf 'test_outcome=%s\ntest_exit=%s\n' "$CAPTURE_OUTCOME" "$CAPTURE_EXIT"
            printf 'audit_command=go run <runner-temp>/audit.go <private-test-log> <output-directory> <test-exit> <failure-names-file> <failure-details-file>\naudit_exit=%s\n' "$AUDIT_EXIT"
            printf 'case_rows_executed=%s\ncase_rows_passed=%s\ncase_rows_failed=%s\ncase_rows_skipped=%s\n' \
              "$CASE_EXECUTED" "$CASE_PASSED" "$CASE_FAILED" "$CASE_SKIPPED"
            printf 'repeat_seen=%s\nrepeat_passed=%s\ncomparator_rows=%s\ncomparator_passed=%s\n' \
              "$REPEAT_SEEN" "$REPEAT_PASSED" "$COMPARATOR_SEEN" "$COMPARATOR_PASSED"
            printf 'comparator_failed=%s\ncomparator_skipped=%s\nroot_tests_passed=%s\n' \
              "$COMPARATOR_FAILED" "$COMPARATOR_SKIPPED" "$ROOT_TESTS_PASSED"
            printf 'windows_root_parameter_passed=%s\nall_test_failures=%s\nall_test_skips=%s\noutput_json_files=%s\n' \
              "$WINDOWS_ROOT_PASSED" "$ALL_TEST_FAILURES" "$ALL_TEST_SKIPS" "$OUTPUT_JSON_FILES"
            printf 'export_gate=%s\nsanitizer_outcome=%s\nsanitizer_exit=%s\nexported_case_files=%s\nexported_repeat_observations=%s\n' \
              "$EXPORT_GATE" "$SANITIZER_OUTCOME" "$SANITIZER_EXIT" "$EXPORTED_CASE_FILES" "$EXPORTED_REPEAT_OBSERVATIONS"
            printf 'working_tree_clean=%s\n' "$working_clean"
          } > "$CAPTURE_ROOT/lane-metadata.txt"
          {
            printf '### Lane metadata: %s (%s)\n\n' "$RUNNER_OS" "$MATRIX_RUNNER"
            printf 'Verdict: **%s**. Rows: %s executed, %s passed, %s failed, %s skipped.\n' \
              "$lane_verdict" "$CASE_EXECUTED" "$CASE_PASSED" "$CASE_FAILED" "$CASE_SKIPPED"
            printf 'Export gate: %s; %s case files and %s repeat observations.\n' \
              "$EXPORT_GATE" "$EXPORTED_CASE_FILES" "$EXPORTED_REPEAT_OBSERVATIONS"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$head_matches_pushed_sha" != "true" ]]; then
            printf 'CAPTURE_REASON=metadata/head-mismatch\n' >&2
            exit 1
          fi
          if [[ "$working_clean" != "true" ]]; then
            printf 'CAPTURE_REASON=metadata/working-tree-dirty\n' >&2
            exit 1
          fi

      - name: Upload platform artifact
        if: always() && steps.directories.outcome == 'success' && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: original-capture-05-${{ matrix.runner }}
          path: ${{ steps.directories.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 7
