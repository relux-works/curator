              for _, state := range []string{"user-settings", "current", "modified", "missing-state", "unreadable-state", "malformed-state", "native-parent"} {
                  names = append(names, "codex_cli-"+state)
              }
              names = append(names, "claude_code-mcp", "claude-launcher-normal-edit", "claude-launcher-typed-projection")
              for index := 0; index < 5; index++ {
