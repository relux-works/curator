          func expectOperationalEmpty(paths controlPaths, expected string) error {
              var stdout, stderr bytes.Buffer
              code := runGate([]string{paths.caseDir, paths.repeatDir, paths.artifact, "false"}, &stdout, &stderr)
              if code != 2 || stdout.Len() != 0 || stderr.String() != diagnostic(expected) {
                  return operational("selfcheck-operational-control-failed")
              }
              entries, err := os.ReadDir(paths.artifact)
              if err != nil {
                  return operational("selfcheck-operational-control-failed")
              }
              if expected == "artifact-not-empty" {
                  if len(entries) != 1 || entries[0].Name() != "metadata.txt" {
                      return operational("selfcheck-operational-control-mutated-artifact")
                  }
                  return nil
              }
              if len(entries) != 0 {
                  return operational("selfcheck-operational-control-mutated-artifact")
              }
              return nil
          }
          GO
          native_path() {
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              cygpath -w "$1"
            else
              printf '%s' "$1"
            fi
          }
          go_dir="$(dirname "$(command -v go)")"
          git_dir="$(dirname "$(command -v git)")"
          trusted_path="$go_dir:$git_dir"
          home_path="$(native_path "$CAPTURE_ROOT/home")"
