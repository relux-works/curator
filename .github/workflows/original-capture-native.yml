          func pathPayloadCase(field, value string) []byte {
              observed := []byte(field + " = " + value + "\n")
              digest := sha256.Sum256(observed)
              object := map[string]any{
                  field: value,
                  "bytes": base64.StdEncoding.EncodeToString(observed),
                  "document": base64.StdEncoding.EncodeToString(observed),
                  "sha256": hex.EncodeToString(digest[:]),
              }
              encoded, _ := json.Marshal(object)
              return append(encoded, '\n')
          }

          func writeKnownCaptureControl(paths *controlPaths) ([]byte, string, error) {
              names := knownCaptureCaseNames()
              if len(names) != 47 || len(paths.caseFiles) != len(names) {
                  return nil, "", operational("selfcheck-known-case-set-invalid")
              }
              observed := []byte("model = \"fixture-model\"\n[projects.\"/synthetic/project\"]\nfixture = \"${FIXTURE_ROOT}/home/codex_cli/config.toml\"\nwindows_fixture = \"${FIXTURE_ROOT}\\home\\codex_cli\\config.toml\"\n")
              observedHash := sha256.Sum256(observed)
              caseName := "codex_cli-native-parent"
              for index, name := range names {
                  oldName := fmt.Sprintf("case-%02d.json", index)
                  oldPath := filepath.Join(paths.caseDir, oldName)
                  newName := name + ".json"
                  newPath := filepath.Join(paths.caseDir, newName)
                  if err := os.Rename(oldPath, newPath); err != nil {
                      return nil, "", operational("selfcheck-known-case-set-fixture-failed")
                  }
                  data := []byte(fmt.Sprintf("{\"case\":%q}\n", name))
                  if name == caseName {
                      object := map[string]any{
                          "case": name,
                          "bytes": base64.StdEncoding.EncodeToString(observed),
                          "document": base64.StdEncoding.EncodeToString(observed),
                          "sha256": hex.EncodeToString(observedHash[:]),
                      }
                      encoded, err := json.Marshal(object)
                      if err != nil {
                          return nil, "", operational("selfcheck-known-case-set-fixture-failed")
                      }
                      data = append(encoded, '\n')
                  }
                  if err := writeFile(newPath, data, 0600); err != nil {
                      return nil, "", operational("selfcheck-known-case-set-fixture-failed")
                  }
                  paths.caseFiles[index] = inputFile{name: newName, data: data, mode: 0600}
              }
              return observed, caseName + ".json", nil
          }

          func checkDecodedPayloadHashes(path string, observed []byte) error {
              payload, err := os.ReadFile(path)
              if err != nil {
                  return operational("selfcheck-decoded-payload-read-failed")
              }
              value, err := parseJSON(payload)
              if err != nil {
                  return operational("selfcheck-decoded-payload-invalid")
              }
              object, ok := value.(map[string]any)
              if !ok {
                  return operational("selfcheck-decoded-payload-invalid")
              }
              observedHash := sha256.Sum256(observed)
              for _, field := range []string{"bytes", "document"} {
                  encoded, ok := object[field].(string)
                  if !ok {
                      return operational("selfcheck-decoded-payload-missing")
                  }
                  decoded, err := base64.StdEncoding.DecodeString(encoded)
                  if err != nil {
                      return operational("selfcheck-decoded-payload-invalid")
                  }
                  exportedHash := sha256.Sum256(decoded)
                  if !bytes.Equal(decoded, observed) || !bytes.Equal(exportedHash[:], observedHash[:]) {
                      return operational("selfcheck-decoded-payload-hash-mismatch")
                  }
              }
              return nil
          }

