          if env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off go build -o "$sanitizer_binary" ./.temp/capture-exporter > "$sanitizer_build_stdout" 2> "$sanitizer_build_stderr"; then
            if env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off "$sanitizer_binary" "$CAPTURE_ROOT/raw-output" "$CAPTURE_ROOT/repeat-raw" "$CAPTURE_ROOT/artifact" "$REQUIRE_47" > "$sanitizer_stdout" 2> "$sanitizer_stderr"; then
              sanitize_exit=0
            else
              sanitize_exit=$?
            fi
          else
            sanitize_exit=2
          fi
          if [[ "$sanitize_exit" -eq 0 ]]; then
            exported_case_files="$(sed -n 's/^exported_case_files=//p' "$sanitizer_stdout")"
            expected_stdout="$CAPTURE_ROOT/sanitizer.expected"
            printf 'export_gate=PASS\nexported_case_files=%s\nexported_repeat_observations=2\n' "$exported_case_files" > "$expected_stdout"
            if ! cmp -s "$expected_stdout" "$sanitizer_stdout" || [[ -s "$sanitizer_stderr" ]] || [[ ! "$exported_case_files" =~ ^(0|[1-9][0-9]?)$ ]] || (( exported_case_files > 47 )); then
              sanitize_exit=2
