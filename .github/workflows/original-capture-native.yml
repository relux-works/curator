              "TestWindowsRootParameter/changed-exclusion-entry": {},
              "TestWindowsRootParameter/quoted-root-value": {},
              "TestWindowsRootParameter/colon-path-boundary": {},
              "TestWindowsRootParameter/missing-binding": {},
              "TestWindowsRootParameter/ambiguous-binding": {},
              "TestWindowsRootParameter/environment-binding": {},
              "TestWindowsRootParameter/output-binding": {},
              "TestWindowsRootParameter/late-binding": {},
