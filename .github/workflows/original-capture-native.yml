          sanitizer_stdout="$CAPTURE_ROOT/sanitizer.stdout"
          sanitizer_stderr="$CAPTURE_ROOT/sanitizer.stderr"
          sanitizer_build_stdout="$CAPTURE_ROOT/sanitizer-build.stdout"
          sanitizer_build_stderr="$CAPTURE_ROOT/sanitizer-build.stderr"
          sanitizer_binary="$CAPTURE_ROOT/sanitize"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sanitizer_binary="$CAPTURE_ROOT/sanitize.exe"
          fi
          : > "$sanitizer_stdout"
