            "TestNativeCaptureFailureNamesPassThroughSanitizer": {},
            "TestNativeCapturePrivateLogCannotReachOutput": {},
            "TestNativeCaptureRunScriptRequiresRunWithinNamedStep": {},
            "TestNativeCaptureUploadConditionAcceptsLFAndCRLF": {},
            "TestNativeCaptureWorkflowPathNormalizesMixedSeparators": {},
            "TestNativeCaptureUploadMissingWorkflowBindingFailsClosed": {},
            "TestFixtureAncestorPreRunCaseTable": {},
            "TestFixtureAncestorSymlinkCanonicalBindings": {},
            "TestFixtureAncestorUnresolvedLinkRefusesWithoutExport": {},
            "TestFixtureAncestorGlobLiteralContractFixture": {},
            "TestFixtureAncestorAdjacentPrivatePathRemainsUnprojected": {},
