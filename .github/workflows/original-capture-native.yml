                  value string
              }{
                  {"token-bearer", "Bearer abcdefghijklmnop"},
                  {"token-github-gitlab", "ghp_" + tokenPrefix},
                  {"token-sk", "sk-" + tokenPrefix},
                  {"token-slack", "xoxb-abcdefghij"},
                  {"token-aws-access-key", "AKIAABCDEFGHIJKLMNOP"},
                  {"token-jwt", "eyJAAAAA.eyJBBBBB.eyJCCCCC"},
                  {"token-private-key", "-----BEGIN RSA PRIVATE KEY-----\nneutral\n-----END RSA PRIVATE KEY-----"},
                  {"token-hostile-sentinel", "HOSTILE_SECRET_CONTROL"},
                  {"token-google-stripe", "AIza" + strings.Repeat("B", 35)},
                  {"path-private-home", "/Users/example/private/state"},
                  {"path-absolute", "D:\\a\\_temp\\runner\\private-state"},
                  {"credential-assignment", "credential_token=neutral-value"},
              }
              targets := []struct{ kind, name string }{
                  {"case", "case-00.json"},
                  {"repeat", "first.json"},
                  {"log", "audit-output.raw.txt"},
                  {"log", "module-download.raw.txt"},
                  {"log", "source-verification.log"},
                  {"log", "failure-details.txt"},
              }
              for index, trigger := range triggers {
                  for targetIndex, target := range targets {
                      paths, err := prepareControl(filepath.Join(base, fmt.Sprintf("trigger-%02d-%02d", index, targetIndex)), 1)
                      if err != nil {
                          return err
                      }
                      value := []byte(trigger.value)
                      if target.kind != "log" {
                          value = triggerJSON(trigger.value)
                      }
                      if err := plantControl(paths, target.kind, target.name, value); err != nil {
                          return operational("selfcheck-fixture-setup-failed")
                      }
                      if err := expectRefusal(paths, trigger.code); err != nil {
                          return err
                      }
                  }
              }

              sensitiveKeys := []string{"api_token", "apiKey", "privateKey", "refreshToken", "password", "credential"}
              for index, key := range sensitiveKeys {
                  paths, err := prepareControl(filepath.Join(base, fmt.Sprintf("sensitive-%02d", index)), 1)
                  if err != nil {
                      return err
                  }
                  value, _ := json.Marshal(map[string]any{key: "neutral"})
                  if err := plantControl(paths, "case", "case-00.json", append(value, '\n')); err != nil {
                      return operational("selfcheck-fixture-setup-failed")
                  }
                  if err := expectRefusal(paths, "sensitive-field-nonempty"); err != nil {
                      return err
                  }
              }
              for index, name := range []string{"HOSTILE_SECRET_CONTROL.json", "ghp_" + tokenPrefix + ".json", "api_token.json"} {
                  paths, err := prepareControl(filepath.Join(base, fmt.Sprintf("filename-%02d", index)), 1)
                  if err != nil {
                      return err
                  }
                  oldPath := filepath.Join(paths.caseDir, "case-00.json")
                  newPath := filepath.Join(paths.caseDir, name)
                  if err := os.Rename(oldPath, newPath); err != nil {
                      return operational("selfcheck-fixture-setup-failed")
                  }
                  paths.caseFiles[0].name = name
                  expected := "sensitive-field-nonempty"
                  if index < 2 {
                      expected = "token-hostile-sentinel"
                      if index == 1 {
                          expected = "token-github-gitlab"
                      }
                  }
                  if err := expectRefusal(paths, expected); err != nil {
                      return err
                  }
              }
              for index, value := range []any{"", nil, map[string]any{}, []any{}} {
                  paths, err := prepareControl(filepath.Join(base, fmt.Sprintf("sensitive-empty-%02d", index)), 1)
                  if err != nil {
                      return err
                  }
                  data, _ := json.Marshal(map[string]any{"api_token": value})
                  if err := plantControl(paths, "case", "case-00.json", append(data, '\n')); err != nil {
                      return operational("selfcheck-fixture-setup-failed")
                  }
                  if err := expectRefusal(paths, "sensitive-field-nonempty"); err != nil {
                      return err
                  }
              }
              tbhValue, err := prepareControl(filepath.Join(base, "tbh-value"), 1)
              if err != nil {
                  return err
              }
              tbhJSON, _ := json.Marshal(map[string]any{"TBH_CREDENTIAL_BACKEND": map[string]any{"nested": "HOSTILE_SECRET_CONTROL"}})
              if err := plantControl(tbhValue, "case", "case-00.json", append(tbhJSON, '\n')); err != nil {
                  return operational("selfcheck-fixture-setup-failed")
              }
              if err := expectRefusal(tbhValue, "token-hostile-sentinel"); err != nil {
                  return err
              }

              for index, field := range []string{"bytes", "document"} {
                  for _, payload := range [][]byte{
                      []byte("HOSTILE_SECRET_DECODED"),
                      triggerJSON("/Users/example/decoded"),
                  } {
                      paths, err := prepareControl(filepath.Join(base, fmt.Sprintf("decoded-%02d-%02d", index, len(payload))), 1)
                      if err != nil {
                          return err
                      }
                      object := map[string]any{field: base64.StdEncoding.EncodeToString(payload)}
                      if field == "bytes" {
                          digest := sha256.Sum256(payload)
                          object["sha256"] = hex.EncodeToString(digest[:])
                      }
                      encoded, _ := json.Marshal(object)
                      if err := plantControl(paths, "case", "case-00.json", append(encoded, '\n')); err != nil {
                          return operational("selfcheck-fixture-setup-failed")
                      }
                      expected := "token-hostile-sentinel"
                      if bytes.Contains(payload, []byte("/Users/")) {
                          expected = "path-private-home"
                      }
                      if err := expectRefusal(paths, expected); err != nil {
                          return err
                      }
                  }
              }

              rootLeak, err := prepareControl(filepath.Join(base, "root-leak"), 1)
              if err != nil {
                  return err
              }
              rootValue := filepath.Join(rootLeak.root, "tmp", "nested", "observation")
              rootJSON, _ := json.Marshal(map[string]string{"root": rootValue})
              if err := plantControl(rootLeak, "repeat", "first.json", append(rootJSON, '\n')); err != nil {
                  return operational("selfcheck-fixture-setup-failed")
              }
              if err := expectRefusal(rootLeak, "path-fixture-root-leak"); err != nil {
                  return err
              }

              duplicate, err := prepareControl(filepath.Join(base, "duplicate-json"), 1)
              if err != nil {
                  return err
              }
              if err := plantControl(duplicate, "case", "case-00.json", []byte("{\"safe\":1,\"safe\":2}\n")); err != nil {
                  return operational("selfcheck-fixture-setup-failed")
              }
              if err := expectOperationalEmpty(duplicate, "input-duplicate-json-key"); err != nil {
                  return err
              }

              metadata, err := prepareControl(filepath.Join(base, "preexisting-metadata"), 0)
              if err != nil {
                  return err
              }
              metadataBytes := []byte("existing neutral metadata\n")
              metadataPath := filepath.Join(metadata.artifact, "metadata.txt")
              if err := writeFile(metadataPath, metadataBytes, 0600); err != nil {
                  return operational("selfcheck-fixture-setup-failed")
              }
              if err := expectOperationalEmpty(metadata, "artifact-not-empty"); err != nil {
                  return err
              }
              gotMetadata, err := os.ReadFile(metadataPath)
              if err != nil || !bytes.Equal(gotMetadata, metadataBytes) {
                  return operational("selfcheck-preexisting-metadata-mutated")
              }
              return nil
          }

          func expectOperationalEmpty(paths controlPaths, expected string) error {
              var stdout, stderr bytes.Buffer
              code := runGate([]string{paths.caseDir, paths.repeatDir, paths.artifact, "false"}, &stdout, &stderr)
              if code != 2 || stdout.Len() != 0 || stderr.String() != diagnostic(expected) {
                  return operational("selfcheck-operational-control-failed")
              }
              entries, err := os.ReadDir(paths.artifact)
              if err != nil {
                  return operational("selfcheck-operational-control-failed")
              }
              if expected == "artifact-not-empty" {
                  if len(entries) != 1 || entries[0].Name() != "metadata.txt" {
                      return operational("selfcheck-operational-control-mutated-artifact")
                  }
                  return nil
              }
              if len(entries) != 0 {
                  return operational("selfcheck-operational-control-mutated-artifact")
              }
              return nil
          }
          GO
          native_path() {
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              cygpath -w "$1"
            else
              printf '%s' "$1"
            fi
          }
          go_dir="$(dirname "$(command -v go)")"
          git_dir="$(dirname "$(command -v git)")"
          trusted_path="$go_dir:$git_dir"
          home_path="$(native_path "$CAPTURE_ROOT/home")"
          temp_path="$(native_path "$CAPTURE_ROOT/tmp")"
          cache_path="$(native_path "$CAPTURE_ROOT/gocache")"
          modcache_path="$(native_path "$CAPTURE_ROOT/gomodcache")"
          gopath_path="$(native_path "$CAPTURE_ROOT/gopath")"
          gitconfig_path="$(native_path "$CAPTURE_ROOT/home/.gitconfig")"
          clean_env=(
            "HOME=$home_path"
            "TMPDIR=$temp_path"
            "TMP=$temp_path"
            "TEMP=$temp_path"
            "GOCACHE=$cache_path"
            "GOMODCACHE=$modcache_path"
            "GOPATH=$gopath_path"
            "GIT_CONFIG_NOSYSTEM=1"
            "GIT_CONFIG_GLOBAL=$gitconfig_path"
            "GIT_TERMINAL_PROMPT=0"
            "GCM_INTERACTIVE=Never"
            "GOENV=off"
            "GOTOOLCHAIN=local"
            "PATH=$trusted_path"
          )
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            systemroot="${SYSTEMROOT:-${WINDIR:-}}"
            if [[ -z "$systemroot" ]]; then
              printf 'CAPTURE_REASON=sanitize/systemroot-missing\n' >&2
              exit 2
            fi
            trusted_path="$trusted_path:$(cygpath -u "$systemroot")/System32"
            clean_env[13]="PATH=$trusted_path"
            clean_env+=("SYSTEMROOT=$systemroot" "WINDIR=${WINDIR:-$systemroot}" \
              "USERPROFILE=$home_path" "APPDATA=$home_path/AppData/Roaming" \
              "LOCALAPPDATA=$home_path/AppData/Local")
          else
            trusted_path="$trusted_path:/usr/bin:/bin"
            clean_env[13]="PATH=$trusted_path"
          fi
          sanitizer_stdout="$CAPTURE_ROOT/sanitizer.stdout"
          sanitizer_stderr="$CAPTURE_ROOT/sanitizer.stderr"
          sanitizer_build_stdout="$CAPTURE_ROOT/sanitizer-build.stdout"
          sanitizer_build_stderr="$CAPTURE_ROOT/sanitizer-build.stderr"
          path_controls_stdout="$CAPTURE_ROOT/path-controls.stdout"
          path_controls_stderr="$CAPTURE_ROOT/path-controls.stderr"
          path_controls_expected="$CAPTURE_ROOT/path-controls.expected"
          seal_controls_stdout="$CAPTURE_ROOT/seal-controls.stdout"
          seal_controls_stderr="$CAPTURE_ROOT/seal-controls.stderr"
          seal_controls_expected="$CAPTURE_ROOT/seal-controls.expected"
          seal_build_stdout="$CAPTURE_ROOT/seal-build.stdout"
          seal_build_stderr="$CAPTURE_ROOT/seal-build.stderr"
          sanitizer_binary="$CAPTURE_ROOT/sanitize"
          seal_binary="$CAPTURE_ROOT/seal"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sanitizer_binary="$CAPTURE_ROOT/sanitize.exe"
            seal_binary="$CAPTURE_ROOT/seal.exe"
          fi
          : > "$sanitizer_stdout"
          : > "$sanitizer_stderr"
          sanitize_exit=0
          if ! env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off go build -o "$sanitizer_binary" ./.temp/capture-exporter > "$sanitizer_build_stdout" 2> "$sanitizer_build_stderr"; then
            sanitize_exit=2
            printf 'CAPTURE_REASON=sanitize/build-failed\n' > "$sanitizer_stderr"
          elif ! env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off go build -o "$seal_binary" "$seal_source_dir/seal.go" > "$seal_build_stdout" 2> "$seal_build_stderr"; then
            sanitize_exit=2
            printf 'CAPTURE_REASON=sanitize/seal-build-failed\n' > "$sanitizer_stderr"
          elif ! env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off "$seal_binary" --self-check "$CAPTURE_ROOT" \
            "$GITHUB_WORKSPACE/testdata/originalcapture" "$GITHUB_WORKSPACE/.temp/original-capture/harnessparity" \
            > "$seal_controls_stdout" 2> "$seal_controls_stderr"; then
            sanitize_exit=2
            printf 'CAPTURE_REASON=sanitize/seal-self-check-failed\n' > "$sanitizer_stderr"
          else
            printf 'seal_controls=PASS\n' > "$seal_controls_expected"
            if ! cmp -s "$seal_controls_expected" "$seal_controls_stdout" || [[ -s "$seal_controls_stderr" ]]; then
              sanitize_exit=2
              printf 'CAPTURE_REASON=sanitize/seal-self-check-failed\n' > "$sanitizer_stderr"
            else
              printf 'seal_controls=PASS\n' >> "$GITHUB_OUTPUT"
            fi
          fi
          if [[ "$sanitize_exit" -eq 0 ]]; then
            if env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off "$sanitizer_binary" --path-exception-controls > "$path_controls_stdout" 2> "$path_controls_stderr"; then
              printf 'path_exception_controls=PASS\n' > "$path_controls_expected"
              if cmp -s "$path_controls_expected" "$path_controls_stdout" && [[ ! -s "$path_controls_stderr" ]]; then
                printf 'path_exception_controls=PASS\n' >> "$GITHUB_OUTPUT"
                if env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off CAPTURE_DROP_REFUSED_FAILURE_DETAILS=1 \
                  "$sanitizer_binary" "$CAPTURE_ROOT/raw-output" "$CAPTURE_ROOT/repeat-raw" "$CAPTURE_ROOT/artifact" "$REQUIRE_47" \
                  > "$sanitizer_stdout" 2> "$sanitizer_stderr"; then
                  sanitize_exit=0
                else
                  sanitize_exit=$?
                fi
              else
                sanitize_exit=2
                printf 'CAPTURE_REASON=sanitize/path-exception-controls-failed\n' > "$sanitizer_stderr"
              fi
            else
              sanitize_exit=2
              printf 'CAPTURE_REASON=sanitize/path-exception-controls-failed\n' > "$sanitizer_stderr"
            fi
          fi
          if [[ "$sanitize_exit" -eq 0 ]]; then
            exported_case_files="$(sed -n 's/^exported_case_files=//p' "$sanitizer_stdout")"
            expected_stdout="$CAPTURE_ROOT/sanitizer.expected"
            printf 'export_gate=PASS\nexported_case_files=%s\nexported_repeat_observations=2\n' "$exported_case_files" > "$expected_stdout"
            if ! cmp -s "$expected_stdout" "$sanitizer_stdout" || [[ -s "$sanitizer_stderr" ]] || [[ ! "$exported_case_files" =~ ^(0|[1-9][0-9]?)$ ]] || (( exported_case_files > 47 )); then
              sanitize_exit=2
              printf 'CAPTURE_REASON=sanitize/pass-output-invalid\n' >&2
            fi
          fi
          export_seal=FAIL
          export_seal_sha256=not-produced
          if [[ "$sanitize_exit" -eq 0 && "$CAPTURE_OUTCOME" == "success" ]]; then
            actual_workflow_head=""
            actual_workflow_tree=""
            seal_go_version="unavailable"
            seal_git_version="unavailable"
            if seal_go_raw="$(GOENV=off GOTOOLCHAIN=local go version 2>/dev/null)" && \
               [[ "$seal_go_raw" =~ ^go[[:space:]]version[[:space:]]go([0-9]+\.[0-9]+\.[0-9]+)[[:space:]](darwin|linux|windows)/(amd64|arm64)$ ]]; then
              seal_go_version="${BASH_REMATCH[1]}"
            fi
            if seal_git_raw="$(git -C "$GITHUB_WORKSPACE" --version 2>/dev/null)" && \
               [[ "$seal_git_raw" =~ ^git[[:space:]]version[[:space:]]([0-9]+\.[0-9]+\.[0-9]+)([[:space:]]\(Apple[[:space:]]Git-[0-9]+\)|\.windows\.[0-9]+)?$ ]]; then
              seal_git_version="${BASH_REMATCH[1]}"
            fi
            if actual_workflow_head="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD 2>/dev/null)" && \
               actual_workflow_tree="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{tree}' 2>/dev/null)" && \
               [[ "$actual_workflow_head" == "$WORKFLOW_HEAD" && "$WORKFLOW_HEAD" == "$GITHUB_SHA" ]]; then
              seal_stdout="$CAPTURE_ROOT/seal.stdout"
              seal_stderr="$CAPTURE_ROOT/seal.stderr"
              if env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off "$seal_binary" --write \
                "$CAPTURE_ROOT/raw-output" "$CAPTURE_ROOT/repeat-raw" "$CAPTURE_ROOT/artifact" \
                "$CAPTURE_ROOT/source-verification.log" "$GITHUB_WORKSPACE/testdata/originalcapture" \
                "$GITHUB_WORKSPACE/.temp/original-capture/harnessparity" "$actual_workflow_head" "$actual_workflow_tree" \
                "$RUNNER_OS" "$MATRIX_RUNNER" "$CAPTURE_UMASK" "$CAPTURE_PROBE_MODE" "$seal_go_version" "$seal_git_version" \
                > "$seal_stdout" 2> "$seal_stderr"; then
                export_seal_sha256="$(sed -n 's/^export_seal_sha256=//p' "$seal_stdout")"
                seal_expected="$CAPTURE_ROOT/seal.expected"
                printf 'export_seal=PASS\nexport_seal_sha256=%s\n' "$export_seal_sha256" > "$seal_expected"
                if [[ "$export_seal_sha256" =~ ^[0-9a-f]{64}$ ]] && cmp -s "$seal_expected" "$seal_stdout" && [[ ! -s "$seal_stderr" ]]; then
                  export_seal=PASS
                else
                  sanitize_exit=2
                  printf 'CAPTURE_REASON=sanitize/seal-output-invalid\n' >&2
                fi
              else
                sanitize_exit=2
                printf 'CAPTURE_REASON=sanitize/seal-generation-failed\n' >&2
              fi
            else
              sanitize_exit=2
              printf 'CAPTURE_REASON=sanitize/seal-workflow-identity-invalid\n' >&2
            fi
          elif [[ "$sanitize_exit" -eq 0 ]]; then
            export_seal=not-produced-incomplete-capture
          fi
          if [[ "$sanitize_exit" -ne 0 ]]; then
            printf 'exit_code=%s\nexport_seal=%s\nexport_seal_sha256=%s\n' \
              "$sanitize_exit" "$export_seal" "$export_seal_sha256" >> "$GITHUB_OUTPUT"
            reason_line=""
            if [[ ! -s "$sanitizer_stdout" ]] && [[ "$(wc -l < "$sanitizer_stderr" | tr -d ' ')" == 1 ]] && IFS= read -r reason_line < "$sanitizer_stderr" && [[ "$reason_line" =~ ^CAPTURE_REASON=sanitize/[a-z0-9-]+$ ]]; then
              printf '%s\n' "$reason_line" >&2
            else
              printf 'CAPTURE_REASON=sanitize/tool-command-failed\n' >&2
            fi
          else
            printf 'exit_code=0\nexport_gate=PASS\nexported_case_files=%s\nexported_repeat_observations=2\n' "$exported_case_files" >> "$GITHUB_OUTPUT"
            printf 'export_seal=%s\nexport_seal_sha256=%s\n' "$export_seal" "$export_seal_sha256" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$CAPTURE_OUTCOME" == "failure" ]]; then
            safe_failure_names="$CAPTURE_ROOT/failure-names.log-safe.txt"
            if [[ -s "$CAPTURE_ROOT/test-failures.names.txt" && -f "$sanitizer_binary" ]] && env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off \
              "$sanitizer_binary" --failure-diagnostics "$CAPTURE_ROOT/raw-output" \
              "$CAPTURE_ROOT/test-failures.names.txt" "$safe_failure_names" \
              > "$CAPTURE_ROOT/failure-names.stdout" 2> "$CAPTURE_ROOT/failure-names.stderr"; then
              if [[ -f "$safe_failure_names" ]]; then
                cat "$safe_failure_names"
              else
                printf '%s\n' 'CAPTURE_DETAIL Failure names withheld; sanitizer produced no safe diagnostic.'
              fi
            else
              printf '%s\n' 'CAPTURE_DETAIL Failure names withheld; sanitizer did not produce a safe diagnostic.'
            fi
            safe_failure_details="$CAPTURE_ROOT/failure-details.log-safe.txt"
            if [[ -s "$CAPTURE_ROOT/failure-details.txt" && -f "$sanitizer_binary" ]] && env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off \
              "$sanitizer_binary" --failure-diagnostics "$CAPTURE_ROOT/raw-output" \
              "$CAPTURE_ROOT/failure-details.txt" "$safe_failure_details" \
              > "$CAPTURE_ROOT/failure-details.stdout" 2> "$CAPTURE_ROOT/failure-details.stderr"; then
              if [[ -f "$safe_failure_details" ]]; then
                cat "$safe_failure_details"
              else
                printf '%s\n' 'CAPTURE_DETAIL Failure details withheld; sanitizer produced no safe diagnostic.'
              fi
            else
              printf '%s\n' 'CAPTURE_DETAIL Failure details withheld; sanitizer did not produce a safe diagnostic.'
            fi
          fi
          exit "$sanitize_exit"

      - name: Record lane metadata
        id: metadata
        if: always() && steps.directories.outcome == 'success'
        shell: bash
        env:
          CAPTURE_ROOT: ${{ steps.directories.outputs.root_posix }}
          MATRIX_RUNNER: ${{ matrix.runner }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GO_SETUP_OUTCOME: ${{ steps.setup_go.outcome }}
          SOURCE_OUTCOME: ${{ steps.verify_source.outcome }}
          SOURCE_EXIT: ${{ steps.verify_source.outputs.exit_code || 'not-run' }}
          MODULE_OUTCOME: ${{ steps.modules.outcome }}
          MODULE_EXIT: ${{ steps.modules.outputs.exit_code || 'not-run' }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          CAPTURE_UMASK: ${{ steps.capture.outputs.posix_umask || 'not-recorded' }}
          CAPTURE_PROBE_MODE: ${{ steps.capture.outputs.probe_dir_mode || 'not-recorded' }}
          CAPTURE_EXIT: ${{ steps.capture.outputs.test_command_exit || 'not-run' }}
          AUDIT_EXIT: ${{ steps.capture.outputs.audit_exit || 'not-run' }}
          CASE_EXECUTED: ${{ steps.capture.outputs.executed || '0' }}
          CASE_PASSED: ${{ steps.capture.outputs.passed || '0' }}
          CASE_FAILED: ${{ steps.capture.outputs.failed || '0' }}
          CASE_SKIPPED: ${{ steps.capture.outputs.skipped || '0' }}
          REPEAT_SEEN: ${{ steps.capture.outputs.repeat_seen || '0' }}
          REPEAT_PASSED: ${{ steps.capture.outputs.repeat_passed || '0' }}
          COMPARATOR_SEEN: ${{ steps.capture.outputs.comparator_rows || '0' }}
          COMPARATOR_PASSED: ${{ steps.capture.outputs.comparator_passed || '0' }}
          COMPARATOR_FAILED: ${{ steps.capture.outputs.comparator_failed || '0' }}
          COMPARATOR_SKIPPED: ${{ steps.capture.outputs.comparator_skipped || '0' }}
          COMPARATOR_MCP_CONTROL_PASSED: ${{ steps.capture.outputs.comparator_mcp_control_passed || '0' }}
          COMPARATOR_LAUNCHER_CONTROL_PASSED: ${{ steps.capture.outputs.comparator_launcher_control_passed || '0' }}
          ROOT_TESTS_PASSED: ${{ steps.capture.outputs.root_tests_passed || '0' }}
          WINDOWS_ROOT_PASSED: ${{ steps.capture.outputs.windows_root_parameter_passed || '0' }}
          ALL_TEST_FAILURES: ${{ steps.capture.outputs.all_test_failures || '0' }}
          ALL_TEST_SKIPS: ${{ steps.capture.outputs.all_test_skips || '0' }}
          OUTPUT_JSON_FILES: ${{ steps.capture.outputs.output_json_files || '0' }}
          SANITIZER_OUTCOME: ${{ steps.sanitize.outcome }}
          SANITIZER_EXIT: ${{ steps.sanitize.outputs.exit_code || 'not-run' }}
          EXPORT_GATE: ${{ steps.sanitize.outputs.export_gate || 'not-run' }}
          EXPORTED_CASE_FILES: ${{ steps.sanitize.outputs.exported_case_files || '0' }}
          EXPORTED_REPEAT_OBSERVATIONS: ${{ steps.sanitize.outputs.exported_repeat_observations || '0' }}
          EXPORT_SEAL: ${{ steps.sanitize.outputs.export_seal || 'not-produced' }}
          EXPORT_SEAL_SHA256: ${{ steps.sanitize.outputs.export_seal_sha256 || 'not-produced' }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          normalize_go_version() {
            local status="$1"
            local output="$2"
            if [[ "$status" != "0" ]]; then
              printf 'unavailable'
              return
            fi
            if [[ "$output" =~ ^go[[:space:]]version[[:space:]]go([0-9]+\.[0-9]+\.[0-9]+)[[:space:]](darwin|linux|windows)/(amd64|arm64)$ ]]; then
              printf '%s' "${BASH_REMATCH[1]}"
            else
              printf 'unavailable'
            fi
          }
          normalize_goos() {
            local status="$1"
            local value="$2"
            if [[ "$status" != "0" ]]; then
              printf 'unavailable'
              return
            fi
            case "$value" in
              darwin|linux|windows) printf '%s' "$value" ;;
              *) printf 'unavailable' ;;
            esac
          }
          normalize_goarch() {
            local status="$1"
            local value="$2"
            if [[ "$status" != "0" ]]; then
              printf 'unavailable'
              return
            fi
            case "$value" in
              amd64|arm64) printf '%s' "$value" ;;
              *) printf 'unavailable' ;;
            esac
          }
          normalize_git_version() {
            local status="$1"
            local output="$2"
            if [[ "$status" != "0" ]]; then
              printf 'unavailable'
              return
            fi
            if [[ "$output" =~ ^git[[:space:]]version[[:space:]]([0-9]+\.[0-9]+\.[0-9]+)([[:space:]]\(Apple[[:space:]]Git-[0-9]+\)|\.windows\.[0-9]+)?$ ]]; then
              printf '%s' "${BASH_REMATCH[1]}"
            else
              printf 'unavailable'
            fi
          }
          capture_version_probe() {
            local kind="$1"
            shift
            local raw=""
            if raw="$(GOENV=off GOTOOLCHAIN=local "$@" 2>/dev/null)"; then
              version_probe_exit=0
            else
              version_probe_exit=$?
              raw=""
            fi
            case "$kind" in
              go) version_probe_value="$(normalize_go_version "$version_probe_exit" "$raw")" ;;
              git) version_probe_value="$(normalize_git_version "$version_probe_exit" "$raw")" ;;
              *) version_probe_value="unavailable" ;;
            esac
          }
          token_payload="$(printf '%30s' '')"
          token_payload="${token_payload// /A}"
          token_shape="ghp_${token_payload}"
          version_probe_failure_fixture() {
            printf '%s\n' 'go version go1.25.5 darwin/arm64'
            printf '%s\n' '/Users/runner/PROBE_DIAGCONTROL' >&2
            return 23
          }
          failed_probe_control="$(
            {
              capture_version_probe go version_probe_failure_fixture
              printf '%s %s\n' "$version_probe_value" "$version_probe_exit"
            } 2>&1
          )"
          good_go_probe_control="$(
            {
              capture_version_probe go printf '%s\n' 'go version go1.25.5 darwin/arm64'
              printf '%s %s %s %s\n' "$version_probe_value" "$version_probe_exit" "$(normalize_goos 0 darwin)" "$(normalize_goarch 0 arm64)"
            } 2>&1
          )"
          good_windows_go_probe_control="$(
            {
              capture_version_probe go printf '%s\n' 'go version go1.25.5 windows/amd64'
              printf '%s %s %s %s\n' "$version_probe_value" "$version_probe_exit" "$(normalize_goos 0 windows)" "$(normalize_goarch 0 amd64)"
            } 2>&1
          )"
          good_linux_go_probe_control="$(
            {
              capture_version_probe go printf '%s\n' 'go version go1.25.5 linux/amd64'
              printf '%s %s %s %s\n' "$version_probe_value" "$version_probe_exit" "$(normalize_goos 0 linux)" "$(normalize_goarch 0 amd64)"
            } 2>&1
          )"
          good_git_probe_control="$(
            {
              capture_version_probe git printf '%s\n' 'git version 2.50.1 (Apple Git-155)'
              printf '%s %s\n' "$version_probe_value" "$version_probe_exit"
            } 2>&1
          )"
          good_windows_git_probe_control="$(
            {
              capture_version_probe git printf '%s\n' 'git version 2.50.1.windows.1'
              printf '%s %s\n' "$version_probe_value" "$version_probe_exit"
            } 2>&1
          )"
          token_goos_probe_control="$(normalize_go_version 0 "go version go1.25.5 ${token_shape}/arm64")"
          token_goos_env_control="$(normalize_goos 0 "$token_shape")"
          token_git_suffix_control="$(normalize_git_version 0 "git version 2.50.1.${token_shape}")"
          malformed_probe_control="$(
            {
              capture_version_probe git printf '%s\n' 'git version /Users/runner/PROBE_DIAGCONTROL'
              printf '%s %s\n' "$version_probe_value" "$version_probe_exit"
            } 2>&1
          )"
          if [[ "$failed_probe_control" != "unavailable 23" ||
                "$good_go_probe_control" != "1.25.5 0 darwin arm64" ||
                "$good_windows_go_probe_control" != "1.25.5 0 windows amd64" ||
                "$good_linux_go_probe_control" != "1.25.5 0 linux amd64" ||
                "$good_git_probe_control" != "2.50.1 0" ||
                "$good_windows_git_probe_control" != "2.50.1 0" ||
                "$token_goos_probe_control" != "unavailable" ||
                "$token_goos_env_control" != "unavailable" ||
                "$token_git_suffix_control" != "unavailable" ||
                "$malformed_probe_control" != "unavailable 0" ]]; then
            printf 'CAPTURE_REASON=metadata/version-probe-control-failed\n' >&2
            exit 2
          fi
          go_version="unavailable"
          goos="unavailable"
          goarch="unavailable"
          go_exit=127
          goos_exit=127
          goarch_exit=127
          if command -v go >/dev/null 2>&1; then
            capture_version_probe go go version
            go_version="$version_probe_value"
            go_exit="$version_probe_exit"
            set +e
            raw_goos="$(GOENV=off GOTOOLCHAIN=local go env GOOS 2>/dev/null)"
            goos_exit=$?
            raw_goarch="$(GOENV=off GOTOOLCHAIN=local go env GOARCH 2>/dev/null)"
            goarch_exit=$?
            set -e
            goos="$(normalize_goos "$goos_exit" "$raw_goos")"
            goarch="$(normalize_goarch "$goarch_exit" "$raw_goarch")"
          fi
          git_version="unavailable"
          git_exit=127
          if command -v git >/dev/null 2>&1; then
            capture_version_probe git git -C "$GITHUB_WORKSPACE" --version
            git_version="$version_probe_value"
            git_exit="$version_probe_exit"
          fi
          pushed_sha="$GITHUB_SHA"
          head=""
          head_exit=1
          if head="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD 2>/dev/null)"; then head_exit=0; fi
          head_matches_pushed_sha=false
          if [[ "$head" =~ ^[0-9a-f]{40}$ && "$pushed_sha" =~ ^[0-9a-f]{40}$ && "$head" == "$pushed_sha" ]]; then
            head_matches_pushed_sha=true
          fi
          tree=""
          tree_exit=1
          if tree="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify 'HEAD^{tree}' 2>/dev/null)"; then tree_exit=0; fi
          tree_matches_head=false
          if [[ "$tree" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ && "$tree_exit" -eq 0 ]]; then
            tree_matches_head=true
          fi
          working_status=""
          working_status_exit=1
          if working_status="$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all 2>/dev/null)"; then working_status_exit=0; fi
          working_clean=false
          if [[ "$working_status_exit" -eq 0 && -z "$working_status" ]]; then working_clean=true; fi
          umask_valid=false
          if [[ "$RUNNER_OS" == "Windows" && "$CAPTURE_UMASK" == "not-applicable" ]]; then
            if [[ "$CAPTURE_PROBE_MODE" == "not-applicable" ]]; then umask_valid=true; fi
          elif [[ ( "$RUNNER_OS" == "macOS" || "$RUNNER_OS" == "Linux" ) &&
                  "$CAPTURE_UMASK" == "0077" && "$CAPTURE_PROBE_MODE" == "0700" ]]; then
            umask_valid=true
          fi
          capture_counts_valid=false
          if [[ "$CASE_EXECUTED" == "47" && "$CASE_PASSED" == "47" && "$CASE_FAILED" == "0" && "$CASE_SKIPPED" == "0" &&
                "$REPEAT_SEEN" == "1" && "$REPEAT_PASSED" == "1" && "$COMPARATOR_SEEN" == "2" && "$COMPARATOR_PASSED" == "2" &&
                "$COMPARATOR_FAILED" == "0" && "$COMPARATOR_SKIPPED" == "0" && "$COMPARATOR_MCP_CONTROL_PASSED" == "1" &&
                "$COMPARATOR_LAUNCHER_CONTROL_PASSED" == "1" && "$ROOT_TESTS_PASSED" == "4" && "$WINDOWS_ROOT_PASSED" == "1" &&
                "$ALL_TEST_FAILURES" == "0" && "$ALL_TEST_SKIPS" == "0" && "$OUTPUT_JSON_FILES" == "47" &&
                "$EXPORTED_CASE_FILES" == "47" && "$EXPORTED_REPEAT_OBSERVATIONS" == "2" &&
                "$EXPORT_SEAL" == "PASS" && "$EXPORT_SEAL_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            capture_counts_valid=true
          fi
          lane_verdict=fail
          if [[ "$CHECKOUT_OUTCOME" == "success" && "$GO_SETUP_OUTCOME" == "success" &&
                "$SOURCE_OUTCOME" == "success" && "$MODULE_OUTCOME" == "success" &&
                "$CAPTURE_OUTCOME" == "success" && "$SANITIZER_OUTCOME" == "success" &&
                "$working_clean" == "true" && "$head_matches_pushed_sha" == "true" &&
                "$tree_matches_head" == "true" && "$umask_valid" == "true" && "$capture_counts_valid" == "true" ]]; then
            lane_verdict=pass
          fi
          {
            printf 'platform=%s\nrunner=%s\nverdict=%s\n' "$RUNNER_OS" "$MATRIX_RUNNER" "$lane_verdict"
            printf 'workflow_run_id=%s\nworkflow_run_attempt=%s\nworkflow_run_url=https://github.com/%s/actions/runs/%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'checkout_outcome=%s\ngo_setup_outcome=%s\n' "$CHECKOUT_OUTCOME" "$GO_SETUP_OUTCOME"
            printf 'posix-umask=%s\nprobe-dir-mode=%s\n' "$CAPTURE_UMASK" "$CAPTURE_PROBE_MODE"
            printf 'GOOS=%s\nGOARCH=%s\ngo_version=%s\ngo_version_exit=%s\ngoos_exit=%s\ngoarch_exit=%s\n' \
              "$goos" "$goarch" "$go_version" "$go_exit" "$goos_exit" "$goarch_exit"
            printf 'git_version=%s\ngit_version_exit=%s\nhead=%s\nhead_exit=%s\nhead_matches_pushed_sha=%s\ntree=%s\ntree_exit=%s\ntree_matches_head=%s\n' \
              "$git_version" "$git_exit" "$head" "$head_exit" "$head_matches_pushed_sha" "$tree" "$tree_exit" "$tree_matches_head"
            printf 'working_status_exit=%s\n' "$working_status_exit"
            printf 'source_verification_outcome=%s\nsource_verification_exit=%s\n' "$SOURCE_OUTCOME" "$SOURCE_EXIT"
            printf 'module_command=go mod download\nmodule_outcome=%s\nmodule_exit=%s\n' "$MODULE_OUTCOME" "$MODULE_EXIT"
            printf 'test_command=go test -p 1 -count=1 -v -json ./.temp/original-capture/harnessparity\n'
            printf 'test_outcome=%s\ntest_exit=%s\n' "$CAPTURE_OUTCOME" "$CAPTURE_EXIT"
            printf 'audit_command=go run <runner-temp>/audit.go <private-test-log> <output-directory> <test-exit> <failure-names-file> <failure-details-file>\naudit_exit=%s\n' "$AUDIT_EXIT"
            printf 'case_rows_executed=%s\ncase_rows_passed=%s\ncase_rows_failed=%s\ncase_rows_skipped=%s\n' \
              "$CASE_EXECUTED" "$CASE_PASSED" "$CASE_FAILED" "$CASE_SKIPPED"
            printf 'repeat_seen=%s\nrepeat_passed=%s\ncomparator_rows=%s\ncomparator_passed=%s\n' \
              "$REPEAT_SEEN" "$REPEAT_PASSED" "$COMPARATOR_SEEN" "$COMPARATOR_PASSED"
            printf 'comparator_failed=%s\ncomparator_skipped=%s\nroot_tests_passed=%s\n' \
              "$COMPARATOR_FAILED" "$COMPARATOR_SKIPPED" "$ROOT_TESTS_PASSED"
            printf 'comparator_mcp_control_passed=%s\ncomparator_launcher_control_passed=%s\n' \
              "$COMPARATOR_MCP_CONTROL_PASSED" "$COMPARATOR_LAUNCHER_CONTROL_PASSED"
            printf 'windows_root_parameter_passed=%s\nall_test_failures=%s\nall_test_skips=%s\noutput_json_files=%s\n' \
              "$WINDOWS_ROOT_PASSED" "$ALL_TEST_FAILURES" "$ALL_TEST_SKIPS" "$OUTPUT_JSON_FILES"
            printf 'export_gate=%s\nsanitizer_outcome=%s\nsanitizer_exit=%s\nexported_case_files=%s\nexported_repeat_observations=%s\n' \
              "$EXPORT_GATE" "$SANITIZER_OUTCOME" "$SANITIZER_EXIT" "$EXPORTED_CASE_FILES" "$EXPORTED_REPEAT_OBSERVATIONS"
            printf 'working_tree_clean=%s\n' "$working_clean"
            printf 'export_seal=%s\nexport_seal_sha256=%s\n' "$EXPORT_SEAL" "$EXPORT_SEAL_SHA256"
            printf 'capture_counts_valid=%s\n' "$capture_counts_valid"
          } > "$CAPTURE_ROOT/lane-metadata.txt"
          {
            printf '### Lane metadata: %s (%s)\n\n' "$RUNNER_OS" "$MATRIX_RUNNER"
            printf 'Verdict: **%s**. Rows: %s executed, %s passed, %s failed, %s skipped.\n' \
              "$lane_verdict" "$CASE_EXECUTED" "$CASE_PASSED" "$CASE_FAILED" "$CASE_SKIPPED"
            printf 'Export gate: %s; %s case files and %s repeat observations.\n' \
              "$EXPORT_GATE" "$EXPORTED_CASE_FILES" "$EXPORTED_REPEAT_OBSERVATIONS"
            printf 'Workflow head/tree: %s / %s. umask: %s; probe directory mode: %s.\n' \
              "$head" "$tree" "$CAPTURE_UMASK" "$CAPTURE_PROBE_MODE"
            printf 'Export seal: %s (%s).\n' "$EXPORT_SEAL" "$EXPORT_SEAL_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$head_matches_pushed_sha" != "true" ]]; then
            printf 'CAPTURE_REASON=metadata/head-mismatch\n' >&2
            exit 1
          fi
          if [[ "$working_clean" != "true" ]]; then
            printf 'CAPTURE_REASON=metadata/working-tree-dirty\n' >&2
            exit 1
          fi

      - name: Upload platform artifact
        if: always() && steps.directories.outcome == 'success' && steps.capture.outcome == 'success' && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: original-capture-06-${{ matrix.runner }}
          path: ${{ steps.directories.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 7
