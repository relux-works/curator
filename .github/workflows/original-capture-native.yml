name: Native original capture

on:
  push:
    branches:
      - capture/pr0-original-baseline-native

permissions:
  contents: read

jobs:
  capture:
    name: Capture (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout pushed commit
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Initialize private capture directories
        id: directories
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          fi
          capture_root="$runner_temp/original-capture-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$capture_root" == "$runner_temp/original-capture-"* ]] || exit 1
          umask 077
          [[ ! -e "$capture_root" && ! -L "$capture_root" ]] || exit 1
          mkdir -p "$capture_root/home/AppData/Roaming" "$capture_root/home/AppData/Local" \
            "$capture_root/tmp" "$capture_root/gocache" "$capture_root/gomodcache" \
            "$capture_root/gopath" "$capture_root/raw-output" "$capture_root/repeat-raw" "$capture_root/artifact"
          : > "$capture_root/home/.gitconfig"
          printf '%s\n' 'Source verification not run.' > "$capture_root/source-verification.log"
          printf '%s\n' 'Module download not run.' > "$capture_root/module-download.raw.txt"
          printf '%s\n' 'Test command not run.' > "$capture_root/test-output.raw.txt"
          printf '%s\n' 'Capture audit not run.' > "$capture_root/audit-output.raw.txt"
          printf '%s\n' 'No failing subtest detail.' > "$capture_root/failure-details.txt"
          artifact_dir="$capture_root/artifact"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            artifact_dir="$(cygpath -w "$artifact_dir")"
          fi
          printf 'root_posix=%s\n' "$capture_root" >> "$GITHUB_OUTPUT"
          printf 'artifact_dir=%s\n' "$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Verify pinned drivers and copy the test package
        id: verify_source
        shell: bash
        env:
          CAPTURE_ROOT: ${{ steps.directories.outputs.root_posix }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1" | awk '{print $1}'
            else
              echo "No SHA-256 utility is available." >&2
              return 2
            fi
          }
          verify_file() {
            expected="$1"
            path="$2"
            actual="$(hash_file "$path")"
            if [[ "$actual" != "$expected" ]]; then
              printf 'SHA-256 mismatch: %s\n' "$path" >&2
              return 1
            fi
            printf 'OK %s %s\n' "$path" "$actual"
          }
          verify_all() {
            prefix="$1"
            while read -r expected file; do
              [[ -n "$expected" ]] || continue
              verify_file "$expected" "$prefix/$file"
            done <<'PINS'
          35457d6728df2436292d85702621318d33b420b7d8aafd891cc96421be8d293b capture_homes_test.go
          e202ab658c45b6ebaba731c2a72eda82de4cb94583b251d0f73054361e124518 capture_launchers_test.go
          2928b6a0001dccfd39f430caa93ced8528b23653f4b3542103639eef09b908e4 controls_test.go
          deaefe19fadacd5d449176bfab0aa60d029c842f14c5070fbea7e9f0e539e983 launcher_fixture_test.go
          e9250a474e897a0d8aa9e0ee6f01afd0a42d8532ae6e8d812148810a4ffae911 legacy_fixture_test.go
          PINS
          }
          set +e
          (
            set -e
            verify_all testdata/originalcapture
            git -C "$GITHUB_WORKSPACE" check-ignore -q .temp/original-capture/harnessparity/capture_homes_test.go
            mkdir -p .temp/original-capture/harnessparity
            cp testdata/originalcapture/capture_homes_test.go \
              testdata/originalcapture/capture_launchers_test.go \
              testdata/originalcapture/controls_test.go \
              testdata/originalcapture/launcher_fixture_test.go \
              testdata/originalcapture/legacy_fixture_test.go \
              .temp/original-capture/harnessparity/
            verify_all .temp/original-capture/harnessparity
          ) > "$CAPTURE_ROOT/source-verification.log" 2>&1
          verify_exit=$?
          set -e
          printf 'exit_code=%s\n' "$verify_exit" >> "$GITHUB_OUTPUT"
          exit "$verify_exit"

      - name: Download public modules into the private cache
        id: modules
        shell: bash
        env:
          CAPTURE_ROOT: ${{ steps.directories.outputs.root_posix }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          native_path() {
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              cygpath -w "$1"
            else
              printf '%s' "$1"
            fi
          }
          go_dir="$(dirname "$(command -v go)")"
          git_dir="$(dirname "$(command -v git)")"
          trusted_path="$go_dir:$git_dir"
          home_path="$(native_path "$CAPTURE_ROOT/home")"
          temp_path="$(native_path "$CAPTURE_ROOT/tmp")"
          cache_path="$(native_path "$CAPTURE_ROOT/gocache")"
          modcache_path="$(native_path "$CAPTURE_ROOT/gomodcache")"
          gopath_path="$(native_path "$CAPTURE_ROOT/gopath")"
          gitconfig_path="$(native_path "$CAPTURE_ROOT/home/.gitconfig")"
          clean_env=(
            "HOME=$home_path"
            "TMPDIR=$temp_path"
            "TMP=$temp_path"
            "TEMP=$temp_path"
            "GOCACHE=$cache_path"
            "GOMODCACHE=$modcache_path"
            "GOPATH=$gopath_path"
            "GIT_CONFIG_NOSYSTEM=1"
            "GIT_CONFIG_GLOBAL=$gitconfig_path"
            "GIT_TERMINAL_PROMPT=0"
            "GCM_INTERACTIVE=Never"
            "GOENV=off"
            "GOTOOLCHAIN=local"
            "PATH=$trusted_path"
          )
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            systemroot="${SYSTEMROOT:-${WINDIR:-}}"
            [[ -n "$systemroot" ]] || exit 2
            trusted_path="$trusted_path:$(cygpath -u "$systemroot")/System32"
            clean_env[13]="PATH=$trusted_path"
            clean_env+=("SYSTEMROOT=$systemroot" "WINDIR=${WINDIR:-$systemroot}" \
              "USERPROFILE=$home_path" "APPDATA=$home_path/AppData/Roaming" \
              "LOCALAPPDATA=$home_path/AppData/Local")
          else
            trusted_path="$trusted_path:/usr/bin:/bin"
            clean_env[13]="PATH=$trusted_path"
          fi
          set +e
          env -i "${clean_env[@]}" GOPROXY=https://proxy.golang.org \
            GOSUMDB=sum.golang.org go mod download \
            > "$CAPTURE_ROOT/module-download.raw.txt" 2>&1
          command_exit=$?
          set -e
          printf 'exit_code=%s\n' "$command_exit" >> "$GITHUB_OUTPUT"
          exit "$command_exit"

      - name: Run the complete capture suite
        id: capture
        shell: bash
        env:
          CAPTURE_ROOT: ${{ steps.directories.outputs.root_posix }}
        run: |
          set -euo pipefail
          capture_shell_error() {
            local status=$?
            trap - ERR
            printf 'CAPTURE_REASON=capture/shell-command-failed\n' >&2
            exit "$status"
          }
          trap capture_shell_error ERR
          umask 077
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            printf 'posix_umask=not-applicable\n' >> "$GITHUB_OUTPUT"
          else
            effective_umask="$(umask)"
            if [[ "$effective_umask" != "0077" ]]; then
              printf 'posix_umask=invalid\n' >> "$GITHUB_OUTPUT"
              printf 'CAPTURE_REASON=capture/umask-mismatch\n' >&2
              exit 1
            fi
            printf 'posix_umask=%s\n' "$effective_umask" >> "$GITHUB_OUTPUT"
          fi
          cd "$GITHUB_WORKSPACE"
          cat > "$CAPTURE_ROOT/audit.go" <<'GO'
          package main

          import (
            "bufio"
            "encoding/json"
            "fmt"
            "io"
            "os"
            "path/filepath"
            "regexp"
            "strconv"
            "strings"
            "unicode/utf8"
          )

          type auditFailure string

          func (failure auditFailure) Error() string { return string(failure) }

          type testEvent struct {
            Action string `json:"Action"`
            Package string `json:"Package"`
            Test string `json:"Test"`
            Output string `json:"Output"`
          }

          type failureName struct {
            Package string
            Test string
          }

          type failureDetail struct {
            Package string
            Test string
            Output string
            Truncated bool
          }

          type detailKey struct {
            Package string
            Test string
          }

          const maxFailureDetails = 4
          const maxFailureDetailBytes = 1024
          const maxFailureDetailsBytes = 8192

          var publicTestName = regexp.MustCompile(`^[A-Za-z0-9_./-]+$`)

          type counts struct {
            baseline, baselinePass, baselineFail, baselineSkip int
            launchers, launcherPass, launcherFail, launcherSkip int
            repeatSeen, repeatPass int
            comparator, comparatorPass, comparatorFail, comparatorSkip int
            mcpControlPass, launcherControlPass int
            rootPass, windowsRootPass, allFails, allSkips int
            outputFiles int
          }

          func parseLog(input io.Reader) (counts, []failureName, error) {
            var result counts
            var failures []failureName
            scanner := bufio.NewScanner(input)
            scanner.Buffer(make([]byte, 64*1024), 16*1024*1024)
            for scanner.Scan() {
              var event testEvent
              if err := json.Unmarshal(scanner.Bytes(), &event); err != nil {
                return result, nil, auditFailure("CAPTURE_REASON=capture/audit-invalid-test-event")
              }
              if event.Action == "fail" && event.Test == "" {
                if publicTestName.MatchString(event.Package) {
                  failures = append(failures, failureName{Package: event.Package})
                }
                continue
              }
              if event.Test == "" {
                continue
              }
              status, name := strings.ToUpper(event.Action)+":", event.Test
              if status != "PASS:" && status != "FAIL:" && status != "SKIP:" {
                continue
              }
              if status == "FAIL:" {
                result.allFails++
                if publicTestName.MatchString(event.Package) && publicTestName.MatchString(event.Test) {
                  failures = append(failures, failureName{Package: event.Package, Test: event.Test})
                }
              }
              if status == "SKIP:" { result.allSkips++ }
              if strings.HasPrefix(name, "TestFreezeOriginalBaseline/") {
                if name == "TestFreezeOriginalBaseline/repeat-determinism" {
                  result.repeatSeen++
                  if status == "PASS:" { result.repeatPass++ }
                } else {
                  result.baseline++
                  if status == "PASS:" { result.baselinePass++ }
                  if status == "FAIL:" { result.baselineFail++ }
                  if status == "SKIP:" { result.baselineSkip++ }
                }
              }
              if strings.HasPrefix(name, "TestFreezeOriginalLaunchers/") {
                result.launchers++
                if status == "PASS:" { result.launcherPass++ }
                if status == "FAIL:" { result.launcherFail++ }
                if status == "SKIP:" { result.launcherSkip++ }
              }
              if strings.HasPrefix(name, "TestOriginalComparatorControls/") {
                result.comparator++
                if status == "PASS:" { result.comparatorPass++ }
                if status == "FAIL:" { result.comparatorFail++ }
                if status == "SKIP:" { result.comparatorSkip++ }
              }
              if name == "TestOriginalComparatorControls/claude_code-mcp" && status == "PASS:" { result.mcpControlPass++ }
              if name == "TestOriginalComparatorControls/claude-launcher-typed-projection" && status == "PASS:" { result.launcherControlPass++ }
              if status == "PASS:" && (name == "TestFreezeOriginalBaseline" ||
                  name == "TestFreezeOriginalLaunchers" ||
                  name == "TestOriginalComparatorControls" ||
                  name == "TestWindowsRootParameter") { result.rootPass++ }
              if name == "TestWindowsRootParameter" && status == "PASS:" { result.windowsRootPass++ }
            }
            if scanner.Err() != nil {
              return result, nil, auditFailure("CAPTURE_REASON=capture/audit-test-log-read")
            }
            return result, failures, nil
          }

          func (value counts) rowCountsValid() bool {
            executed := value.baseline + value.launchers
            passed := value.baselinePass + value.launcherPass
            failed := value.baselineFail + value.launcherFail
            skipped := value.baselineSkip + value.launcherSkip
            return value.baseline == 17 && value.launchers == 30 &&
              executed == 47 && passed == 47 && failed == 0 && skipped == 0 &&
              value.repeatSeen == 1 && value.repeatPass == 1 &&
              value.comparator == 2 && value.comparatorPass == 2 &&
              value.comparatorFail == 0 && value.comparatorSkip == 0 &&
              value.mcpControlPass == 1 && value.launcherControlPass == 1 &&
              value.rootPass == 4 && value.windowsRootPass == 1 &&
              value.allFails == 0 && value.allSkips == 0
          }

          func (value counts) valid(testExit int) bool {
            return testExit == 0 && value.rowCountsValid() && value.outputFiles == 47
          }

          func selfCheck() error {
            var sample strings.Builder
            const samplePackage = "github.com/relux-works/curator/.temp/original-capture/harnessparity"
            addPass := func(name string) {
              fmt.Fprintf(&sample, "{\"Action\":\"pass\",\"Package\":%q,\"Test\":%q}\n", samplePackage, name)
            }
            for index := 0; index < 17; index++ { addPass(fmt.Sprintf("TestFreezeOriginalBaseline/case-%02d", index)) }
            addPass("TestFreezeOriginalBaseline/repeat-determinism")
            for index := 0; index < 30; index++ { addPass(fmt.Sprintf("TestFreezeOriginalLaunchers/case-%02d", index)) }
            addPass("TestOriginalComparatorControls/claude_code-mcp")
            addPass("TestOriginalComparatorControls/claude-launcher-typed-projection")
            addPass("TestFreezeOriginalBaseline")
            addPass("TestFreezeOriginalLaunchers")
            addPass("TestOriginalComparatorControls")
            addPass("TestWindowsRootParameter")
            parsed, _, err := parseLog(strings.NewReader(sample.String()))
            if err != nil { return auditFailure("CAPTURE_REASON=capture/audit-self-check-json") }
            parsed.outputFiles = 47
            if !parsed.valid(0) { return auditFailure("CAPTURE_REASON=capture/audit-self-check-positive") }
            parsed.allSkips++
            if parsed.valid(0) { return auditFailure("CAPTURE_REASON=capture/audit-self-check-skip") }
            parsed.allSkips--
            parsed.outputFiles = 46
            if parsed.valid(0) { return auditFailure("CAPTURE_REASON=capture/audit-self-check-count") }
            failing := `{"Action":"fail","Package":"public/package","Test":"TestPublicFailure","Output":"CAPTURE_PRIVATE_OUTPUT_CONTROL"}`
            _, failures, err := parseLog(strings.NewReader(failing + "\n"))
            if err != nil || len(failures) != 1 || failures[0].Package != "public/package" ||
                failures[0].Test != "TestPublicFailure" || strings.Contains(fmt.Sprint(failures), "CAPTURE_PRIVATE_OUTPUT_CONTROL") {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-failure-names")
            }
            detailFailure := failureName{Package: "public/package", Test: "TestPublicFailure"}
            detailEvents := strings.Join([]string{
              `{"Action":"output","Package":"public/package","Test":"TestPassing","Output":"PASSING_TEST_DETAIL_MUST_NOT_APPEAR\n"}`,
              `{"Action":"output","Package":"public/package","Test":"TestPublicFailure","Output":"SAFE_FAILURE_DETAIL_CONTROL\n"}`,
              `{"Action":"fail","Package":"public/package","Test":"TestPublicFailure"}`,
            }, "\n")
            details, err := collectFailureDetails(strings.NewReader(detailEvents), []failureName{detailFailure})
            if err != nil || len(details) != 1 || details[0].Package != detailFailure.Package ||
                details[0].Test != detailFailure.Test || !strings.Contains(details[0].Output, "SAFE_FAILURE_DETAIL_CONTROL") ||
                strings.Contains(details[0].Output, "PASSING_TEST_DETAIL_MUST_NOT_APPEAR") {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-failure-detail")
            }
            if len(details[0].Output) > 1024 {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-failure-detail-bound")
            }
            excessFailures := []failureName{
              {Package: "public/package", Test: "TestFailure1"},
              {Package: "public/package", Test: "TestFailure2"},
              {Package: "public/package", Test: "TestFailure3"},
              {Package: "public/package", Test: "TestFailure4"},
              {Package: "public/package", Test: "TestFailure5"},
            }
            capped, err := collectFailureDetails(strings.NewReader(""), excessFailures)
            if err != nil || len(capped) != 4 {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-failure-detail-count")
            }
            longOutput := strings.Repeat("X", maxFailureDetailBytes+100)
            longEvent := fmt.Sprintf(`{"Action":"output","Package":%q,"Test":%q,"Output":%q}`,
              detailFailure.Package, detailFailure.Test, longOutput)
            bounded, err := collectFailureDetails(strings.NewReader(longEvent+"\n"), []failureName{detailFailure})
            if err != nil || len(bounded) != 1 || len(bounded[0].Output) > maxFailureDetailBytes || !bounded[0].Truncated {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-failure-detail-bound")
            }
            detailFile, err := os.CreateTemp("", "capture-failure-detail-selfcheck-")
            if err != nil {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-failure-detail")
            }
            detailPath := detailFile.Name()
            if err := detailFile.Close(); err != nil {
              os.Remove(detailPath)
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-failure-detail")
            }
            defer os.Remove(detailPath)
            if err := writeFailureDetails(detailPath, details); err != nil {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-failure-detail")
            }
            written, err := os.ReadFile(detailPath)
            if err != nil || len(written) > 8192 || len(written) > maxFailureDetailsBytes ||
                !strings.Contains(string(written), "SAFE_FAILURE_DETAIL_CONTROL") {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-failure-detail")
            }
            if err := writeFailureDetails(detailPath, bounded); err != nil {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-failure-detail")
            }
            truncatedWritten, err := os.ReadFile(detailPath)
            if err != nil || len(truncatedWritten) > 8192 ||
                !strings.Contains(string(truncatedWritten), "Failure detail truncated by the capture limit.") {
              return auditFailure("CAPTURE_REASON=capture/audit-self-check-failure-detail-bound")
            }
            return nil
          }

          func writeFailureNames(path string, failures []failureName) error {
            var names strings.Builder
            for _, failure := range failures {
              fmt.Fprintf(&names, "CAPTURE_FAIL Package=%s Test=%s\n", failure.Package, failure.Test)
            }
            if err := os.WriteFile(path, []byte(names.String()), 0600); err != nil {
              return auditFailure("CAPTURE_REASON=capture/audit-failure-name-write")
            }
            return nil
          }

          func appendBounded(current, value string, limit int) (string, bool) {
            remaining := limit - len(current)
            if remaining <= 0 {
              return current, true
            }
            if len(value) <= remaining {
              return current + value, false
            }
            prefix := value[:remaining]
            for len(prefix) > 0 && !utf8.ValidString(prefix) {
              prefix = prefix[:len(prefix)-1]
            }
            return current + prefix, true
          }

          func collectFailureDetails(input io.Reader, failures []failureName) ([]failureDetail, error) {
            selected := make([]failureName, 0, maxFailureDetails)
            selectedKeys := make(map[detailKey]bool)
            for _, failure := range failures {
              key := detailKey{Package: failure.Package, Test: failure.Test}
              if failure.Test == "" || len(failure.Package) > 256 || len(failure.Test) > 256 ||
                  !publicTestName.MatchString(failure.Package) || !publicTestName.MatchString(failure.Test) || selectedKeys[key] {
                continue
              }
              if len(selected) == maxFailureDetails {
                break
              }
              selected = append(selected, failure)
              selectedKeys[key] = true
            }

            scanner := bufio.NewScanner(input)
            scanner.Buffer(make([]byte, 64*1024), 16*1024*1024)
            output := make(map[detailKey]string, len(selected))
            seen := make(map[detailKey]bool, len(selected))
            truncated := make(map[detailKey]bool, len(selected))
            for scanner.Scan() {
              var event testEvent
              if err := json.Unmarshal(scanner.Bytes(), &event); err != nil {
                return nil, auditFailure("CAPTURE_REASON=capture/audit-invalid-failure-detail-event")
              }
              if event.Action != "output" {
                continue
              }
              key := detailKey{Package: event.Package, Test: event.Test}
              if !selectedKeys[key] {
                continue
              }
              seen[key] = true
              next, cut := appendBounded(output[key], event.Output, maxFailureDetailBytes)
              output[key] = next
              if cut {
                truncated[key] = true
              }
            }
            if scanner.Err() != nil {
              return nil, auditFailure("CAPTURE_REASON=capture/audit-failure-detail-read")
            }

            details := make([]failureDetail, 0, len(selected))
            for _, failure := range selected {
              key := detailKey{Package: failure.Package, Test: failure.Test}
              detail := output[key]
              if !seen[key] || detail == "" {
                detail = "[No output event was recorded.]\n"
              }
              details = append(details, failureDetail{
                Package: failure.Package, Test: failure.Test,
                Output: detail, Truncated: truncated[key],
              })
            }
            return details, nil
          }

          func writeFailureDetails(path string, details []failureDetail) error {
            var report strings.Builder
            for _, detail := range details {
              if len(detail.Package) > 256 || len(detail.Test) > 256 ||
                  !publicTestName.MatchString(detail.Package) || !publicTestName.MatchString(detail.Test) {
                continue
              }
              header := fmt.Sprintf("CAPTURE_DETAIL Package=%s Test=%s\n", detail.Package, detail.Test)
              if report.Len()+len(header) > maxFailureDetailsBytes {
                break
              }
              report.WriteString(header)
              body, cut := appendBounded("", detail.Output, maxFailureDetailsBytes-report.Len())
              report.WriteString(body)
              if detail.Truncated || cut {
                marker := "\n[Failure detail truncated by the capture limit.]\n"
                if report.Len()+len(marker) <= maxFailureDetailsBytes {
                  report.WriteString(marker)
                }
              }
            }
            if report.Len() == 0 {
              report.WriteString("No failing subtest detail was captured.\n")
            }
            if report.Len() > maxFailureDetailsBytes {
              return auditFailure("CAPTURE_REASON=capture/audit-failure-detail-bound")
            }
            if err := os.WriteFile(path, []byte(report.String()), 0600); err != nil {
              return auditFailure("CAPTURE_REASON=capture/audit-failure-detail-write")
            }
            return nil
          }

          func printCounts(result counts) {
            executed := result.baseline + result.launchers
            passed := result.baselinePass + result.launcherPass
            failed := result.baselineFail + result.launcherFail
            skipped := result.baselineSkip + result.launcherSkip
            fmt.Printf("executed=%d\npassed=%d\nfailed=%d\nskipped=%d\n", executed, passed, failed, skipped)
            fmt.Printf("baseline_rows=%d\nlauncher_rows=%d\n", result.baseline, result.launchers)
            fmt.Printf("repeat_seen=%d\nrepeat_passed=%d\n", result.repeatSeen, result.repeatPass)
            fmt.Printf("comparator_rows=%d\ncomparator_passed=%d\n", result.comparator, result.comparatorPass)
            fmt.Printf("comparator_failed=%d\ncomparator_skipped=%d\n", result.comparatorFail, result.comparatorSkip)
            fmt.Printf("comparator_mcp_control_passed=%d\ncomparator_launcher_control_passed=%d\n", result.mcpControlPass, result.launcherControlPass)
            fmt.Printf("root_tests_passed=%d\nwindows_root_parameter_passed=%d\n", result.rootPass, result.windowsRootPass)
            fmt.Printf("all_test_failures=%d\nall_test_skips=%d\noutput_json_files=%d\n", result.allFails, result.allSkips, result.outputFiles)
          }

          func run() error {
            if err := selfCheck(); err != nil { return err }
            if len(os.Args) != 6 { return auditFailure("CAPTURE_REASON=capture/audit-invalid-arguments") }
            testExit, err := strconv.Atoi(os.Args[3])
            if err != nil { return auditFailure("CAPTURE_REASON=capture/audit-invalid-test-exit") }
            input, err := os.Open(os.Args[1])
            if err != nil { return auditFailure("CAPTURE_REASON=capture/audit-test-log-open") }
            result, failures, parseErr := parseLog(input)
            closeErr := input.Close()
            if parseErr != nil { return parseErr }
            if closeErr != nil { return auditFailure("CAPTURE_REASON=capture/audit-test-log-close") }
            if testExit != 0 {
              if err := writeFailureNames(os.Args[4], failures); err != nil { return err }
              detailInput, err := os.Open(os.Args[1])
              if err != nil { return auditFailure("CAPTURE_REASON=capture/audit-failure-detail-open") }
              details, detailErr := collectFailureDetails(detailInput, failures)
              detailCloseErr := detailInput.Close()
              if detailErr != nil { return detailErr }
              if detailCloseErr != nil { return auditFailure("CAPTURE_REASON=capture/audit-failure-detail-close") }
              if err := writeFailureDetails(os.Args[5], details); err != nil { return err }
            }
            entries, err := os.ReadDir(os.Args[2])
            if err != nil {
              printCounts(result)
              return auditFailure("CAPTURE_REASON=capture/audit-output-list")
            }
            result.outputFiles = len(entries)
            for _, entry := range entries {
              if entry.IsDir() || filepath.Ext(entry.Name()) != ".json" {
                printCounts(result)
                return auditFailure("CAPTURE_REASON=capture/audit-output-entry-unexpected")
              }
            }
            printCounts(result)
            if testExit != 0 { return auditFailure("CAPTURE_REASON=capture/go-test-failed") }
            if result.outputFiles != 47 { return auditFailure("CAPTURE_REASON=capture/audit-output-count-incomplete") }
            if !result.rowCountsValid() { return auditFailure("CAPTURE_REASON=capture/audit-row-counts-incomplete") }
            return nil
          }

          func main() {
            if err := run(); err != nil {
              if failure, ok := err.(auditFailure); ok {
                fmt.Fprintln(os.Stderr, failure.Error())
              } else {
                fmt.Fprintln(os.Stderr, "CAPTURE_REASON=capture/audit-internal-failure")
              }
              os.Exit(1)
            }
          }
          GO
          native_path() {
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              cygpath -w "$1"
            else
              printf '%s' "$1"
            fi
          }
          go_dir="$(dirname "$(command -v go)")"
          git_dir="$(dirname "$(command -v git)")"
          env_dir="$(dirname "$(command -v env)")"
          trusted_path="$go_dir:$git_dir:$env_dir"
          home_path="$(native_path "$CAPTURE_ROOT/home")"
          temp_path="$(native_path "$CAPTURE_ROOT/tmp")"
          cache_path="$(native_path "$CAPTURE_ROOT/gocache")"
          modcache_path="$(native_path "$CAPTURE_ROOT/gomodcache")"
          gopath_path="$(native_path "$CAPTURE_ROOT/gopath")"
          output_path="$(native_path "$CAPTURE_ROOT/raw-output")"
          repeat_path="$(native_path "$CAPTURE_ROOT/repeat-raw")"
          gitconfig_path="$(native_path "$CAPTURE_ROOT/home/.gitconfig")"
          clean_env=(
            "HOME=$home_path"
            "TMPDIR=$temp_path"
            "TMP=$temp_path"
            "TEMP=$temp_path"
            "GOCACHE=$cache_path"
            "GOMODCACHE=$modcache_path"
            "GOPATH=$gopath_path"
            "GIT_CONFIG_NOSYSTEM=1"
            "GIT_CONFIG_GLOBAL=$gitconfig_path"
            "GIT_TERMINAL_PROMPT=0"
            "GCM_INTERACTIVE=Never"
            "GOENV=off"
            "GOTOOLCHAIN=local"
            "PATH=$trusted_path"
          )
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            systemroot="${SYSTEMROOT:-${WINDIR:-}}"
            if [[ -z "$systemroot" ]]; then
              printf 'CAPTURE_REASON=capture/systemroot-missing\n' >&2
              exit 2
            fi
            trusted_path="$trusted_path:$(cygpath -u "$systemroot")/System32"
            clean_env[13]="PATH=$trusted_path"
            clean_env+=("SYSTEMROOT=$systemroot" "WINDIR=${WINDIR:-$systemroot}" \
              "USERPROFILE=$home_path" "APPDATA=$home_path/AppData/Roaming" \
              "LOCALAPPDATA=$home_path/AppData/Local")
          else
            trusted_path="$trusted_path:/usr/bin:/bin"
            clean_env[13]="PATH=$trusted_path"
          fi
          if ! find "$CAPTURE_ROOT/raw-output" -mindepth 1 -print -quit > "$CAPTURE_ROOT/output-entry-check.raw.txt"; then
            printf 'CAPTURE_REASON=capture/output-directory-scan-failed\n' >&2
            exit 1
          fi
          if [[ -s "$CAPTURE_ROOT/output-entry-check.raw.txt" ]]; then
            printf 'CAPTURE_REASON=capture/output-directory-not-empty\n' >&2
            exit 2
          fi
          failed_names_file="$CAPTURE_ROOT/test-failures.names.txt"
          failure_details_file="$CAPTURE_ROOT/failure-details.txt"
          private_test_log="$CAPTURE_ROOT/test-output.private.raw.txt"
          if env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off \
            HARNESS_CAPTURE_OUT="$output_path" \
            HARNESS_REPEAT_CAPTURE_OUT="$repeat_path" \
            go test -p 1 -count=1 -v -json ./.temp/original-capture/harnessparity \
            > "$private_test_log" 2>&1; then
            test_exit=0
          else
            test_exit=$?
          fi
          if env -i "${clean_env[@]}" GOPROXY=off GOSUMDB=off \
            go run "$CAPTURE_ROOT/audit.go" "$private_test_log" \
            "$CAPTURE_ROOT/raw-output" "$test_exit" "$failed_names_file" "$failure_details_file" \
            > "$CAPTURE_ROOT/audit-metrics.raw.txt" 2> "$CAPTURE_ROOT/audit-error.raw.txt"; then
            audit_exit=0
          else
            audit_exit=$?
          fi
          if [[ "$test_exit" -eq 0 && "$audit_exit" -eq 0 ]]; then
            cp "$private_test_log" "$CAPTURE_ROOT/test-output.raw.txt"
          else
            printf '%s\n' 'Full test log withheld; see sanitized failure-details.txt.' \
              > "$CAPTURE_ROOT/test-output.raw.txt"
          fi
          cat "$CAPTURE_ROOT/audit-metrics.raw.txt" > "$CAPTURE_ROOT/audit-output.raw.txt"
          audit_metrics=()
          audit_metric_count=0
          metrics_valid=true
          while IFS= read -r line; do
            if [[ "$line" =~ ^[a-z0-9_]+=[0-9]+$ ]]; then
              audit_metrics+=("$line")
              audit_metric_count=$((audit_metric_count + 1))
            else
              metrics_valid=false
              break
            fi
          done < "$CAPTURE_ROOT/audit-metrics.raw.txt"
          if [[ "$audit_metric_count" -ne 19 ]]; then metrics_valid=false; fi
          if [[ "$metrics_valid" != "true" ]]; then audit_exit=2; fi
          {
            printf 'test_command_exit=%s\naudit_exit=%s\n' "$test_exit" "$audit_exit"
            if [[ "$metrics_valid" == "true" ]]; then
              printf '%s\n' "${audit_metrics[@]}"
            fi
          } >> "$GITHUB_OUTPUT"
          {
            printf '### Native capture: %s (%s)\n\n' "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'Test command exit: %s. Go audit command exit: %s.\n' "$test_exit" "$audit_exit"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$audit_exit" -ne 0 ]]; then
            if [[ "$metrics_valid" != "true" ]]; then
              audit_reason_line='CAPTURE_REASON=capture/audit-metrics-invalid'
            else
              reason_found=false
              audit_reason_line=''
              while IFS= read -r line; do
                if [[ "$line" =~ ^CAPTURE_REASON=capture/[a-z0-9-]+$ ]]; then
                  audit_reason_line="$line"
                  reason_found=true
                  break
                fi
              done < "$CAPTURE_ROOT/audit-error.raw.txt"
              if [[ "$reason_found" != "true" ]]; then
                audit_reason_line='CAPTURE_REASON=capture/audit-command-failed'
              fi
            fi
            printf '%s\n' "$audit_reason_line" >> "$CAPTURE_ROOT/audit-output.raw.txt"
            printf '%s\n' "$audit_reason_line" >&2
            if [[ "$audit_metric_count" -gt 0 ]]; then
              for line in "${audit_metrics[@]}"; do
                printf 'CAPTURE_COUNT %s\n' "$line" >&2
              done
            fi
            if [[ "$test_exit" -ne 0 && -f "$failed_names_file" ]]; then
              while IFS= read -r line; do
                if [[ "$line" =~ ^CAPTURE_FAIL\ Package=([A-Za-z0-9_./-]+)\ Test=([A-Za-z0-9_./-]*)$ ]]; then
                  printf 'CAPTURE_FAIL Package=%s Test=%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" >&2
                fi
              done < "$failed_names_file"
            fi
          fi
          exit "$audit_exit"

      - name: Sanitize and verify artifact contents
        id: sanitize
        if: always() && steps.directories.outcome == 'success' && steps.setup_go.outcome == 'success'
        shell: bash
        env:
          CAPTURE_ROOT: ${{ steps.directories.outputs.root_posix }}
          REQUIRE_47: ${{ steps.capture.outcome == 'success' }}
        run: |
          set -euo pipefail
          sanitize_shell_error() {
            local status=$?
            trap - ERR
            printf 'CAPTURE_REASON=sanitize/shell-command-failed\n' >&2
            exit "$status"
          }
          trap sanitize_shell_error ERR
          cd "$GITHUB_WORKSPACE"
          sanitizer_source_dir="$GITHUB_WORKSPACE/.temp/capture-exporter"
          mkdir -p "$sanitizer_source_dir"
          cat > "$sanitizer_source_dir/main.go" <<'GO'
          package main

          import (
              "bytes"
              "crypto/sha256"
              "encoding/base64"
              "encoding/hex"
              "encoding/json"
              "errors"
              "fmt"
              "io"
              "os"
              "path/filepath"
              "regexp"
              "runtime"
              "sort"
              "strings"

              "github.com/relux-works/curator/internal/envmarker"
          )

          type gateError struct {
              code     string
              security bool
          }

          func (e gateError) Error() string { return e.code }

          func operational(code string) error { return gateError{code: "sanitize/" + code} }
          func refusal(code string) error     { return gateError{code: "sanitize/" + code, security: true} }

          type detector struct {
              code    string
              pattern *regexp.Regexp
          }

          var detectors = []detector{
              {"token-bearer", regexp.MustCompile("(?i)\\bBearer\\s+[A-Za-z0-9._~+/=-]{8,}")},
              {"token-github-gitlab", regexp.MustCompile("\\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|glpat-[A-Za-z0-9_-]{20,})\\b")},
              {"token-sk", regexp.MustCompile("\\bsk-[A-Za-z0-9_-]{20,}\\b")},
              {"token-slack", regexp.MustCompile("\\bxox[baprs]-[A-Za-z0-9-]{10,}\\b")},
              {"token-aws-access-key", regexp.MustCompile("\\bAKIA[0-9A-Z]{16}\\b")},
              {"token-jwt", regexp.MustCompile("\\beyJ[A-Za-z0-9_-]{5,}\\.[A-Za-z0-9_-]{5,}\\.[A-Za-z0-9_-]{5,}\\b")},
              {"token-private-key", regexp.MustCompile("(?s)-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----")},
              {"token-hostile-sentinel", regexp.MustCompile("(?i)HOSTILE_SECRET_[A-Z0-9_]+")},
              {"token-google-stripe", regexp.MustCompile("(?i)\\b(?:AIza[0-9A-Za-z_-]{35}|sk_(?:live|test)_[A-Za-z0-9]{16,})\\b")},
              {"path-private-home", regexp.MustCompile("(?i)(?:[A-Za-z]:)?[/\\\\](?:[^/\\\\\\s\\\"'<>]+[/\\\\])*(?:Users|home)(?:[/\\\\][^\\s\\\"'<>]*)?")},
              {"path-absolute", regexp.MustCompile(`(?i)(?:^|[^A-Za-z0-9_:/])(?:[A-Z]:[\\/]|\\\\|/(?:[^/\s"'<>]+/)+)[^\s"'<>]*`)},
          }

          var assignmentPattern = regexp.MustCompile("(?i)[A-Za-z0-9_.-]*(?:secret|token|password|passwd|credential|authorization|api[_-]?key|access[_-]?key|refresh[_-]?token|private[_-]?key)[A-Za-z0-9_.-]*\\s*[:=]\\s*[^,;\\n}]+")

          func sensitiveName(name string) bool {
              lower := strings.ToLower(name)
              normalized := strings.NewReplacer("_", "", "-", "", ".", "").Replace(lower)
              for _, part := range []string{"secret", "token", "password", "passwd", "authorization", "apikey", "accesskey", "refreshtoken", "privatekey"} {
                  if strings.Contains(normalized, part) {
                      return true
                  }
              }
              return strings.Contains(normalized, "credential") && !strings.Contains(normalized, "credentialstore")
          }

          func emptyMetadata(key string, value any) bool {
              if key != "credential_source" && key != "secret_material_waivers" {
                  return false
              }
              switch item := value.(type) {
              case nil:
                  return true
              case string:
                  return item == ""
              case map[string]any:
                  return len(item) == 0
              case []any:
                  return len(item) == 0
              default:
                  return false
              }
          }

          func fixtureRootForms(caseDir string) []string {
              root := filepath.Join(filepath.Dir(caseDir), "tmp")
              forms := []string{root, filepath.ToSlash(root)}
              quoted, err := json.Marshal(root)
              if err == nil && len(quoted) >= 2 {
                  forms = append(forms, string(quoted[1:len(quoted)-1]))
              }
              sort.Slice(forms, func(i, j int) bool { return len(forms[i]) > len(forms[j]) })
              return forms
          }

          func pathBoundaryBefore(value string, at int) bool {
              if at == 0 {
                  return true
              }
              switch value[at-1] {
              case '"', '\'', ' ', '\t', '\n', '\r', '=', ':', '(', '[', '{', ',', ';':
                  return true
              default:
                  return false
              }
          }

          func pathBoundaryAfter(value string, at int) bool {
              if at == len(value) {
                  return true
              }
              switch value[at] {
              case '/':
                  return true
              case '\\':
                  return os.PathSeparator == '\\'
              case '"', '\'', ' ', '\t', '\n', '\r', ',', ';', ')', ']', '}':
                  return true
              default:
                  return false
              }
          }

          func hasFixtureRoot(value string, forms []string) bool {
              for _, form := range forms {
                  if form == "" {
                      continue
                  }
                  for offset := 0; offset < len(value); {
                      found := strings.Index(value[offset:], form)
                      if found < 0 {
                          break
                      }
                      at := offset + found
                      after := at + len(form)
                      if pathBoundaryBefore(value, at) && pathBoundaryAfter(value, after) {
                          return true
                      }
                      offset = at + 1
                  }
              }
              return false
          }

          func unsafeText(value string, roots []string) error {
              if err := unsafeTextPatterns(value, roots); err != nil {
                  return err
              }
              if assignmentPattern.MatchString(value) {
                  return refusal("credential-assignment")
              }
              return nil
          }

          func unsafeTextPatterns(value string, roots []string) error {
              if hasFixtureRoot(value, roots) {
                  return refusal("path-fixture-root-leak")
              }
              for _, item := range detectors {
                  if item.pattern.MatchString(value) {
                      return refusal(item.code)
                  }
              }
              return nil
          }

          type duplicateJSONKey struct{}

          func (duplicateJSONKey) Error() string { return "duplicate JSON object key" }

          func decodeJSONValue(decoder *json.Decoder) (any, error) {
              token, err := decoder.Token()
              if err != nil {
                  return nil, err
              }
              delim, ok := token.(json.Delim)
              if !ok {
                  return token, nil
              }
              switch delim {
              case '{':
                  object := make(map[string]any)
                  for decoder.More() {
                      keyToken, err := decoder.Token()
                      if err != nil {
                          return nil, err
                      }
                      key, ok := keyToken.(string)
                      if !ok {
                          return nil, errors.New("invalid object key")
                      }
                      if _, exists := object[key]; exists {
                          return nil, duplicateJSONKey{}
                      }
                      child, err := decodeJSONValue(decoder)
                      if err != nil {
                          return nil, err
                      }
                      object[key] = child
                  }
                  closing, err := decoder.Token()
                  if err != nil || closing != json.Delim('}') {
                      return nil, errors.New("invalid object end")
                  }
                  return object, nil
              case '[':
                  array := make([]any, 0)
                  for decoder.More() {
                      child, err := decodeJSONValue(decoder)
                      if err != nil {
                          return nil, err
                      }
                      array = append(array, child)
                  }
                  closing, err := decoder.Token()
                  if err != nil || closing != json.Delim(']') {
                      return nil, errors.New("invalid array end")
                  }
                  return array, nil
              default:
                  return nil, errors.New("unexpected JSON delimiter")
              }
          }

          func parseJSON(data []byte) (any, error) {
              decoder := json.NewDecoder(bytes.NewReader(data))
              decoder.UseNumber()
              value, err := decodeJSONValue(decoder)
              if err != nil {
                  return nil, err
              }
              if _, err := decoder.Token(); err != io.EOF {
                  if err == nil {
                      return nil, errors.New("trailing JSON value")
                  }
                  return nil, err
              }
              return value, nil
          }

          func scanJSON(data []byte, roots []string) error {
              value, err := parseJSON(data)
              if err != nil {
                  var duplicate duplicateJSONKey
                  if errors.As(err, &duplicate) {
                      return operational("input-duplicate-json-key")
                  }
                  return operational("input-invalid-json")
              }
              return scanValueDepthRaw(value, roots, 0, data)
          }

          func scanBlob(data []byte, roots []string) error {
              value, err := parseJSON(data)
              if err == nil {
                  return scanValueDepthRaw(value, roots, 0, data)
              }
              var duplicate duplicateJSONKey
              if errors.As(err, &duplicate) {
                  return operational("input-duplicate-json-key")
              }
              return scanStructuredText(data, roots, 0)
          }

          func scanLog(data []byte, roots []string) error {
              return scanStructuredText(data, roots, 0)
          }

          func scanStructuredText(data []byte, roots []string, depth int) error {
              if depth > 128 {
                  return operational("input-json-depth-exceeded")
              }
              if err := unsafeTextPatterns(string(data), roots); err != nil {
                  return err
              }
              textStart := 0
              for offset := 0; offset < len(data); offset++ {
                  if data[offset] != '{' && data[offset] != '[' {
                      continue
                  }
                  decoder := json.NewDecoder(bytes.NewReader(data[offset:]))
                  decoder.UseNumber()
                  value, err := decodeJSONValue(decoder)
                  if err != nil {
                      var duplicate duplicateJSONKey
                      if errors.As(err, &duplicate) {
                          return operational("input-duplicate-json-key")
                      }
                      continue
                  }
                  end := offset + int(decoder.InputOffset())
                  if end <= offset {
                      continue
                  }
                  if err := unsafeTextAssignments(string(data[textStart:offset])); err != nil {
                      return err
                  }
                  if err := scanValueDepthRaw(value, roots, depth+1, data[offset:end]); err != nil {
                      return err
                  }
                  textStart = end
                  offset = end - 1
              }
              return unsafeTextAssignments(string(data[textStart:]))
          }

          func unsafeTextAssignments(value string) error {
              if assignmentPattern.MatchString(value) {
                  return refusal("credential-assignment")
              }
              return nil
          }

          func scanValue(value any, roots []string) error {
              return scanValueDepthRaw(value, roots, 0, nil)
          }

          func scanValueDepth(value any, roots []string, depth int) error {
              return scanValueDepthRaw(value, roots, depth, nil)
          }

          func scanValueDepthRaw(value any, roots []string, depth int, raw []byte) error {
              if depth > 128 {
                  return operational("input-json-depth-exceeded")
              }
              switch item := value.(type) {
              case map[string]any:
                  credentialSourcePending := false
                  if source, exists := item["credential_source"]; exists && !emptyMetadata("credential_source", source) {
                      // Scan the field values before parsing so detector hits retain their
                      // detector reason even when the same value also makes the marker invalid.
                      if err := scanValueDepth(source, roots, depth+1); err != nil {
                          return err
                      }
                      credentialSourcePending = true
                  }
                  keys := make([]string, 0, len(item))
                  for key := range item {
                      keys = append(keys, key)
                  }
                  sort.Strings(keys)
                  for _, key := range keys {
                      if err := unsafeText(key, roots); err != nil {
                          return err
                      }
                      child := item[key]
                      if sensitiveName(key) && key != "TBH_CREDENTIAL_BACKEND" {
                          if emptyMetadata(key, child) {
                              continue
                          }
                          if key == "credential_source" && credentialSourcePending {
                              continue
                          }
                          return refusal("sensitive-field-nonempty")
                      }
                      if strings.EqualFold(key, "bytes") || strings.EqualFold(key, "document") {
                          if encoded, ok := child.(string); ok {
                              decoded, err := base64.StdEncoding.DecodeString(encoded)
                              if err == nil {
                                  if strings.EqualFold(key, "bytes") {
                                      if digest, exists := item["sha256"]; exists {
                                          expected, ok := digest.(string)
                                          actual := sha256.Sum256(decoded)
                                          if !ok || expected != hex.EncodeToString(actual[:]) {
                                              return operational("decoded-sha256-mismatch")
                                          }
                                      }
                                  }
                                  if err := scanBlob(decoded, roots); err != nil {
                                      return err
                                  }
                              }
                          }
                      }
                      if key == "credential_source" && credentialSourcePending {
                          continue
                      }
                      if err := scanValueDepth(child, roots, depth+1); err != nil {
                          return err
                      }
                  }
                  if credentialSourcePending {
                      marker, err := validateCredentialSourceCarrier(raw)
                      if err != nil {
                          return err
                      }
                      parsedSource, err := json.Marshal(marker.CredentialSource)
                      if err != nil {
                          return operational("credential-source-scan-failed")
                      }
                      parsedValue, err := parseJSON(parsedSource)
                      if err != nil {
                          return operational("credential-source-scan-failed")
                      }
                      if err := scanValueDepth(parsedValue, roots, depth+1); err != nil {
                          return err
                      }
                  }
              case []any:
                  for _, child := range item {
                      if err := scanValueDepth(child, roots, depth+1); err != nil {
                          return err
                      }
                  }
              case string:
                  return scanStructuredText([]byte(item), roots, depth+1)
              }
              return nil
          }

          func validateCredentialSourceCarrier(raw []byte) (*envmarker.Marker, error) {
              if len(raw) == 0 {
                  return nil, refusal("credential-source-invalid")
              }
              marker, err := envmarker.Parse(raw)
              if err != nil || marker == nil || marker.Version != envmarker.VersionV7 || marker.CredentialSource == nil {
                  return nil, refusal("credential-source-invalid")
              }
              return marker, nil
          }

          type inputFile struct {
              name string
              data []byte
              mode os.FileMode
          }

          func readRegular(path, reason string) (inputFile, error) {
              info, err := os.Lstat(path)
              if err != nil || !info.Mode().IsRegular() {
                  return inputFile{}, operational(reason)
              }
              file, err := os.Open(path)
              if err != nil {
                  return inputFile{}, operational(reason)
              }
              defer file.Close()
              opened, err := file.Stat()
              if err != nil || !opened.Mode().IsRegular() || !os.SameFile(info, opened) {
                  return inputFile{}, operational(reason)
              }
              data, err := io.ReadAll(file)
              if err != nil {
                  return inputFile{}, operational(reason)
              }
              after, err := file.Stat()
              if err != nil || after.Size() != int64(len(data)) || after.Mode().Perm() != opened.Mode().Perm() || !after.ModTime().Equal(opened.ModTime()) {
                  return inputFile{}, operational(reason)
              }
              return inputFile{name: filepath.Base(path), data: data, mode: opened.Mode().Perm()}, nil
          }

          func readDirectoryFiles(directory string, want map[string]bool, reason string) ([]inputFile, error) {
              info, err := os.Lstat(directory)
              if err != nil || !info.IsDir() {
                  return nil, operational(reason)
              }
              entries, err := os.ReadDir(directory)
              if err != nil {
                  return nil, operational(reason)
              }
              if len(entries) != len(want) {
                  return nil, operational(reason)
              }
              result := make([]inputFile, 0, len(entries))
              for _, entry := range entries {
                  name := entry.Name()
                  if !want[name] || filepath.Base(name) != name || entry.IsDir() {
                      return nil, operational(reason)
                  }
                  file, err := readRegular(filepath.Join(directory, name), reason)
                  if err != nil {
                      return nil, err
                  }
                  result = append(result, file)
              }
              sort.Slice(result, func(i, j int) bool { return result[i].name < result[j].name })
              return result, nil
          }

          func readCaseFiles(directory string, require47 bool) ([]inputFile, error) {
              info, err := os.Lstat(directory)
              if err != nil || !info.IsDir() {
                  return nil, operational("input-case-list-invalid")
              }
              entries, err := os.ReadDir(directory)
              if err != nil || len(entries) > 47 {
                  return nil, operational("input-case-list-invalid")
              }
              if require47 && len(entries) != 47 {
                  return nil, operational("input-case-count-invalid")
              }
              result := make([]inputFile, 0, len(entries))
              for _, entry := range entries {
                  name := entry.Name()
                  if filepath.Base(name) != name || filepath.Ext(name) != ".json" || name == "MANIFEST.json" || entry.IsDir() {
                      return nil, operational("input-case-entry-invalid")
                  }
                  file, err := readRegular(filepath.Join(directory, name), "input-read-failed")
                  if err != nil {
                      return nil, err
                  }
                  result = append(result, file)
              }
              sort.Slice(result, func(i, j int) bool { return result[i].name < result[j].name })
              return result, nil
          }

          type manifestEntry struct {
              path   string
              bytes  int64
              sha256 string
          }

          func manifestFor(files []inputFile) []manifestEntry {
              result := make([]manifestEntry, 0, len(files))
              for _, file := range files {
                  digest := sha256.Sum256(file.data)
                  result = append(result, manifestEntry{path: file.name, bytes: int64(len(file.data)), sha256: hex.EncodeToString(digest[:])})
              }
              sort.Slice(result, func(i, j int) bool { return result[i].path < result[j].path })
              return result
          }

          func writeFile(path string, data []byte, mode os.FileMode) error {
              if err := os.WriteFile(path, data, mode); err != nil {
                  return err
              }
              return os.Chmod(path, mode)
          }

          func writeManifest(directory string, files []inputFile) error {
              entries := manifestFor(files)
              var encoded bytes.Buffer
              encoded.WriteString("{\"files\":[")
              for index, entry := range entries {
                  if index > 0 {
                      encoded.WriteByte(',')
                  }
                  pathJSON, err := json.Marshal(entry.path)
                  if err != nil {
                      return operational("manifest-encode-failed")
                  }
                  fmt.Fprintf(&encoded, "{\"path\":%s,\"bytes\":%d,\"sha256\":%q}", pathJSON, entry.bytes, entry.sha256)
              }
              encoded.WriteString("]}\n")
              if err := writeFile(filepath.Join(directory, "MANIFEST.json"), encoded.Bytes(), 0600); err != nil {
                  return operational("manifest-write-failed")
              }
              return nil
          }

          func directoryEmpty(path string) (bool, error) {
              info, err := os.Lstat(path)
              if err != nil || !info.IsDir() {
                  return false, operational("artifact-directory-invalid")
              }
              entries, err := os.ReadDir(path)
              if err != nil {
                  return false, operational("artifact-directory-read-failed")
              }
              return len(entries) == 0, nil
          }

          func writeInputSet(stage string, dirname string, files []inputFile) error {
              directory := filepath.Join(stage, dirname)
              if err := os.Mkdir(directory, 0700); err != nil {
                  return operational("staging-failed")
              }
              for _, file := range files {
                  if err := writeFile(filepath.Join(directory, file.name), file.data, file.mode); err != nil {
                      return operational("staging-failed")
                  }
              }
              if err := writeManifest(directory, files); err != nil {
                  return err
              }
              return nil
          }

          func exportGate(caseDir, repeatDir, artifactDir string, require47 bool) error {
              empty, err := directoryEmpty(artifactDir)
              if err != nil {
                  return err
              }
              if !empty {
                  return operational("artifact-not-empty")
              }
              cases, err := readCaseFiles(caseDir, require47)
              if err != nil {
                  return err
              }
              repeats, err := readDirectoryFiles(repeatDir, map[string]bool{"first.json": true, "second.json": true}, "input-repeat-set-invalid")
              if err != nil {
                  return err
              }
              parent := filepath.Dir(caseDir)
              logNames := []string{"audit-output.raw.txt", "module-download.raw.txt", "source-verification.log", "test-output.raw.txt", "failure-details.txt"}
              logs := make([]inputFile, 0, len(logNames))
              for _, name := range logNames {
                  file, err := readRegular(filepath.Join(parent, name), "input-log-read-failed")
                  if err != nil {
                      return err
                  }
                  logs = append(logs, file)
              }
              roots := fixtureRootForms(caseDir)
              for _, file := range cases {
                  if err := unsafeText(file.name, roots); err != nil {
                      return err
                  }
                  if sensitiveName(strings.TrimSuffix(file.name, filepath.Ext(file.name))) {
                      return refusal("sensitive-field-nonempty")
                  }
                  if err := scanJSON(file.data, roots); err != nil {
                      return err
                  }
              }
              for _, file := range repeats {
                  if err := unsafeText(file.name, roots); err != nil {
                      return err
                  }
                  if err := scanJSON(file.data, roots); err != nil {
                      return err
                  }
              }
              for _, file := range logs {
                  if err := scanLog(file.data, roots); err != nil {
                      return err
                  }
              }
              stage, err := os.MkdirTemp(filepath.Dir(artifactDir), ".capture-export-stage-")
              if err != nil {
                  return operational("staging-create-failed")
              }
              defer os.RemoveAll(stage)
              if err := os.Chmod(stage, 0700); err != nil {
                  return operational("staging-create-failed")
              }
              if err := writeInputSet(stage, "outputs", cases); err != nil {
                  return err
              }
              if err := writeInputSet(stage, "repeat-observations", repeats); err != nil {
                  return err
              }
              for _, file := range logs {
                  if err := writeFile(filepath.Join(stage, file.name), file.data, file.mode); err != nil {
                      return operational("staging-failed")
                  }
              }
              published := make([]string, 0, len(logNames)+2)
              rollback := func() error {
                  failed := false
                  for _, name := range published {
                      if err := os.RemoveAll(filepath.Join(artifactDir, name)); err != nil {
                          failed = true
                      }
                  }
                  if failed {
                      return operational("rollback-failed")
                  }
                  return nil
              }
              for _, name := range append([]string{"outputs", "repeat-observations"}, logNames...) {
                  source := filepath.Join(stage, name)
                  target := filepath.Join(artifactDir, name)
                  if err := os.Rename(source, target); err != nil {
                      if rollbackErr := rollback(); rollbackErr != nil {
                          return rollbackErr
                      }
                      return operational("publish-failed")
                  }
                  published = append(published, name)
              }
              return nil
          }

          func parseRequire47(value string) (bool, bool) {
              switch value {
              case "true":
                  return true, true
              case "false":
                  return false, true
              default:
                  return false, false
              }
          }

          func main() {
              if err := selfCheck(); err != nil {
                  if failure, ok := err.(gateError); ok {
                      fmt.Fprintln(os.Stderr, "CAPTURE_REASON="+failure.code)
                  } else {
                      fmt.Fprintln(os.Stderr, "CAPTURE_REASON=sanitize/internal-failure")
                  }
                  os.Exit(2)
              }
              os.Exit(runGate(os.Args[1:], os.Stdout, os.Stderr))
          }

          func runGate(args []string, stdout, stderr io.Writer) int {
              if len(args) != 4 {
                  fmt.Fprintln(stderr, "CAPTURE_REASON=sanitize/invalid-arguments")
                  return 2
              }
              require47, ok := parseRequire47(args[3])
              if !ok {
                  fmt.Fprintln(stderr, "CAPTURE_REASON=sanitize/invalid-arguments")
                  return 2
              }
              if err := exportGate(args[0], args[1], args[2], require47); err != nil {
                  failure, typed := err.(gateError)
                  if !typed {
                      fmt.Fprintln(stderr, "CAPTURE_REASON=sanitize/internal-failure")
                      return 2
                  }
                  fmt.Fprintln(stderr, "CAPTURE_REASON="+failure.code)
                  if failure.security {
                      return 1
                  }
                  return 2
              }
              fmt.Fprintf(stdout, "export_gate=PASS\nexported_case_files=%d\nexported_repeat_observations=2\n", countCaseFiles(args[0]))
              return 0
          }

          func countCaseFiles(directory string) int {
              entries, err := os.ReadDir(directory)
              if err != nil {
                  return 0
              }
              return len(entries)
          }

          type controlPaths struct {
              root       string
              caseDir    string
              repeatDir  string
              artifact   string
              caseFiles  []inputFile
              repeatData []inputFile
              logData    []inputFile
          }

          func prepareControl(base string, caseCount int) (controlPaths, error) {
              paths := controlPaths{
                  root:      filepath.Join(base, "capture"),
                  caseDir:   filepath.Join(base, "capture", "raw-output"),
                  repeatDir: filepath.Join(base, "capture", "repeat-raw"),
                  artifact:  filepath.Join(base, "capture", "artifact"),
              }
              for _, directory := range []string{paths.caseDir, paths.repeatDir, paths.artifact, filepath.Join(paths.root, "tmp")} {
                  if err := os.MkdirAll(directory, 0700); err != nil {
                      return paths, operational("selfcheck-fixture-setup-failed")
                  }
              }
              for index := 0; index < caseCount; index++ {
                  name := fmt.Sprintf("case-%02d.json", index)
                  data := []byte(fmt.Sprintf("{\"case\":%d}\n", index))
                  file := inputFile{name: name, data: data, mode: 0600}
                  if err := writeFile(filepath.Join(paths.caseDir, name), data, file.mode); err != nil {
                      return paths, operational("selfcheck-fixture-setup-failed")
                  }
                  paths.caseFiles = append(paths.caseFiles, file)
              }
              for _, name := range []string{"first.json", "second.json"} {
                  data := []byte("{\"observation\":\"neutral\"}\n")
                  file := inputFile{name: name, data: data, mode: 0600}
                  if err := writeFile(filepath.Join(paths.repeatDir, name), data, file.mode); err != nil {
                      return paths, operational("selfcheck-fixture-setup-failed")
                  }
                  paths.repeatData = append(paths.repeatData, file)
              }
              for _, name := range []string{"audit-output.raw.txt", "module-download.raw.txt", "source-verification.log", "test-output.raw.txt", "failure-details.txt"} {
                  data := []byte("neutral control log\n")
                  file := inputFile{name: name, data: data, mode: 0600}
                  if err := writeFile(filepath.Join(paths.root, name), data, file.mode); err != nil {
                      return paths, operational("selfcheck-fixture-setup-failed")
                  }
                  paths.logData = append(paths.logData, file)
              }
              return paths, nil
          }

          func assertArtifactEmpty(path string) error {
              entries, err := os.ReadDir(path)
              if err != nil || len(entries) != 0 {
                  return operational("selfcheck-refusal-published-payload")
              }
              return nil
          }

          func expectRefusal(paths controlPaths, expected string) error {
              var stdout, stderr bytes.Buffer
              code := runGate([]string{paths.caseDir, paths.repeatDir, paths.artifact, "false"}, &stdout, &stderr)
              if code != 1 || stdout.Len() != 0 || stderr.String() != diagnostic(expected) {
                  return operational("selfcheck-refusal-control-failed")
              }
              return assertArtifactEmpty(paths.artifact)
          }

          func diagnostic(code string) string { return "CAPTURE_REASON=sanitize/" + code + "\n" }

          func triggerJSON(value string) []byte {
              encoded, _ := json.Marshal(map[string]string{"value": value})
              return append(encoded, '\n')
          }

          func readMarkerControl() (map[string]any, error) {
              payload, err := os.ReadFile(filepath.Join("internal", "envmarker", "testdata", "seed-c", "node.json"))
              if err != nil {
                  return nil, operational("selfcheck-marker-fixture-read-failed")
              }
              marker, err := envmarker.Parse(payload)
              if err != nil || marker == nil || marker.Version != envmarker.VersionV7 || marker.CredentialSource == nil {
                  return nil, operational("selfcheck-marker-fixture-invalid")
              }
              value, err := parseJSON(payload)
              if err != nil {
                  return nil, operational("selfcheck-marker-fixture-invalid")
              }
              object, ok := value.(map[string]any)
              if !ok {
                  return nil, operational("selfcheck-marker-fixture-invalid")
              }
              return object, nil
          }

          func markerCredentialSource(marker map[string]any) (map[string]any, error) {
              source, ok := marker["credential_source"].(map[string]any)
              if !ok {
                  return nil, operational("selfcheck-marker-fixture-invalid")
              }
              return source, nil
          }

          func markerNodeSource(marker map[string]any) (map[string]any, error) {
              credentialSource, err := markerCredentialSource(marker)
              if err != nil {
                  return nil, err
              }
              source, ok := credentialSource["source"].(map[string]any)
              if !ok {
                  return nil, operational("selfcheck-marker-fixture-invalid")
              }
              return source, nil
          }

          func plantMarkerControl(paths *controlPaths, marker map[string]any) error {
              if len(paths.caseFiles) != 1 {
                  return operational("selfcheck-fixture-setup-failed")
              }
              payload, err := json.Marshal(marker)
              if err != nil {
                  return operational("selfcheck-fixture-setup-failed")
              }
              digest := sha256.Sum256(payload)
              data, err := json.Marshal(map[string]any{
                  "bytes":  base64.StdEncoding.EncodeToString(payload),
                  "sha256": hex.EncodeToString(digest[:]),
              })
              if err != nil {
                  return operational("selfcheck-fixture-setup-failed")
              }
              data = append(data, '\n')
              file := inputFile{name: "case-00.json", data: data, mode: 0600}
              if err := writeFile(filepath.Join(paths.caseDir, file.name), file.data, file.mode); err != nil {
                  return operational("selfcheck-fixture-setup-failed")
              }
              paths.caseFiles[0] = file
              return nil
          }

          func prepareMarkerControl(base string, mutate func(map[string]any) error) (controlPaths, error) {
              marker, err := readMarkerControl()
              if err != nil {
                  return controlPaths{}, err
              }
              if mutate != nil {
                  if err := mutate(marker); err != nil {
                      return controlPaths{}, err
                  }
              }
              paths, err := prepareControl(base, 1)
              if err != nil {
                  return paths, err
              }
              if err := plantMarkerControl(&paths, marker); err != nil {
                  return paths, err
              }
              return paths, nil
          }

          func plantControl(paths controlPaths, target, name string, data []byte) error {
              var path string
              switch target {
              case "case":
                  path = filepath.Join(paths.caseDir, name)
              case "repeat":
                  path = filepath.Join(paths.repeatDir, name)
              case "log":
                  path = filepath.Join(paths.root, name)
              default:
                  return operational("selfcheck-fixture-setup-failed")
              }
              return writeFile(path, data, 0600)
          }

          func plantExpectedLog(paths *controlPaths, name string, data []byte) error {
              for index := range paths.logData {
                  if paths.logData[index].name != name {
                      continue
                  }
                  if err := writeFile(filepath.Join(paths.root, name), data, paths.logData[index].mode); err != nil {
                      return operational("selfcheck-fixture-setup-failed")
                  }
                  paths.logData[index].data = append([]byte(nil), data...)
                  return nil
              }
              return operational("selfcheck-fixture-setup-failed")
          }

          func expectedManifest(files []inputFile) []byte {
              var encoded bytes.Buffer
              encoded.WriteString("{\"files\":[")
              ordered := append([]inputFile(nil), files...)
              sort.Slice(ordered, func(i, j int) bool { return ordered[i].name < ordered[j].name })
              for index, file := range ordered {
                  if index > 0 {
                      encoded.WriteByte(',')
                  }
                  name, _ := json.Marshal(file.name)
                  digest := sha256.Sum256(file.data)
                  fmt.Fprintf(&encoded, "{\"path\":%s,\"bytes\":%d,\"sha256\":%q}", name, len(file.data), hex.EncodeToString(digest[:]))
              }
              encoded.WriteString("]}\n")
              return encoded.Bytes()
          }

          func verifyControlArtifact(paths controlPaths) error {
              entries, err := os.ReadDir(paths.artifact)
              if err != nil || len(entries) != 7 {
                  return operational("selfcheck-output-shape-failed")
              }
              expectedRoot := map[string]bool{
                  "outputs": true, "repeat-observations": true,
                  "audit-output.raw.txt": true, "module-download.raw.txt": true,
                  "source-verification.log": true, "test-output.raw.txt": true, "failure-details.txt": true,
              }
              for _, entry := range entries {
                  if !expectedRoot[entry.Name()] {
                      return operational("selfcheck-output-shape-failed")
                  }
              }
              for _, group := range []struct {
                  name  string
                  files []inputFile
              }{
                  {"outputs", paths.caseFiles},
                  {"repeat-observations", paths.repeatData},
              } {
                  directory := filepath.Join(paths.artifact, group.name)
                  items, err := os.ReadDir(directory)
                  if err != nil || len(items) != len(group.files)+1 {
                      return operational("selfcheck-output-shape-failed")
                  }
                  for _, file := range group.files {
                      path := filepath.Join(directory, file.name)
                      got, err := os.ReadFile(path)
                      if err != nil || !bytes.Equal(got, file.data) {
                          return operational("selfcheck-byte-preservation-failed")
                      }
                      info, statErr := os.Stat(path)
                      if statErr != nil || !controlModePreserved(info.Mode().Perm(), file.mode) {
                          return operational("selfcheck-mode-preservation-failed")
                      }
                  }
                  gotManifest, err := os.ReadFile(filepath.Join(directory, "MANIFEST.json"))
                  if err != nil || !bytes.Equal(gotManifest, expectedManifest(group.files)) {
                      return operational("selfcheck-manifest-failed")
                  }
              }
              for _, file := range paths.logData {
                  path := filepath.Join(paths.artifact, file.name)
                  got, err := os.ReadFile(path)
                  if err != nil || !bytes.Equal(got, file.data) {
                      return operational("selfcheck-byte-preservation-failed")
                  }
                  info, statErr := os.Stat(path)
                  if statErr != nil || !controlModePreserved(info.Mode().Perm(), file.mode) {
                      return operational("selfcheck-mode-preservation-failed")
                  }
              }
              return nil
          }

          func controlModePreserved(got, want os.FileMode) bool {
              return controlModePreservedFor(runtime.GOOS, got, want)
          }

          func controlModePreservedFor(goos string, got, want os.FileMode) bool {
              if goos == "windows" {
                  return got&0200 == want&0200
              }
              return got == want
          }

          func checkModeControls() error {
              controls := []struct {
                  goos string
                  got  os.FileMode
                  want os.FileMode
                  pass bool
              }{
                  {"windows", 0666, 0600, true},
                  {"windows", 0444, 0400, true},
                  {"windows", 0444, 0600, false},
                  {"windows", 0666, 0400, false},
                  {"darwin", 0600, 0600, true},
                  {"darwin", 0666, 0600, false},
              }
              for _, control := range controls {
                  if controlModePreservedFor(control.goos, control.got, control.want) != control.pass {
                      return operational("selfcheck-mode-control-failed")
                  }
              }
              return nil
          }

          func expectByteCorruptionRejected(paths controlPaths, path string, file inputFile) error {
              data, err := os.ReadFile(path)
              if err != nil || len(data) == 0 || !bytes.Equal(data, file.data) {
                  return operational("selfcheck-negative-control-failed")
              }
              corrupted := append([]byte(nil), data...)
              corrupted[0] ^= 1
              if err := os.WriteFile(path, corrupted, file.mode); err != nil {
                  return operational("selfcheck-negative-control-failed")
              }
              gate, ok := verifyControlArtifact(paths).(gateError)
              restoreErr := os.WriteFile(path, data, file.mode)
              if restoreErr != nil {
                  return operational("selfcheck-negative-control-failed")
              }
              if !ok || gate.code != "sanitize/selfcheck-byte-preservation-failed" {
                  return operational("selfcheck-negative-control-failed")
              }
              return nil
          }

          func expectAllByteCorruptionsRejected(paths controlPaths) error {
              if len(paths.caseFiles) == 0 || len(paths.repeatData) == 0 || len(paths.logData) == 0 {
                  return operational("selfcheck-negative-control-failed")
              }
              for _, file := range paths.caseFiles {
                  path := filepath.Join(paths.artifact, "outputs", file.name)
                  if err := expectByteCorruptionRejected(paths, path, file); err != nil {
                      return err
                  }
              }
              for _, file := range paths.repeatData {
                  path := filepath.Join(paths.artifact, "repeat-observations", file.name)
                  if err := expectByteCorruptionRejected(paths, path, file); err != nil {
                      return err
                  }
              }
              for _, file := range paths.logData {
                  path := filepath.Join(paths.artifact, file.name)
                  if err := expectByteCorruptionRejected(paths, path, file); err != nil {
                      return err
                  }
              }
              if err := verifyControlArtifact(paths); err != nil {
                  return operational("selfcheck-negative-control-failed")
              }
              return nil
          }

          func expectPass(paths controlPaths, require47 bool) error {
              var stdout, stderr bytes.Buffer
              code := runGate([]string{paths.caseDir, paths.repeatDir, paths.artifact, fmt.Sprint(require47)}, &stdout, &stderr)
              expected := fmt.Sprintf("export_gate=PASS\nexported_case_files=%d\nexported_repeat_observations=2\n", countCaseFiles(paths.caseDir))
              if code != 0 || stdout.String() != expected || stderr.Len() != 0 {
                  return operational("selfcheck-positive-control-failed")
              }
              return verifyControlArtifact(paths)
          }

          func selfCheck() error {
              base, err := os.MkdirTemp("", "capture-export-selfcheck-")
              if err != nil {
                  return operational("selfcheck-temp-create-failed")
              }
              defer os.RemoveAll(base)
              if err := checkModeControls(); err != nil {
                  return err
              }

              neutral, err := prepareControl(filepath.Join(base, "neutral"), 1)
              if err != nil {
                  return err
              }
              blob := []byte("{\"nested\":[\"ordinary\",17]}")
              digest := sha256.Sum256(blob)
              neutralValue := map[string]any{
                  "credential_source":       nil,
                  "secret_material_waivers": map[string]any{},
                  "credentialStore":         "neutral",
                  "TBH_CREDENTIAL_BACKEND":  map[string]any{"nested": []any{"ordinary", json.Number("3")}},
                  "BYTES":                   "not base64",
                  "bytes":                   base64.StdEncoding.EncodeToString(blob),
                  "sha256":                  hex.EncodeToString(digest[:]),
              }
              neutralBytes, err := json.Marshal(neutralValue)
              if err != nil {
                  return operational("selfcheck-positive-control-failed")
              }
              neutralBytes = append(neutralBytes, '\n')
              neutralFile := inputFile{name: "case-00.json", data: neutralBytes, mode: 0600}
              if err := writeFile(filepath.Join(neutral.caseDir, neutralFile.name), neutralBytes, neutralFile.mode); err != nil {
                  return operational("selfcheck-positive-control-failed")
              }
              neutral.caseFiles[0] = neutralFile
              neutralLog := []byte("{\"credential_source\":null,\"secret_material_waivers\":[]}\n")
              neutral.logData[0].data = neutralLog
              if err := writeFile(filepath.Join(neutral.root, neutral.logData[0].name), neutralLog, 0600); err != nil {
                  return operational("selfcheck-positive-control-failed")
              }
              if err := expectPass(neutral, false); err != nil {
                  return err
              }
              detailControl, err := prepareControl(filepath.Join(base, "failure-detail-safe"), 1)
              if err != nil {
                  return err
              }
              safeDetail := []byte("CAPTURE_DETAIL Package=public/package Test=TestPlantedFailure\nSAFE_FAILURE_DETAIL_CONTROL\n")
              if err := plantExpectedLog(&detailControl, "failure-details.txt", safeDetail); err != nil {
                  return err
              }
              if err := expectPass(detailControl, false); err != nil {
                  return err
              }
              exportedDetail, err := os.ReadFile(filepath.Join(detailControl.artifact, "failure-details.txt"))
              if err != nil || !bytes.Contains(exportedDetail, []byte("SAFE_FAILURE_DETAIL_CONTROL")) {
                  return operational("selfcheck-failure-detail-positive-failed")
              }
              privateDetailControl, err := prepareControl(filepath.Join(base, "failure-detail-private-path"), 1)
              if err != nil {
                  return err
              }
              privateDetail := []byte("CAPTURE_DETAIL Package=public/package Test=TestPrivatePath\nC:\\Users\\example\\private\\state\n")
              if err := plantControl(privateDetailControl, "log", "failure-details.txt", privateDetail); err != nil {
                  return err
              }
