name: Cold repository build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cold-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-repository:
    name: Cold repository install (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [hosted, target-linux]
    # Only same-repository runs can use the configured target Linux host.
    # Without that route this entry remains hosted and is labelled in the log.
    runs-on: ${{ matrix.lane == 'target-linux' && vars.LINUX_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","relux-linux","curator"]') || 'ubuntu-latest' }}
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize private Go state
        if: runner.os == 'Linux'
        run: bash .github/ci/isolate-go-state.sh
      - name: Record measurement host class
        env:
          MEASUREMENT_ROUTE: ${{ runner.environment }}
        run: |
          echo "measurement route=$MEASUREMENT_ROUTE; target evidence requires self-hosted"
          uptime
          echo "CURATOR_COLD_HOST_CLASS=$MEASUREMENT_ROUTE" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dependency acquisition is fixture preparation, outside the offline
      # driver. The driver itself still has no network or download path.
      - name: Prepare pinned public dependency fixture
        working-directory: internal/godriver/testdata/coldrepository
        run: bash ../../../../.github/ci/isolated-test.sh go mod vendor
      - name: Measure cold list and build through the real worker
        env:
          CURATOR_COLD_REPOSITORY: ${{ github.workspace }}/internal/godriver/testdata/coldrepository
        run: |
          set -euo pipefail
          bash .github/ci/isolated-test.sh go test -tags=curator_cold_repository -count=1 -json -timeout=25m ./internal/godriver -run '^TestColdRepositoryMeasurement$' | tee measurement-tests.json
          python3 .github/ci/required-tests.py measurement-tests.json TestColdRepositoryMeasurement
      - name: Full repository-driver install and PATH witness
        env:
          CURATOR_COLD_REPOSITORY: ${{ github.workspace }}/internal/godriver/testdata/coldrepository
        run: |
          set -euo pipefail
          bash .github/ci/isolated-test.sh go test -tags=curator_cold_repository -count=1 -json -timeout=25m ./cmd/curator -run '^TestColdRepositoryInstallOnPATH$' | tee install-tests.json
          python3 .github/ci/required-tests.py install-tests.json TestColdRepositoryInstallOnPATH
      - name: Deadline and protocol paired witnesses
        run: |
          set -euo pipefail
          bash .github/ci/isolated-test.sh go test -count=1 -json -timeout=10m ./internal/godriver -run '^Test(WorkerChannelFailureDistinguishesParentDeadline|RealWorkerParentDeadline|WorkerSharesWholeSessionBudget|BuildDeadlineTearsDownDescendants|BuildRejectsArtifactAfterParentDeadline|BuildRejectsArtifactDuringAcceptance|BuildCallerContextDiagnostics|BuildManagerLifecycle|WorkerEOFWhileShutdownQueued|WorkerCheckedKill|WorkerFailureKillsDescendants|WorkerTeardownStatusDiagnostic|WorkerExitNarrowingControls|BuildDescendantNarrowingControls|EveryControlSeamFailureRejectsBeforeTheWorkerExecutes|WorkerRejectsEveryProtocolDeviationBeforeTheCompiler)$' | tee deadline-tests.json
          python3 .github/ci/required-tests.py deadline-tests.json TestWorkerChannelFailureDistinguishesParentDeadline TestRealWorkerParentDeadline TestWorkerSharesWholeSessionBudget TestBuildDeadlineTearsDownDescendants TestBuildRejectsArtifactAfterParentDeadline TestBuildRejectsArtifactDuringAcceptance TestBuildCallerContextDiagnostics TestBuildManagerLifecycle TestWorkerEOFWhileShutdownQueued TestWorkerCheckedKill TestWorkerFailureKillsDescendants TestWorkerTeardownStatusDiagnostic TestWorkerExitNarrowingControls TestBuildDescendantNarrowingControls/omit-deadline-domain-termination TestEveryControlSeamFailureRejectsBeforeTheWorkerExecutes TestWorkerRejectsEveryProtocolDeviationBeforeTheCompiler
      - name: Restore runner temporary tree permissions
        if: always() && runner.environment == 'self-hosted'
        continue-on-error: true
        run: bash scripts/restore-runner-tmp.sh
