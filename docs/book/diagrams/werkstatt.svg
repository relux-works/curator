<svg xmlns="http://www.w3.org/2000/svg" width="778" height="692.5" viewBox="0 0 778 692.5">
<title>Рабочее место связывает чекаут, профиль и агентскую среду: чекаут остаётся рабочими данными, защищённые записи менеджера задают управляющие входы.</title>
<rect width="778" height="692.5" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(-8 0)">
<!-- graphviz 14.0.4 -->
<!-- group werkstatt -->
<rect x="8" y="333.7" width="754" height="334.8" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="werkstatt"/>
<!-- node repo -->
<rect x="193.6" y="0" width="178.8" height="109.9" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="repo"/>
<text x="214.1" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Исходный чекаут</tspan></text>
<text x="229" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">код как рабочие</tspan></text>
<text x="209.6" y="74.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">данные, управляющие</tspan></text>
<text x="211.3" y="93.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">файлы как кандидаты</tspan></text>
<!-- node profile -->
<rect x="442.1" y="32.3" width="241.8" height="45.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="profile"/>
<text x="458.1" y="58.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Lock выбранного профиля</tspan></text>
<!-- node records -->
<rect x="437.2" y="169.9" width="251.6" height="113.8" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="records"/>
<text x="509.7" y="196" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Защищённые</tspan></text>
<text x="488.7" y="219.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">записи менеджера</tspan></text>
<text x="481.7" y="248" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">регистрация, одобрения,</tspan></text>
<text x="453.2" y="267.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">поколение, композиция и аренда</tspan></text>
<!-- node home -->
<rect x="494.2" y="396.4" width="249.6" height="109.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="home"/>
<text x="546.1" y="422.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Управляемый дом</tspan></text>
<text x="525.1" y="451" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">корневой контекст профиля,</tspan></text>
<text x="516.5" y="470.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">в строгом режиме одобренный</tspan></text>
<text x="510.2" y="490" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">слой проекта, состояние харнеса</tspan></text>
<!-- node worktree -->
<rect x="25.6" y="394.4" width="196.8" height="113.8" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="worktree"/>
<text x="71.2" y="420.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Разрежённое</tspan></text>
<text x="60.5" y="443.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">рабочее дерево</tspan></text>
<text x="50.9" y="472.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">вне исходного дерева</tspan></text>
<text x="41.6" y="491.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и вне корней менеджера</tspan></text>
<!-- node harness -->
<rect x="149.3" y="577.8" width="245.3" height="70.9" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="harness"/>
<text x="211.1" y="603.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Сессия харнеса</tspan></text>
<text x="165.3" y="632.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">связана арендой с композицией</tspan></text>
<!-- note worktree -->
<rect x="265.6" y="386.7" width="206.8" height="129.2" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_worktree"/>
<text x="287.5" y="410" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Рабочее дерево не служит</tspan></text>
<text x="299.4" y="428.2" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">песочницей. В режиме</tspan></text>
<text x="277.6" y="446.4" font-size="14" fill="#4b5260"><tspan font-family="PT Mono, monospace">native-project</tspan><tspan x="398.9" font-family="PT Sans, sans-serif">дом несёт</tspan></text>
<text x="289.1" y="464.6" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">только корневой контекст</tspan></text>
<text x="277.6" y="482.8" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">профиля, а харнес сам читает</tspan></text>
<text x="279.6" y="501" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">управляющие файлы дерева.</tspan></text>
<path d="M 222.4 451.3 L 265.6 451.3" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="worktree" data-to="note_worktree"/>
<!-- note harness -->
<rect x="438.5" y="575.9" width="181.1" height="74.6" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_harness"/>
<text x="451.9" y="599.2" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Замена занятого сессией</tspan></text>
<text x="450.5" y="617.4" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">дома ждёт освобождения</tspan></text>
<text x="468.6" y="635.6" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">или получает отказ.</tspan></text>
<path d="M 394.7 613.2 L 438.5 613.2" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="harness" data-to="note_harness"/>
<!-- link repo -> records -->
<path d="M 353.1 110.2 C 372.7 124.5 394.3 139.3 415 151.9 C 422.8 156.6 431 161.4 439.3 166 L 440.4 166.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="repo" data-to="records" data-edge="e0"/>
<polygon points="445.7,169.5 439.1,160.7 434.7,168.6" fill="#3a3f47"/>
<g class="label" data-edge="e0">
<text x="378.2" y="116.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">осмотр и одобрение</tspan></text>
</g>
<!-- link profile -> records -->
<path d="M 563 77.8 C 563 99.1 563 132.6 563 162.3 L 563 163.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="profile" data-to="records" data-edge="e1"/>
<polygon points="563,169.7 567.5,159.7 558.5,159.7" fill="#3a3f47"/>
<g class="label" data-edge="e1">
<text x="571" y="144.1" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">привязка</tspan></text>
</g>
<!-- link records -> home -->
<path d="M 577.1 283.9 C 585.2 316 595.3 356.3 603.6 389.2 L 603.9 390.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="records" data-to="home" data-edge="e2"/>
<polygon points="605.4,396.1 607.3,385.3 598.6,387.5" fill="#3a3f47"/>
<g class="label" data-edge="e2">
<text x="590" y="318.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">материализация</tspan></text>
</g>
<!-- link repo -> worktree -->
<path d="M 261.1 110.4 C 231.8 182.9 180.2 310.9 149.3 387.4 L 148.9 388.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="repo" data-to="worktree" data-edge="e3"/>
<polygon points="146.6,394.2 154.5,386.6 146.2,383.3" fill="#3a3f47"/>
<g class="label" data-edge="e3">
<text x="239" y="201" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">явная подготовка</tspan></text>
</g>
<!-- link home -> harness -->
<path d="M 502.9 506.7 C 496.2 509.8 489.5 512.9 483 515.9 C 441 535.3 394.2 556.7 355.4 574.4 L 354.2 574.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="home" data-to="harness" data-edge="e4"/>
<polygon points="348.8,577.4 359.7,577.3 356,569.1" fill="#3a3f47"/>
<g class="label" data-edge="e4">
<text x="429.7" y="561.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">управляющие входы</tspan></text>
</g>
<!-- link worktree -> harness -->
<path d="M 176.2 508.7 C 195.7 529.7 217.3 553.1 235.2 572.4 L 236 573.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="worktree" data-to="harness" data-edge="e5"/>
<polygon points="240.1,577.7 236.6,567.3 230,573.4" fill="#3a3f47"/>
<g class="label" data-edge="e5">
<text x="223.9" y="550.4" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">рабочие данные</tspan></text>
</g>
<!-- group label werkstatt -->
<rect x="20" y="343.7" width="133.7" height="18.9" fill="#ffffff" class="plate"/>
<text x="26" y="358.1" font-size="13" fill="#2a62c4" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">РАБОЧЕЕ МЕСТО</tspan></text>
</g>
</g>
</svg>
