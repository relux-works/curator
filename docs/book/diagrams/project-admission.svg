<svg xmlns="http://www.w3.org/2000/svg" width="655.2" height="771.3" viewBox="0 0 655.2 771.3">
<title>Допуск контекста проекта: превью не выдаёт полномочий, только одобрение точного элемента вводит его в защищённое поколение.</title>
<rect width="655.2" height="771.3" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- graphviz 14.0.4 -->
<!-- node start -->
<circle cx="57.8" cy="64.6" r="11" fill="#3a3f47" class="box" data-id="start"/>
<!-- node reg -->
<rect x="112.6" y="9.6" width="262.5" height="109.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="reg"/>
<text x="131.6" y="35.7" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Зарегистрированный чекаут</tspan></text>
<text x="128.6" y="64.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">проверенная идентичность; режим</tspan></text>
<text x="132.1" y="83.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">источников и допуск независимы,</tspan></text>
<text x="146.1" y="103.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">по умолчанию</tspan><tspan x="244.3" font-family="PT Mono, monospace">strict</tspan><tspan x="302.3" font-family="PT Sans, sans-serif">и</tspan><tspan x="314.5" font-family="PT Mono, monospace">off</tspan></text>
<!-- node preview -->
<rect x="118.6" y="166.2" width="250.4" height="129.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="preview"/>
<text x="166.4" y="192.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Кандидат и превью</tspan></text>
<text x="170.5" y="220.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">кандидат читается как</tspan></text>
<text x="167.1" y="240.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">недоверенные данные;</tspan></text>
<text x="134.6" y="259.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">защищённый снимок показывает</tspan></text>
<text x="141.6" y="279.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">точный элемент и его эффекты</tspan></text>
<!-- node q -->
<rect x="144" y="332.6" width="199.6" height="115.6" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="q"/>
<text x="170.9" y="358.7" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Есть действующее</tspan></text>
<text x="177.3" y="382.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">одобрение этого</tspan></text>
<text x="160" y="405.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">элемента в пределах</tspan></text>
<text x="168.6" y="428.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">потолка политики?</tspan></text>
<!-- node gen -->
<rect x="23.9" y="519.9" width="219.9" height="45.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="gen"/>
<text x="39.9" y="546" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Одобренное поколение</tspan></text>
<!-- node inert -->
<rect x="278.6" y="508.2" width="180.4" height="68.8" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="inert"/>
<text x="294.6" y="534.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Кандидат остаётся</tspan></text>
<text x="328.7" y="557.7" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">инертным</tspan></text>
<!-- node comp -->
<rect x="0" y="614" width="253.7" height="133.3" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="comp"/>
<text x="30.8" y="640.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Композиция и проверка</tspan></text>
<text x="64.1" y="663.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">перед запуском</tspan></text>
<text x="21.9" y="692" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">lock профиля, поколение, среда</tspan></text>
<text x="43" y="711.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и политика; поверхности,</tspan></text>
<text x="16" y="731" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">исключение источников и аренда</tspan></text>
<!-- node refuse -->
<rect x="276" y="645.2" width="197.7" height="70.9" rx="12" fill="#fdeef3" stroke="#c8285f" stroke-width="2" class="box" data-id="refuse"/>
<text x="319.8" y="671.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Отказ запуска</tspan></text>
<text x="292" y="699.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">если элемент обязателен</tspan></text>
<!-- note reg -->
<rect x="418.4" y="0" width="212.8" height="129.2" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_reg"/>
<text x="434.4" y="23.3" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">В режиме</tspan><tspan x="497.7" font-family="PT Mono, monospace">native-project</tspan></text>
<text x="430.4" y="41.5" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">элемент контекста отказывает,</tspan></text>
<text x="444.9" y="59.7" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Curator доставляет только</tspan></text>
<text x="433.7" y="77.9" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">целые скиллы и MCP, а статус</tspan></text>
<text x="435" y="96.1" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и запуск сообщают</tspan><tspan x="555.9" font-family="PT Mono, monospace">project</tspan></text>
<text x="444" y="114.3" font-size="14" fill="#4b5260"><tspan font-family="PT Mono, monospace">sources</tspan><tspan x="506.5" font-family="PT Mono, monospace">not</tspan><tspan x="535.5" font-family="PT Mono, monospace">isolated</tspan><tspan x="602.7" font-family="PT Sans, sans-serif">.</tspan></text>
<path d="M 375.1 64.6 L 418.4 64.6" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="reg" data-to="note_reg"/>
<!-- note q -->
<rect x="387.6" y="344" width="180.5" height="92.8" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_q"/>
<text x="399.6" y="367.3" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Правка в чекауте создаёт</tspan></text>
<text x="421.6" y="385.5" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">нового кандидата.</tspan></text>
<text x="415" y="403.7" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Прежнее одобрение</tspan></text>
<text x="404" y="421.9" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">на него не переносится.</tspan></text>
<path d="M 343.6 390.4 L 387.6 390.4" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="q" data-to="note_q"/>
<!-- link start -> reg -->
<path d="M 69.1 64.6 C 81.1 64.6 93 64.6 105 64.6 L 106.4 64.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="start" data-to="reg" data-edge="e0"/>
<polygon points="112.4,64.6 102.4,60.1 102.4,69.1" fill="#3a3f47"/>
<!-- link reg -> preview -->
<path d="M 243.8 119.8 C 243.8 132.2 243.8 145.6 243.8 158.5 L 243.8 159.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="reg" data-to="preview" data-edge="e1"/>
<polygon points="243.8,165.7 248.3,155.7 239.3,155.7" fill="#3a3f47"/>
<!-- link preview -> q -->
<path d="M 243.8 296 C 243.8 305.5 243.8 315.4 243.8 325 L 243.8 326.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="preview" data-to="q" data-edge="e2"/>
<polygon points="243.8,332.2 248.3,322.2 239.3,322.2" fill="#3a3f47"/>
<!-- link q -> gen -->
<path d="M 201.9 448.6 C 185.6 470.9 167.6 495.5 154.2 513.8 L 153.4 514.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="q" data-to="gen" data-edge="e3"/>
<polygon points="149.8,519.8 159.4,514.4 152.1,509" fill="#3a3f47"/>
<g class="label" data-edge="e3">
<text x="202.5" y="473.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">да</tspan></text>
</g>
<!-- link q -> inert -->
<path d="M 291.4 448.6 C 306.4 466.6 322.7 486.1 336.4 502.6 L 337.1 503.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="q" data-to="inert" data-edge="e4"/>
<polygon points="340.9,508 338,497.5 331,503.2" fill="#3a3f47"/>
<g class="label" data-edge="e4">
<text x="342.3" y="494.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">нет</tspan></text>
</g>
<!-- link gen -> comp -->
<path d="M 132.7 565.8 C 132.1 577.1 131.4 591.6 130.6 606.4 L 130.5 607.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="gen" data-to="comp" data-edge="e5"/>
<polygon points="130.2,613.7 135.2,604 126.2,603.5" fill="#3a3f47"/>
<!-- link inert -> refuse -->
<path d="M 370.3 577.2 C 371.1 595.5 372.1 618.3 373 637.7 L 373 639" fill="none" stroke="#c8285f" stroke-width="2" class="edge" data-from="inert" data-to="refuse" data-edge="e6"/>
<polygon points="373.3,645 377.4,634.8 368.4,635.2" fill="#c8285f"/>
</g>
</svg>
