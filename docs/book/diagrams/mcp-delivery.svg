<path d="M 299.9 94.8 C 289.4 107.4 277.8 121.1 266.7 134.3 L 265.8 135.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="skillfile" data-to="pkg" data-edge="e1"/>
<polygon points="261.9,139.9 271.8,135.2 264.9,129.4" fill="#3a3f47"/>
<g class="label" data-edge="e1">
<text x="292.7" y="121.8" font-size="15" fill="#1f2328"><tspan font-family="PT Mono, monospace" font-weight="bold">package</tspan></text>
</g>
<!-- link skillfile -> qapprove -->
<path d="M 377.2 94.8 C 393 114.2 411.1 136.4 426.2 154.9 L 427 155.9" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="skillfile" data-to="qapprove" data-edge="e2"/>
<polygon points="430.8,160.6 427.9,150 420.9,155.6" fill="#3a3f47"/>
<g class="label" data-edge="e2">
<text x="406.3" y="121.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">адрес или</tspan><tspan x="476.2" font-family="PT Mono, monospace" font-weight="bold">server</tspan></text>
</g>
<!-- link pkg -> lock -->
<path d="M 187.7 250.3 C 180.9 263.1 173.8 276.7 167.1 289.4 L 166.5 290.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="pkg" data-to="lock" data-edge="e3"/>
<polygon points="163.7,295.9 172.3,289.1 164.3,284.9" fill="#3a3f47"/>
