<path d="M 458.2 230.1 C 458.2 250.4 458.2 276.4 458.2 298.1 L 458.2 299.6" fill="none" stroke="#c8285f" stroke-width="2" class="edge" data-from="qapprove" data-to="refuse" data-edge="e4"/>
<polygon points="458.2,305.6 462.7,295.6 453.7,295.6" fill="#c8285f"/>
<g class="label" data-edge="e4">
<text x="466.2" y="278.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">нет</tspan></text>
</g>
<!-- link qapprove -> approve -->
<path d="M 528.5 230.1 C 567.3 248.7 616.1 272.1 658.8 292.6 L 659.9 293.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="qapprove" data-to="approve" data-edge="e5"/>
<polygon points="665.3,295.8 658.2,287.4 654.3,295.5" fill="#3a3f47"/>
<g class="label" data-edge="e5">
<text x="634.5" y="268.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">да</tspan></text>
</g>
<!-- link lock -> preflight -->
<path d="M 253.6 387 C 274.9 395.4 297.3 404.2 319 412.7 L 320.2 413.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="lock" data-to="preflight" data-edge="e6"/>
<polygon points="325.7,415.4 318.1,407.5 314.8,415.9" fill="#3a3f47"/>
<!-- link approve -> preflight -->
<path d="M 644.1 387 C 622.4 395.5 599.6 404.4 577.5 413 L 576.3 413.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="approve" data-to="preflight" data-edge="e7"/>
<polygon points="570.7,415.7 581.6,416.2 578.3,407.9" fill="#3a3f47"/>
<!-- link preflight -> writer -->
<path d="M 363.8 519.8 C 360.7 523.2 357.8 526.8 355.2 530.5 C 349.4 538.8 345 548.4 341.7 558.2 L 341.2 559.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="preflight" data-to="writer" data-edge="e8"/>
<polygon points="339.4,565.3 346.7,557.1 338.1,554.5" fill="#3a3f47"/>
<g class="label" data-edge="e8">
<text x="359.4" y="547" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">писатель квалифицирован</tspan></text>
</g>
<!-- link preflight -> skipped -->
<path d="M 531.6 519.9 C 534.7 523.3 537.6 526.8 540.2 530.5 C 550.4 544.9 556.6 563.3 560.4 579.7 L 560.7 580.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="preflight" data-to="skipped" data-edge="e9"/>
