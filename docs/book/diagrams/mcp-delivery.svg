<svg xmlns="http://www.w3.org/2000/svg" width="904.5" height="836.2" viewBox="0 0 904.5 836.2">
<title>MCP проекта: сначала пакеты, декларации в проекте только после одобрения; запись нативной конфигурации и запуск идут после проверки.</title>
<rect width="904.5" height="836.2" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- graphviz 14.0.4 -->
<!-- node start -->
<circle cx="169.2" cy="47.2" r="11" fill="#3a3f47" class="box" data-id="start"/>
<!-- node skillfile -->
<rect x="223.9" y="0" width="230.6" height="94.3" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="skillfile"/>
<text x="295" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Проектный</tspan></text>
<text x="263.6" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Mono, monospace" font-weight="bold">Skillfile.json</tspan></text>
<text x="239.9" y="78.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">версия 3, поле</tspan><tspan x="339.5" font-family="PT Mono, monospace">mcp_servers</tspan></text>
<!-- node pkg -->
<rect x="107.1" y="140.3" width="218.3" height="109.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="pkg"/>
<text x="139.1" y="166.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Первый этап: пакет</tspan></text>
<text x="151.2" y="195" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">curator</tspan><tspan x="218.2" font-family="PT Mono, monospace">project</tspan></text>
<text x="139.1" y="214.5" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">resolve</tspan><tspan x="206.1" font-family="PT Mono, monospace">.</tspan><tspan x="215.1" font-family="PT Sans, sans-serif">: источники,</tspan></text>
<text x="123.1" y="234" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">подписанты, отзывы и аудит</tspan></text>
<!-- node lock -->
<rect x="0" y="296.2" width="280.4" height="90.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="lock"/>
<text x="16" y="322.3" font-size="18" fill="#1f2328"><tspan font-family="PT Mono, monospace" font-weight="bold">Skillfile.mcp-lock.json</tspan></text>
<text x="56.8" y="350.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и защищённая локальная</tspan></text>
<text x="92.5" y="370.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">запись Curator</tspan></text>
<!-- node qapprove -->
<rect x="372" y="160.8" width="172.4" height="68.8" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="qapprove"/>
<text x="395.8" y="186.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Есть одобрение</tspan></text>
<text x="388" y="210.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">имени в проекте?</tspan></text>
<!-- node refuse -->
<rect x="302.7" y="306" width="311" height="70.9" rx="12" fill="#fdeef3" stroke="#c8285f" stroke-width="2" class="box" data-id="refuse"/>
<text x="435.7" y="332.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Отказ</tspan></text>
<text x="318.7" y="360.6" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">mcp_inline_approval_unsupported</tspan></text>
<!-- node approve -->
<rect x="635.9" y="296.2" width="244.5" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="approve"/>
<text x="662.2" y="322.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Второй этап: одобрение</tspan></text>
<text x="662.9" y="350.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">дайджест нормализованного</tspan></text>
<text x="651.9" y="370.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">сервера, одобривший и потолок</tspan></text>
<!-- node preflight -->
<rect x="326.2" y="409.6" width="244.1" height="109.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="preflight"/>
<text x="348.2" y="435.7" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Проверка до публикации</tspan></text>
<text x="369.4" y="464.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">весь набор деклараций,</tspan></text>
<text x="342.2" y="483.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">одобрения, политика и прежнее</tspan></text>
<text x="347.3" y="503.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">содержимое нативных файлов</tspan></text>
<!-- node writer -->
<rect x="239.4" y="565.5" width="183.5" height="113.8" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="writer"/>
<text x="255.4" y="591.6" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Писатель нативной</tspan></text>
<text x="274.1" y="615" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">конфигурации</tspan></text>
<text x="264.5" y="643.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">не запускает сервер</tspan></text>
<text x="263.5" y="663.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и не проверяет вход</tspan></text>
<!-- node skipped -->
<rect x="445.3" y="587" width="241.8" height="70.9" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="skipped"/>
<text x="461.3" y="613.1" font-size="18" fill="#1f2328"><tspan font-family="PT Mono, monospace" font-weight="bold">skipped:</tspan><tspan x="552.3" font-family="PT Mono, monospace" font-weight="bold">unsupported</tspan></text>
<text x="467.8" y="641.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">исход пары в отчёте, без пути</tspan></text>
<!-- node launch -->
<rect x="202.3" y="702.3" width="257.8" height="109.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="launch"/>
<text x="218.3" y="728.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Квалифицированный запуск</tspan></text>
<text x="243.3" y="757" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">одобренный действующий</tspan></text>
<text x="221.9" y="776.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">набор; строгий режим исключает</tspan></text>
<text x="255.2" y="796" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">нативные MCP проекта</tspan></text>
<!-- link start -> skillfile -->
<path d="M 180.5 47.2 C 192.4 47.2 204.3 47.2 216.2 47.2 L 217.6 47.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="start" data-to="skillfile" data-edge="e0"/>
<polygon points="223.6,47.2 213.6,42.7 213.6,51.7" fill="#3a3f47"/>
