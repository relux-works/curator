<svg xmlns="http://www.w3.org/2000/svg" width="780" height="879" viewBox="0 0 780 879">
<title>Границы доверия: данные проекта, полномочия менеджера и среда исполнения.</title>
<rect width="780" height="879" fill="#ffffff"/>
<g transform="translate(12 12)">
<g transform="translate(-8 -8)">
<!-- graphviz 14.0.4 -->
<!-- group checkout -->
<rect x="82" y="8" width="496" height="180.9" rx="16" fill="none" stroke="#d9690f" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="checkout"/>
<!-- group manager -->
<rect x="105" y="228.9" width="659" height="161.4" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="manager"/>
<!-- group runtime -->
<rect x="8" y="430.3" width="520" height="295.4" rx="16" fill="none" stroke="#2f6fdb" stroke-width="2" stroke-dasharray="8 6" class="group" data-id="runtime"/>
<!-- node data -->
<rect x="100.3" y="93.3" width="219.3" height="45.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="data"/>
<text x="116.3" y="119.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Код и обычные данные</tspan></text>
<!-- node cand -->
<rect x="342" y="61" width="218" height="109.9" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="cand"/>
<text x="406.4" y="87.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Кандидаты</tspan></text>
<text x="375.8" y="115.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">контекст, скиллы, MCP;</tspan></text>
<text x="369.9" y="135.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">разрешения проекта как</tspan></text>
<text x="358" y="154.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">инертный запрос без гранта</tspan></text>
<!-- node policy -->
<rect x="123.2" y="281.9" width="239.6" height="90.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="policy"/>
<text x="161.6" y="308" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Политика оператора</tspan></text>
<text x="139.2" y="336.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">неотменяемые запреты; гранты</tspan></text>
<text x="155" y="356.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">агента в пределах потолка</tspan></text>
<!-- node approval -->
<rect x="531.5" y="281.9" width="215" height="90.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="approval"/>
<text x="547.5" y="308" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Одобренный дайджест</tspan></text>
<text x="564.7" y="336.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">идентичность проекта,</tspan></text>
<text x="566.6" y="356.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">композиция и аренды</tspan></text>
<!-- node copies -->
<rect x="174.3" y="448.3" width="217.4" height="90.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="copies"/>
<text x="203.6" y="474.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Защищённые копии</tspan></text>
<text x="190.6" y="503" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">корневой контекст профиля</tspan></text>
<text x="190.3" y="522.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и одобренный слой проекта</tspan></text>
<!-- node harness -->
<rect x="25.6" y="562.3" width="240.8" height="109.9" rx="12" fill="#f3effd" stroke="#7c4ddb" stroke-width="2" class="box" data-id="harness"/>
<text x="117.7" y="588.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Харнес</tspan></text>
<text x="41.6" y="616.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">запрет по умолчанию, нативная</tspan></text>
<text x="41.6" y="636.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">память выключена, исключение</tspan></text>
<text x="47" y="655.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">источников в строгом режиме</tspan></text>
<!-- node os -->
<rect x="27.2" y="768.7" width="237.7" height="94.3" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="os"/>
<text x="66.5" y="794.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ОС или доверенный</tspan></text>
<text x="95.8" y="818.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">исполнитель</tspan></text>
<text x="43.2" y="846.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">отдельная граница исполнения</tspan></text>
<!-- note harness -->
<rect x="310.1" y="561.7" width="199.8" height="111" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_harness"/>
<text x="322.1" y="585" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Управляемый дом не служит</tspan></text>
<text x="329.7" y="603.2" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">песочницей ОС. В режиме</tspan></text>
<text x="328" y="621.4" font-size="14" fill="#4b5260"><tspan font-family="PT Mono, monospace">native-project</tspan><tspan x="449.3" font-family="PT Sans, sans-serif">харнес</tspan></text>
<text x="333" y="639.6" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">сам читает управляющие</tspan></text>
<text x="363.1" y="657.8" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">файлы чекаута.</tspan></text>
<path d="M 266.4 617.2 L 310.1 617.2" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="harness" data-to="note_harness"/>
<!-- link cand -> approval -->
<path d="M 499.9 171.4 C 529 203.7 565.7 244.5 594 276.1 L 594.9 277" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="cand" data-to="approval" data-edge="e0"/>
<polygon points="598.9,281.5 595.5,271 588.9,277.1" fill="#3a3f47"/>
<g class="label" data-edge="e0">
<text x="584.1" y="250.2" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">аудит и одобрение</tspan></text>
</g>
<!-- link policy -> approval -->
<path d="M 363.2 327.1 C 414.1 327.1 473.3 327.1 523.7 327.1 L 525.1 327.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="policy" data-to="approval" data-edge="e1"/>
<polygon points="531.1,327.1 521.1,322.6 521.1,331.6" fill="#3a3f47"/>
<g class="label" data-edge="e1">
<text x="378" y="315.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ограничивает допуск</tspan></text>
</g>
<!-- link approval -> copies -->
<path d="M 542.7 372.6 C 494.3 394.9 435.6 422 386.3 444.8 L 385.2 445.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="approval" data-to="copies" data-edge="e2"/>
<polygon points="379.7,447.8 390.7,447.7 386.9,439.6" fill="#3a3f47"/>
<g class="label" data-edge="e2">
<text x="486.3" y="414.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">проверка перед доставкой и стартом</tspan></text>
</g>
<!-- link copies -> harness -->
<path d="M 232.8 539.1 C 226.1 545.1 219.1 551.2 212.2 557.4 L 211.4 558.1" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="copies" data-to="harness" data-edge="e3"/>
<polygon points="206.9,562.1 217.4,558.8 211.4,552.1" fill="#3a3f47"/>
<!-- link data -> harness -->
<path d="M 177.3 139 C 150.8 158.9 115.5 191 100 228.9 C 55.6 337.5 92.4 476.5 120.8 555 L 121.3 556.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="data" data-to="harness" data-edge="e4"/>
<polygon points="123.3,562 124.1,551 115.7,554.1" fill="#3a3f47"/>
<g class="label" data-edge="e4">
<text x="89.8" y="414.8" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">рабочие данные через инструменты</tspan></text>
</g>
<!-- link harness -> os -->
<path d="M 146 672.5 C 146 700.1 146 733.6 146 761.2 L 146 762.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="harness" data-to="os" data-edge="e5"/>
<polygon points="146,768.5 150.5,758.5 141.5,758.5" fill="#3a3f47"/>
<g class="label" data-edge="e5">
<text x="154" y="748.5" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">реальное действие</tspan></text>
</g>
<!-- group label checkout -->
<rect x="94" y="18" width="67.8" height="18.9" fill="#ffffff" class="plate"/>
<text x="100" y="32.4" font-size="13" fill="#b9580b" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ЧЕКАУТ</tspan></text>
<!-- group label manager -->
<rect x="117" y="238.9" width="310.4" height="18.9" fill="#ffffff" class="plate"/>
<text x="123" y="253.2" font-size="13" fill="#2a62c4" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">ЗАЩИЩЁННОЕ СОСТОЯНИЕ МЕНЕДЖЕРА</tspan></text>
<!-- group label runtime -->
<rect x="275.6" y="696.8" width="240.4" height="18.9" fill="#ffffff" class="plate"/>
<text x="281.6" y="711.2" font-size="13" fill="#2a62c4" letter-spacing="2.1"><tspan font-family="PT Sans, sans-serif" font-weight="bold">КВАЛИФИЦИРОВАННАЯ СРЕДА</tspan></text>
</g>
</g>
</svg>
