<svg xmlns="http://www.w3.org/2000/svg" width="572.7" height="643.4" viewBox="0 0 572.7 643.4">
<title>Из деклараций менеджер получает проверенное замыкание и lock, затем материализует управляемые поверхности дома.</title>
<rect width="572.7" height="643.4" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- graphviz 14.0.4 -->
<!-- node pkg -->
<rect x="4.6" y="1.9" width="196.9" height="90.4" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="pkg"/>
<text x="27.1" y="28" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Контекстный пакет</tspan></text>
<text x="20.6" y="56.6" font-size="15" fill="#4b5260"><tspan font-family="PT Mono, monospace">agent-context.json</tspan><tspan x="182.6" font-family="PT Sans, sans-serif">,</tspan></text>
<text x="32.7" y="76.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">модули и требования</tspan></text>
<!-- node overlay -->
<rect x="223.3" y="0" width="243.7" height="94.3" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="overlay"/>
<text x="311" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Оверлеи</tspan></text>
<text x="265.6" y="49.5" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">и политика машины</tspan></text>
<text x="239.3" y="78" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">машинная композиция профиля</tspan></text>
<!-- node resolve -->
<rect x="113.4" y="130.3" width="221.4" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="resolve"/>
<text x="129.4" y="156.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Разрешение замыкания</tspan></text>
<text x="155.7" y="184.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">проверки источника,</tspan></text>
<text x="155.9" y="204.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">подписанта и аудита</tspan></text>
<!-- node lock -->
<rect x="0" y="266.4" width="224.2" height="70.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="lock"/>
<text x="57.2" y="292.6" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Lock профиля</tspan></text>
<text x="16" y="321.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">участники замыкания и пины</tspan></text>
<!-- node store -->
<rect x="246.1" y="256.7" width="182" height="90.4" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="store"/>
<text x="291.2" y="282.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хранилище</tspan></text>
<text x="292.7" y="311.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">проверенные</tspan></text>
<text x="262.1" y="330.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">неизменяемые снимки</tspan></text>
<!-- node materialize -->
<rect x="138.9" y="383.1" width="170.5" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="materialize"/>
<text x="157.5" y="409.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Материализация</tspan></text>
<text x="154.9" y="437.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">lock, агентская среда</tspan></text>
<text x="169.1" y="457.3" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и форма запуска</tspan></text>
<!-- node home -->
<rect x="106.4" y="509.5" width="235.5" height="109.9" rx="12" fill="#e7f5f1" stroke="#11826d" stroke-width="2" class="box" data-id="home"/>
<text x="151.2" y="535.6" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Управляемый дом</tspan></text>
<text x="150.7" y="564.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">корневые инструкции,</tspan></text>
<text x="162.5" y="583.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">проекции скиллов,</tspan></text>
<text x="122.4" y="603.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">управляемые каналы и маркер</tspan></text>
<!-- note home -->
<rect x="363.5" y="518.1" width="185.3" height="92.8" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_home"/>
<text x="400.2" y="541.4" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Начальные файлы</tspan></text>
<text x="380" y="559.6" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">и изменяемое состояние</tspan></text>
<text x="375.5" y="577.8" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">харнеса лежат в доме под</tspan></text>
<text x="385.7" y="596" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">отдельным владением.</tspan></text>
<path d="M 341.8 564.5 L 363.5 564.5" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="home" data-to="note_home"/>
<!-- link pkg -> resolve -->
<path d="M 145.8 92.7 C 155.7 103.1 166.4 114.2 176.5 124.8 L 177.3 125.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="pkg" data-to="resolve" data-edge="e0"/>
<polygon points="181.4,129.9 177.8,119.6 171.3,125.8" fill="#3a3f47"/>
<!-- link overlay -> resolve -->
<path d="M 300.7 94.5 C 291.3 104.3 281.3 114.7 271.8 124.7 L 271 125.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="overlay" data-to="resolve" data-edge="e1"/>
<polygon points="266.9,129.9 277,125.7 270.5,119.5" fill="#3a3f47"/>
<!-- link resolve -> lock -->
<path d="M 184 221.1 C 172.3 234 159.7 248 148.3 260.7 L 147.5 261.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="resolve" data-to="lock" data-edge="e2"/>
<polygon points="143.5,266 153.6,261.6 146.9,255.6" fill="#3a3f47"/>
<!-- link resolve -> store -->
<path d="M 264.6 221.1 C 273.4 230.7 282.7 241 291.6 250.8 L 292.5 251.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="resolve" data-to="store" data-edge="e3"/>
<polygon points="296.5,256.2 293.2,245.8 286.5,251.9" fill="#3a3f47"/>
<!-- link lock -> materialize -->
<path d="M 143.3 337.6 C 154.5 350 167.4 364.3 179.5 377.7 L 180.2 378.6" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="lock" data-to="materialize" data-edge="e4"/>
<polygon points="184.3,383 180.9,372.6 174.2,378.6" fill="#3a3f47"/>
<!-- link store -> materialize -->
<path d="M 296.6 347.5 C 287.9 357.1 278.6 367.4 269.6 377.2 L 268.7 378.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="store" data-to="materialize" data-edge="e5"/>
<polygon points="264.7,382.6 274.7,378.3 268.1,372.2" fill="#3a3f47"/>
<!-- link materialize -> home -->
<path d="M 224.1 474 C 224.1 482.9 224.1 492.4 224.1 501.7 L 224.1 503.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="materialize" data-to="home" data-edge="e6"/>
<polygon points="224.1,509.2 228.6,499.2 219.6,499.2" fill="#3a3f47"/>
</g>
</svg>
