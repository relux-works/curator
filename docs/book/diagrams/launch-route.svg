<svg xmlns="http://www.w3.org/2000/svg" width="608.7" height="778.6" viewBox="0 0 608.7 778.6">
<title>Маршрут запуска: делегированный запрос читает живой управляемый дом, точный план связывает снимок и полный процесс; оба собираются через общую библиотеку сборки.</title>
<rect width="608.7" height="778.6" fill="#ffffff"/>
<g transform="translate(12 12)">
<!-- graphviz 14.0.4 -->
<!-- node start -->
<circle cx="86.2" cy="55" r="11" fill="#3a3f47" class="box" data-id="start"/>
<!-- node run -->
<rect x="140.3" y="0" width="255.7" height="109.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="run"/>
<text x="211.9" y="26.1" font-size="18" fill="#1f2328"><tspan font-family="PT Mono, monospace" font-weight="bold">curator</tspan><tspan x="292" font-family="PT Mono, monospace" font-weight="bold">run</tspan></text>
<text x="162.6" y="54.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">разрешает профиль и политику;</tspan></text>
<text x="156.3" y="74.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">fragment называет арендованный</tspan></text>
<text x="202.4" y="93.7" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">дом рабочего места</tspan></text>
<!-- node q -->
<rect x="148.1" y="132.9" width="240.2" height="92.2" rx="12" fill="#f6f7f9" stroke="#8b929c" stroke-width="2" class="box" data-id="q"/>
<text x="216.6" y="159" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Точный план</tspan></text>
<text x="164.1" y="182.4" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">квалифицирован для этой</tspan></text>
<text x="169.1" y="205.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">среды и формы запуска?</tspan></text>
<!-- node del -->
<rect x="0" y="280.9" width="258.3" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="del"/>
<text x="32.3" y="307" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Делегированный запрос</tspan></text>
<text x="16" y="335.5" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">пин профиля и дайджест fragment</tspan></text>
<!-- node mgr -->
<rect x="27.8" y="384.5" width="250.8" height="133.3" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="mgr"/>
<text x="83.7" y="410.6" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Часть менеджера</tspan></text>
<text x="51.2" y="434" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">на стороне вызывающего</tspan></text>
<text x="49.1" y="462.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">собирает процесс через общую</tspan></text>
<text x="59.4" y="482.1" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">библиотеку сборки; процесс</tspan></text>
<text x="43.8" y="501.6" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">читает живой арендованный дом</tspan></text>
<!-- node prep -->
<rect x="279.8" y="271.1" width="256.6" height="90.4" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="prep"/>
<text x="295.8" y="297.2" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Подготовка ресурсов сессии</tspan></text>
<text x="298.7" y="325.8" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">одобренный контекст становится</tspan></text>
<text x="302.4" y="345.2" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">проверенным частным снимком</tspan></text>
<!-- node plan -->
<rect x="304.1" y="396.2" width="200.1" height="109.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="plan"/>
<text x="320.1" y="422.3" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Точный план запуска</tspan></text>
<text x="328" y="450.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">полный неизменяемый</tspan></text>
<text x="335.4" y="470.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">план процесса через</tspan></text>
<text x="321.9" y="489.9" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">ту же библиотеку сборки</tspan></text>
<!-- node verify -->
<rect x="250.9" y="540.8" width="260.5" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="verify"/>
<text x="266.9" y="566.9" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хост проверяет точный план</tspan></text>
<text x="329.2" y="595.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">без пересборки</tspan></text>
<!-- node host -->
<rect x="79.7" y="634.7" width="257" height="70.9" rx="12" fill="#ebf2ff" stroke="#2f6fdb" stroke-width="2" class="box" data-id="host"/>
<text x="102.6" y="660.8" font-size="18" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">Хост сессий ведёт процесс</tspan></text>
<text x="95.7" y="689.4" font-size="15" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">attach, resume и состояние сессии</tspan></text>
<!-- node end -->
<circle cx="208.2" cy="741.6" r="12" fill="#ffffff" stroke="#3a3f47" stroke-width="2" class="box" data-id="end"/>
<circle cx="208.2" cy="741.6" r="6.5" fill="#3a3f47"/>
<!-- note q -->
<rect x="431.6" y="141.7" width="153.1" height="74.6" rx="10" fill="#f6f7f9" stroke="#d5d9df" stroke-width="1.2" class="note" data-id="note_q"/>
<text x="459.1" y="165" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">Отказ на любом</tspan></text>
<text x="449.9" y="183.2" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">шаге не переходит</tspan></text>
<text x="443.6" y="201.4" font-size="14" fill="#4b5260"><tspan font-family="PT Sans, sans-serif">к нативному запуску.</tspan></text>
<path d="M 388.2 179 L 431.6 179" fill="none" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4" class="connector" data-from="q" data-to="note_q"/>
<!-- link start -> run -->
<path d="M 97.5 55 C 109.2 55 120.9 55 132.6 55 L 133.9 55" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="start" data-to="run" data-edge="e0"/>
<polygon points="139.9,55 129.9,50.5 129.9,59.5" fill="#3a3f47"/>
<!-- link run -> q -->
<path d="M 268.2 110.2 C 268.2 115.2 268.2 120.4 268.2 125.4 L 268.2 126.7" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="run" data-to="q" data-edge="e1"/>
<polygon points="268.2,132.7 272.7,122.7 263.7,122.7" fill="#3a3f47"/>
<!-- link q -> del -->
<path d="M 221.5 225.4 C 204.9 241.6 186.4 259.6 170.3 275.3 L 169.2 276.3" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="q" data-to="del" data-edge="e2"/>
<polygon points="164.9,280.5 175.2,276.7 169,270.3" fill="#3a3f47"/>
<g class="label" data-edge="e2">
<text x="200.4" y="265.7" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">нет</tspan></text>
</g>
<!-- link q -> prep -->
<path d="M 315.2 225.4 C 328.5 238.3 343.1 252.4 356.6 265.5 L 357.7 266.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="q" data-to="prep" data-edge="e3"/>
<polygon points="362,270.7 357.9,260.5 351.7,267" fill="#3a3f47"/>
<g class="label" data-edge="e3">
<text x="354.7" y="252.6" font-size="15" fill="#1f2328"><tspan font-family="PT Sans, sans-serif" font-weight="bold">да</tspan></text>
</g>
<!-- link del -> mgr -->
<path d="M 135.5 352.2 C 136.9 359.9 138.4 368.3 139.9 376.9 L 140.2 378.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="del" data-to="mgr" data-edge="e4"/>
<polygon points="141.2,384.1 143.9,373.5 135,375.1" fill="#3a3f47"/>
<!-- link prep -> plan -->
<path d="M 406.8 361.9 C 406.6 370.4 406.3 379.4 406 388.3 L 406 389.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="prep" data-to="plan" data-edge="e5"/>
<polygon points="405.8,395.8 410.6,385.9 401.6,385.6" fill="#3a3f47"/>
<!-- link plan -> verify -->
<path d="M 394 506.5 C 392.3 515.6 390.6 524.8 389 533.5 L 388.7 534.8" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="plan" data-to="verify" data-edge="e6"/>
<polygon points="387.6,540.7 393.9,531.6 385,530" fill="#3a3f47"/>
<!-- link mgr -> host -->
<path d="M 169.9 518.1 C 178.9 553.6 189.7 596.2 197.5 627.1 L 197.9 628.5" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="mgr" data-to="host" data-edge="e7"/>
<polygon points="199.3,634.3 201.2,623.5 192.5,625.7" fill="#3a3f47"/>
<!-- link verify -> host -->
<path d="M 315.8 612 C 304.2 618.1 292.1 624.5 280.4 630.8 L 279.2 631.4" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="verify" data-to="host" data-edge="e8"/>
<polygon points="273.9,634.2 284.9,633.5 280.7,625.5" fill="#3a3f47"/>
<!-- link host -> end -->
<path d="M 208.2 705.9 C 208.2 711 208.2 716.1 208.2 720.8 L 208.2 722.2" fill="none" stroke="#3a3f47" stroke-width="2" class="edge" data-from="host" data-to="end" data-edge="e9"/>
<polygon points="208.2,728.2 212.7,718.2 203.7,718.2" fill="#3a3f47"/>
</g>
</svg>
