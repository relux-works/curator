version: 2

project_name: curator
dist: .tmp/dist

before:
  hooks:
    - python3 release/bundle.py prepare

builds:
  - id: curator
    main: ./cmd/curator
    binary: curator
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/relux-works/curator/internal/version.value=v{{ .Version }}

  # Exported only after the annotated tag, commit and release signer match.
  - id: curator-run
    dir: .tmp/curator-run
    main: ./cmd/curator-run
    binary: curator-run
    env: [CGO_ENABLED=0, GOFLAGS=-mod=readonly, GOTOOLCHAIN=go1.25.5]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=false]
    ldflags:
      - -s -w -buildid= -X main.buildVersion=0.5.0
    hooks:
      post:
        - cmd: 'python3 release/bundle.py binary "{{ .Path }}"'
          dir: .

archives:
  - id: default
    ids: [curator, curator-run]
    allow_different_binary_count: true
    name_template: "curator_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - release/curator-run.json
      - src: .tmp/curator-run/LICENSE
        dst: licenses/curator-run/LICENSE
      - src: .tmp/curator-run/NOTICE
        dst: licenses/curator-run/NOTICE

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# Both macOS binaries use the same Developer ID and notarization inputs.
# Real releases require these credentials; snapshots explicitly skip signing.
notarize:
  macos:
    - enabled: '{{ not .IsSnapshot }}'
      ids: [curator, curator-run]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_P12_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.ASC_ISSUER_ID }}"
        key_id: "{{ .Env.ASC_KEY_ID }}"
        key: "{{ .Env.ASC_KEY_P8 }}"
        wait: true
        timeout: 20m

# Keyless cosign signatures over the checksums file: verifying it transitively
# verifies every artifact hash.
signs:
  - cmd: bash
    certificate: "${artifact}.pem"
    args:
      - release/sign-checksums.sh
      - "${artifact}"
      - "${certificate}"
      - "${signature}"
    artifacts: checksum
    output: true

nfpms:
  - id: packages
    ids: [curator, curator-run]
    file_name_template: "curator_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    package_name: curator
    vendor: Relux Works, LLC
    homepage: https://github.com/relux-works/curator
    maintainer: Ivan Oparin <oparin@me.com>
    description: Agent environment manager
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    deb:
      compression: gzip
    rpm:
      compression: gzip
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/curator/LICENSE
      - src: NOTICE
        dst: /usr/share/licenses/curator/NOTICE
      - src: .tmp/curator-run/LICENSE
        dst: /usr/share/licenses/curator-run/LICENSE
      - src: .tmp/curator-run/NOTICE
        dst: /usr/share/licenses/curator-run/NOTICE
      - src: release/curator-run.json
        dst: /usr/share/doc/curator/curator-run.json

homebrew_casks:
  - name: curator
    binaries: [curator, curator-run]
    # A release candidate must not replace the stable formula: `auto` skips the
    # upload whenever the release is a prerelease. v0.14.0-rc.1 reached the tap
    # because this was unset.
    skip_upload: "auto"
    repository:
      owner: relux-works
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/relux-works/curator
    description: Agent environment manager
    license: Apache-2.0

scoops:
  - name: curator
    # Windows carries Curator only.
    # Same reason as the cask above.
    skip_upload: "auto"
    repository:
      owner: relux-works
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/relux-works/curator
    description: Agent environment manager
    license: Apache-2.0

# Maintained with the Curator release channels. No second launcher package.
aurs:
  - name: curator-bin
    ids: [default]
    skip_upload: "auto"
    homepage: https://github.com/relux-works/curator
    description: Curator environment manager with curator-run
    license: Apache-2.0
    maintainers: ["Ivan Oparin <ivan@relux.works>"]
    provides: [curator]
    conflicts: [curator]
    git_url: ssh://aur@aur.archlinux.org/curator-bin.git
    private_key: "{{ .Env.AUR_SSH_PRIVATE_KEY }}"
    package: |-
      install -Dm755 curator "${pkgdir}/usr/bin/curator"
      install -Dm755 curator-run "${pkgdir}/usr/bin/curator-run"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/curator/LICENSE"
      install -Dm644 NOTICE "${pkgdir}/usr/share/licenses/curator/NOTICE"
      install -Dm644 licenses/curator-run/LICENSE "${pkgdir}/usr/share/licenses/curator-run/LICENSE"
      install -Dm644 licenses/curator-run/NOTICE "${pkgdir}/usr/share/licenses/curator-run/NOTICE"
      install -Dm644 release/curator-run.json "${pkgdir}/usr/share/doc/curator/curator-run.json"

release:
  github:
    owner: relux-works
    name: curator
  draft: false
  # `auto` marks the GitHub release as a prerelease when the tag carries a
  # SemVer prerelease suffix, so an rc says what it is on the releases page
  # instead of appearing as the latest stable download.
  prerelease: "auto"
  footer: |
    ## Verify what you downloaded

    ```bash
    gh attestation verify <artifact> --owner relux-works
    cosign verify-blob \
      --certificate checksums.txt.pem --signature checksums.txt.sig \
      --certificate-identity-regexp 'github.com/relux-works/curator' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    ```

changelog:
  use: github
